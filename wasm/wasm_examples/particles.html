<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Particles - Real WASM Physics</title>
    <!-- Rebuild glue with: python3 wasm/flow_wasm.py wasm/wasm_examples/particles.flow -o wasm/wasm_examples -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        
        h1 {
            color: #ff7b72;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        
        .badge {
            background: #ff7b72;
            color: #000;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        canvas {
            background: #0a0a0a;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        
        .info {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #8b949e;
            text-align: center;
        }
        
        .stats {
            font-family: 'JetBrains Mono', monospace;
            margin-top: 0.5rem;
            color: #3fb950;
        }
        
        .controls {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
        }
        
        button {
            background: #21262d;
            color: #e6edf3;
            border: 1px solid #30363d;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        
        button:hover { background: #30363d; }
        button.active { background: #ff7b72; color: #000; border-color: #ff7b72; }
        
        footer {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #6e7681;
        }
        
        footer a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>⚛️ Particle Physics</h1>
    <span class="badge">REAL WASM - 7.6KB</span>
    
    <canvas id="canvas" width="700" height="500"></canvas>
    
    <div class="info">
        200 particles with gravity, friction, and wall bouncing<br>
        <strong>Physics computed in WebAssembly</strong>, rendering in JS
    </div>
    
    <div class="stats" id="stats">Loading WASM...</div>
    
    <div class="controls">
        <button id="pauseBtn" class="active">⏸ Pause</button>
        <button id="resetBtn">🔄 Reset</button>
    </div>
    
    <footer>
        <a href="../../">← Back</a> · 
        <a href="particles.flow">View Flow Source</a> · 
        <a href="particles.c">View Generated C</a>
    </footer>
    
    <!-- Module config MUST come before loading particles.js -->
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        
        let particlePtr = 0;
        let running = true;
        let frameCount = 0;
        let lastFps = 0;
        let lastTime = performance.now();
        
        // Configure Module BEFORE loading particles.js
        var Module = {
            onRuntimeInitialized: function() {
                console.log('WASM Runtime initialized');
                console.log('Exports:', Object.keys(Module).filter(k => k.startsWith('_')));
                
                // Initialize particles - call the exported function
                particlePtr = Module._particle_init_f64_f64(W, H);
                console.log('Particle pointer:', particlePtr);
                
                if (particlePtr === 0) {
                    document.getElementById('stats').textContent = 'Error: malloc failed';
                    return;
                }
                
                document.getElementById('stats').textContent = 'WASM loaded! Click canvas to add energy.';
                
                // Start animation loop
                requestAnimationFrame(animate);
            }
        };
        
        function animate() {
            if (running && particlePtr) {
                // Step physics in WASM
                Module._particle_step_ptr_f64_f64_f64(particlePtr, W, H);
            }
            
            // Render
            render();
            
            // FPS counter
            frameCount++;
            const now = performance.now();
            if (now - lastTime > 500) {
                lastFps = Math.round(frameCount / (now - lastTime) * 1000);
                frameCount = 0;
                lastTime = now;
                document.getElementById('stats').textContent = 
                    `FPS: ${lastFps} | Physics: WASM | Particles: 200`;
            }
            
            requestAnimationFrame(animate);
        }
        
        function render() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, W, H);
            
            if (!particlePtr || !Module.HEAPF64) {
                ctx.fillStyle = '#888';
                ctx.font = '14px sans-serif';
                ctx.fillText('Loading WASM...', 10, 25);
                return;
            }
            
            // Read from WASM memory
            const heap = Module.HEAPF64;
            const base = particlePtr >> 3;  // byte offset to f64 index
            
            for (let i = 0; i < 200; i++) {
                const idx = base + i * 4;
                const x = heap[idx];
                const y = heap[idx + 1];
                const vx = heap[idx + 2];
                const vy = heap[idx + 3];
                
                if (isNaN(x) || isNaN(y)) continue;
                
                // Color based on velocity (yellow to red)
                const speed = Math.sqrt(vx * vx + vy * vy);
                const hue = Math.max(0, 60 - speed * 10);
                ctx.fillStyle = `hsl(${hue}, 100%, 55%)`;
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Controls
        document.getElementById('pauseBtn').onclick = function() {
            running = !running;
            this.textContent = running ? '⏸ Pause' : '▶ Play';
            this.classList.toggle('active', running);
        };
        
        document.getElementById('resetBtn').onclick = function() {
            if (Module._particle_init_f64_f64) {
                particlePtr = Module._particle_init_f64_f64(W, H);
            }
        };
        
        // Click to explode particles
        canvas.onclick = function(e) {
            if (!particlePtr || !Module.HEAPF64) return;
            
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            
            const heap = Module.HEAPF64;
            const base = particlePtr >> 3;
            
            for (let i = 0; i < 200; i++) {
                const idx = base + i * 4;
                const x = heap[idx];
                const y = heap[idx + 1];
                
                const dx = x - clickX;
                const dy = y - clickY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 150 && dist > 1) {
                    const force = (150 - dist) / 8;
                    heap[idx + 2] += (dx / dist) * force;
                    heap[idx + 3] += (dy / dist) * force;
                }
            }
        };
    </script>
    <!-- Load WASM module AFTER Module is configured -->
    <script src="particles.js"></script>
</body>
</html>
