name: Install Flow toolchain
description: Clang (system) plus MLIR tools with apt caching

inputs:
  mlir:
    description: Install MLIR tools (mlir-opt / mlir-translate)
    required: false
    default: 'false'
  shellcheck:
    description: Install shellcheck
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache apt archives
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/flow-apt-cache
        key: ${{ runner.os }}-flow-apt-v2-${{ inputs.mlir }}-${{ inputs.shellcheck }}

    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && [ -d ~/flow-apt-cache ]; then
          sudo dpkg -i ~/flow-apt-cache/*.deb 2>/dev/null || true
        fi
        packages=()
        if [ "${{ inputs.mlir }}" = "true" ]; then
          packages+=(mlir-18-tools)
        fi
        if [ "${{ inputs.shellcheck }}" = "true" ]; then
          packages+=(shellcheck)
        fi
        if [ "${#packages[@]}" -gt 0 ]; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
        fi
        if [ "${{ inputs.mlir }}" = "true" ]; then
          sudo ln -sf /usr/bin/mlir-opt-18 /usr/local/bin/mlir-opt
          sudo ln -sf /usr/bin/mlir-translate-18 /usr/local/bin/mlir-translate
          mlir-opt --version
          mlir-translate --version
        fi
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ] && [ "${#packages[@]}" -gt 0 ]; then
          mkdir -p ~/flow-apt-cache
          cp /var/cache/apt/archives/*.deb ~/flow-apt-cache/ 2>/dev/null || true
        fi
        clang --version