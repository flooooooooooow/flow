name: Install Flow toolchain
description: Clang (system), or LLVM/MLIR 22 from apt.llvm.org when mlir is set, with apt caching

inputs:
  mlir:
    description: Install LLVM/MLIR 22 (mlir-opt, mlir-translate, clang) and put it first on PATH
    required: false
    default: 'false'
  shellcheck:
    description: Install shellcheck
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache apt archives
      id: apt-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/flow-apt-cache
        key: ${{ runner.os }}-flow-apt-v3-llvm22-${{ inputs.mlir }}-${{ inputs.shellcheck }}

    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && [ -d ~/flow-apt-cache ]; then
          sudo dpkg -i ~/flow-apt-cache/*.deb 2>/dev/null || true
        fi
        packages=()
        if [ "${{ inputs.mlir }}" = "true" ]; then
          # LLVM/MLIR 22 from apt.llvm.org: the MLIR goldens were recorded
          # with LLVM 22, and the IR it writes needs a clang of the same major.
          curl -fsSL -o /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 22
          packages+=(mlir-22-tools libmlir-22-dev)
        fi
        if [ "${{ inputs.shellcheck }}" = "true" ]; then
          packages+=(shellcheck)
        fi
        if [ "${#packages[@]}" -gt 0 ]; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
        fi
        if [ "${{ inputs.mlir }}" = "true" ]; then
          # Every LLVM tool (mlir-opt, mlir-translate, clang, opt, llc) comes
          # from 22, in this step and in the steps after it.
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          mlir-opt --version
          mlir-translate --version
        fi
        if [ "${{ steps.apt-cache.outputs.cache-hit }}" != "true" ] && [ "${#packages[@]}" -gt 0 ]; then
          mkdir -p ~/flow-apt-cache
          cp /var/cache/apt/archives/*.deb ~/flow-apt-cache/ 2>/dev/null || true
        fi
        clang --version