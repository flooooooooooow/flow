name: Discord notify
description: >-
  Post a rich embed to a Discord channel via webhook. One place to define the
  payload shape so every workflow stays consistent. Supports the full Discord
  embed schema: author, title/url, description, multiple fields, thumbnail,
  image, footer, timestamp, plus a top-level content line and webhook avatar.
inputs:
  webhook:
    description: Discord webhook URL (from a GitHub secret). Empty = skip.
    required: true
  content:
    description: >-
      Top-level message text shown above the embed (markdown, may mention
      roles with <@&id>). Optional.
    required: false
    default: ''
  botname:
    description: Webhook username override.
    required: false
    default: Flow Bot
  avatar_url:
    description: Webhook avatar image URL.
    required: false
    default: ''
  title:
    description: Embed title.
    required: false
    default: ''
  url:
    description: Embed title link.
    required: false
    default: ''
  color:
    description: >-
      Embed color as decimal (3066993 green, 15158332 red, 14440101 amber,
      5763719 purple, 0 default).
    required: false
    default: '0'
  description:
    description: Embed description (Discord markdown, multi-line allowed).
    required: false
    default: ''
  fields:
    description: >-
      JSON array of field objects: [{"name":..,"value":..,"inline":true},..].
      Up to 25 fields (Discord limit). Optional.
    required: false
    default: '[]'
  author_name:
    description: Embed author name.
    required: false
    default: ''
  author_icon:
    description: Embed author icon URL (small image before the author name).
    required: false
    default: ''
  thumbnail:
    description: Embed thumbnail image URL (top-right).
    required: false
    default: ''
  image:
    description: Embed large image URL (bottom, below description).
    required: false
    default: ''
  footer_text:
    description: Embed footer text (bottom line).
    required: false
    default: ''
  footer_icon:
    description: Embed footer icon URL (left of footer text).
    required: false
    default: ''
  timestamp:
    description: >-
      ISO8601 timestamp to display on the embed. Defaults to now when empty
      or when set to the literal string `now`.
    required: false
    default: 'now'
  thread_name:
    description: >-
      Name of the forum thread to create (the webhook must point at a forum
      channel). Empty = post as a plain message in the channel.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Post embed
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        CONTENT: ${{ inputs.content }}
        BOTNAME: ${{ inputs.botname }}
        AVATAR_URL: ${{ inputs.avatar_url }}
        EMBED_TITLE: ${{ inputs.title }}
        EMBED_URL: ${{ inputs.url }}
        COLOR: ${{ inputs.color }}
        DESCRIPTION: ${{ inputs.description }}
        FIELDS: ${{ inputs.fields }}
        AUTHOR_NAME: ${{ inputs.author_name }}
        AUTHOR_ICON: ${{ inputs.author_icon }}
        THUMBNAIL: ${{ inputs.thumbnail }}
        IMAGE: ${{ inputs.image }}
        FOOTER_TEXT: ${{ inputs.footer_text }}
        FOOTER_ICON: ${{ inputs.footer_icon }}
        TIMESTAMP: ${{ inputs.timestamp }}
        THREAD_NAME: ${{ inputs.thread_name }}
      run: |
        set -euo pipefail
        if [[ -z "$WEBHOOK" ]]; then
          echo "discord-notify: no webhook URL supplied, skipping"
          exit 0
        fi
        python3 - <<'PY'
        import json, os, sys, urllib.request

        webhook = os.environ["WEBHOOK"]
        color = int(os.environ.get("COLOR", "0"))

        embed = {"color": color}
        if os.environ.get("DESCRIPTION"):
            embed["description"] = os.environ["DESCRIPTION"]
        if os.environ.get("EMBED_TITLE"):
            embed["title"] = os.environ["EMBED_TITLE"]
            if os.environ.get("EMBED_URL"):
                embed["url"] = os.environ["EMBED_URL"]

        if os.environ.get("AUTHOR_NAME"):
            author = {"name": os.environ["AUTHOR_NAME"]}
            if os.environ.get("AUTHOR_ICON"):
                author["icon_url"] = os.environ["AUTHOR_ICON"]
            embed["author"] = author

        fields = os.environ.get("FIELDS", "[]")
        try:
            parsed = json.loads(fields)
        except json.JSONDecodeError as e:
            sys.exit(f"discord-notify: invalid --fields JSON: {e}")
        if parsed:
            # Discord allows 25 fields per embed (name <= 256, value <= 1024);
            # truncate calmly so a job-heavy CI summary still posts.
            trimmed = [
                {"name": str(f.get("name", ""))[:256],
                 "value": str(f.get("value", ""))[:1024],
                 "inline": bool(f.get("inline", False))}
                for f in parsed[:25]
                if f.get("name") or f.get("value")
            ]
            embed["fields"] = trimmed

        if os.environ.get("THUMBNAIL"):
            embed["thumbnail"] = {"url": os.environ["THUMBNAIL"]}
        if os.environ.get("IMAGE"):
            embed["image"] = {"url": os.environ["IMAGE"]}

        if os.environ.get("FOOTER_TEXT") or os.environ.get("FOOTER_ICON"):
            footer = {}
            if os.environ.get("FOOTER_TEXT"):
                footer["text"] = os.environ["FOOTER_TEXT"]
            if os.environ.get("FOOTER_ICON"):
                footer["icon_url"] = os.environ["FOOTER_ICON"]
            embed["footer"] = footer

        ts = os.environ.get("TIMESTAMP")
        if ts and ts != "now":
            embed["timestamp"] = ts

        payload = {"embeds": [embed]}
        if os.environ.get("BOTNAME"):
            payload["username"] = os.environ["BOTNAME"]
        if os.environ.get("AVATAR_URL"):
            payload["avatar_url"] = os.environ["AVATAR_URL"]
        if os.environ.get("CONTENT"):
            payload["content"] = os.environ["CONTENT"]
        thread = os.environ.get("THREAD_NAME")
        if thread:
            payload["thread_name"] = thread

        body = json.dumps(payload).encode()
        req = urllib.request.Request(
            webhook, data=body,
            headers={
                "Content-Type": "application/json",
                # Discord routes webhooks through Cloudflare, which blocks the
                # bare `Python-urllib` user agent (403 / error code 1010). A
                # plain browser-style UA keeps the webhook from being rejected.
                "User-Agent": "Flow-CI/1.0 (+https://github.com/flooooooooooow/flow)",
            })
        try:
            urllib.request.urlopen(req, timeout=20)
        except urllib.error.HTTPError as e:
            print(f"discord-notify: webhook rejected ({e.code}): "
                  f"{e.read().decode(errors='replace')}", file=sys.stderr)
            sys.exit(1)
        PY