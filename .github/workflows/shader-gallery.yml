name: Shader gallery assets

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'examples/gpu/shader_*.flow'
      - 'runtime/shader_record_metal.m'
      - 'scripts/record_shader_gallery.py'
      - 'scripts/build_shader_gallery.py'
      - 'scripts/frames_to_gif.py'
      - 'docs/demos/shaders.md'
      - 'docs/demos/shaders/**'
      - 'site/wiki.css'
      - '.github/workflows/shader-gallery.yml'
  workflow_dispatch:

concurrency:
  group: shader-gallery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Same-repository PRs may refresh their own generated GIFs. Fork PRs are
# intentionally read-only and skip this job rather than exposing a write token.
permissions:
  contents: write

jobs:
  render:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-python

      - name: Install GIF encoder dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Probe Metal with one real FSL shader
        run: |
          python3 scripts/record_shader_gallery.py \
            --name photoreal_gold \
            --frames 2 \
            --fps 2 \
            --gif-width 240 \
            --out "$RUNNER_TEMP/flow-shader-probe"

      - name: Render the 64-shader photoreal gallery
        run: |
          python3 scripts/record_shader_gallery.py \
            --group photoreal \
            --frames 24 \
            --fps 12 \
            --width 640 \
            --height 360 \
            --gif-width 360 \
            --out docs/demos/shaders

      - name: Regenerate gallery page and verify asset coverage
        run: |
          python3 scripts/build_shader_gallery.py
          python3 scripts/build_shader_gallery.py --check --check-assets

      - name: Commit refreshed gallery assets to same-repo PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git add docs/demos/shaders.md docs/demos/shaders
          if git diff --cached --quiet; then
            echo 'Shader gallery is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh photoreal shader gallery assets'
          git push origin "HEAD:${{ github.head_ref }}"
