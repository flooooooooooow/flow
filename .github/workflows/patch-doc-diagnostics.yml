name: Patch documentation diagnostics

on:
  push:
    branches: ['agent/compile-all-doc-examples']
    paths:
      - '.github/workflows/patch-doc-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/compile-all-doc-examples
      - name: Prefer deepest compiler failure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_doc_examples.py')
          text = path.read_text()
          old = '''    first: tuple[str, str] = ("", "")\n    best_noop = ""\n    reached_meaning = False\n    meaning_detail = ""\n'''
          new = '''    first: tuple[str, str] = ("", "")\n    best_noop = ""\n    reached_meaning = False\n    meaning_detail = ""\n    deepest: tuple[int, str, str] = (-1, "", "")\n    stage_rank = {\n        "parse": 0, "imports": 1, "degenerate": 2, "types": 3,\n        "vacuous": 3, "codegen": 4, "clang": 5, "shader": 5,\n    }\n'''
          if old not in text:
              raise SystemExit('verify state anchor not found')
          text = text.replace(old, new, 1)
          old = '''        if stage in ("types", "vacuous", "codegen", "degenerate"):\n            reached_meaning = True\n'''
          new = '''        rank = stage_rank.get(stage, -1)\n        if rank > deepest[0] or (rank == deepest[0] and detail and not deepest[2]):\n            deepest = (rank, stage, detail)\n        if stage in ("types", "vacuous", "codegen", "degenerate"):\n            reached_meaning = True\n'''
          if old not in text:
              raise SystemExit('stage anchor not found')
          text = text.replace(old, new, 1)
          old = '''    return Result(block, "unverified", detail=best_noop or first[1], stage=first[0])\n'''
          new = '''    if best_noop and deepest[0] < stage_rank["types"]:\n        return Result(block, "unverified", detail=best_noop, stage="degenerate")\n    if deepest[0] >= 0:\n        return Result(block, "unverified", detail=deepest[2], stage=deepest[1])\n    return Result(block, "unverified", detail=first[1], stage=first[0])\n'''
          if old not in text:
              raise SystemExit('return anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check_doc_examples.py
          git commit -m 'test: report deepest doc snippet failure'
          git pull --rebase origin agent/compile-all-doc-examples
          git push origin HEAD:agent/compile-all-doc-examples
