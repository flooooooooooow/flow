name: Version Bump

# Two ways in:
#   * push a v* tag — the tree is bumped to match the tag after the fact
#   * run manually with a version — for bumping ahead of tagging
#
# main is protected, so this opens a PR rather than pushing directly. Same
# approach as the repository-stats workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set (e.g. 0.12.0)'
        required: true
        type: string
      homebrew:
        description: 'Also bump the Homebrew formula (needs a published tarball)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Sync version references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve target version
        id: target
        run: |
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target version: $VERSION"

      # On a tag push the tarball exists, so the formula can be bumped with a
      # real digest. Never guess it: a wrong sha256 breaks `brew install` for
      # everyone. If the download is not up yet, skip the formula and say so.
      - name: Decide whether the formula can be bumped
        id: brew
        run: |
          VERSION='${{ steps.target.outputs.version }}'
          WANT='false'
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            WANT='true'
          elif [[ "${{ inputs.homebrew }}" == 'true' ]]; then
            WANT='true'
          fi
          if [[ "$WANT" != 'true' ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Formula bump not requested."
            exit 0
          fi
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/flow-v$VERSION.tar.gz"
          if curl --silent --fail --location --head "$URL" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release tarball is published; formula will be bumped."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$URL is not published yet. Skipping the Homebrew formula."
            echo "::warning::Re-run this workflow with homebrew=true once the release assets are up."
          fi

      - name: Apply
        run: |
          ARGS=(--set '${{ steps.target.outputs.version }}'
                --release-date "$(date -u +%Y-%m-%d)")
          if [[ '${{ steps.brew.outputs.enabled }}' == 'true' ]]; then
            ARGS+=(--sha256-from-release)
          fi
          python3 scripts/sync_version.py "${ARGS[@]}"

      - name: Verify the result is self-consistent
        run: python3 scripts/sync_version.py --check

      - name: Open or update the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION='${{ steps.target.outputs.version }}'
          BRANCH="chore/version-$VERSION"

          git add -A
          if git diff --cached --quiet; then
            echo "Every version reference already reads $VERSION. Nothing to do."
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: sync version references to $VERSION [skip ci]"
          git push -u origin "HEAD:$BRANCH" --force
          echo "Pushed $BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Updated the existing bump PR."
            gh pr view "$BRANCH" --json url --jq .url
            exit 0
          fi

          BODY="Automated sync of every version reference to \`$VERSION\`, from the canonical value in \`src/flow/version.py\`."
          if [[ '${{ steps.brew.outputs.enabled }}' == 'true' ]]; then
            BODY="$BODY"$'\n\n'"The Homebrew formula was bumped with a digest computed from the published release tarball."
          else
            BODY="$BODY"$'\n\n'"The Homebrew formula was **not** touched, because the release tarball was not published yet. Re-run this workflow with \`homebrew=true\` once the assets are up."
          fi
          BODY="$BODY"$'\n\n'"Generated by \`.github/workflows/version-bump.yml\`."

          # Creating PRs requires "Allow GitHub Actions to create and approve
          # pull requests". When that is off, leave the branch for a human
          # rather than failing the job.
          if gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: sync version references to $VERSION" \
              --body "$BODY"; then
            exit 0
          fi
          echo "::warning::Could not open a PR (Actions may lack create-PR permission)."
          echo "Branch is ready: https://github.com/${{ github.repository }}/pull/new/$BRANCH"
          exit 0
