name: Patch issue 465

on:
  push:
    paths:
      - '.github/workflows/patch-465.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/private-function-module-collision
      - name: Preserve overloads during C pre-generation deduplication
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/flow/c_generator.py')
          source = path.read_text()
          old = '            key = fn.name\n            has_body = bool(getattr(fn, "body", None) and fn.body.statements)\n'
          new = (
              '            key = (\n'
              '                fn.name,\n'
              '                tuple(generator._type_to_string(p.type) for p in fn.parameters),\n'
              '            )\n'
              '            has_body = bool(getattr(fn, "body", None) and fn.body.statements)\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected name-only dedup key exactly once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/flow/c_generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/c_generator.py
          git commit -m "Fix private overload deduplication across modules"
          git push origin HEAD:test/private-function-module-collision
