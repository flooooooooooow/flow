name: Patch issue 465

on:
  push:
    paths:
      - '.github/workflows/patch-465.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test/private-function-module-collision
      - name: Preserve overloads during C pre-generation deduplication
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/flow/c_generator.py')
          source = path.read_text()

          old_comment = '''        # Deduplicate functions by name: when multiple imported modules define
        # the same helper (e.g. str_append, substr), only the first definition
        # is emitted. sizeof_ intrinsics are also deduped even when exported,
'''
          new_comment = '''        # Deduplicate identical function signatures: when multiple imported modules
        # define the same helper with the same parameter types, only the first
        # definition is emitted. Distinct overloads must survive to name mangling.
        # sizeof_ intrinsics are also deduped even when exported,
'''
          if source.count(old_comment) != 1:
              raise SystemExit('expected dedup comment exactly once')
          source = source.replace(old_comment, new_comment, 1)

          old_key = '            key = fn.name\n            has_body = bool(getattr(fn, "body", None) and fn.body.statements)\n'
          new_key = '''            key = (
                fn.name,
                tuple(generator._type_to_string(p.type) for p in fn.parameters),
            )
            has_body = bool(getattr(fn, "body", None) and fn.body.statements)
'''
          if source.count(old_key) != 1:
              raise SystemExit('expected name-only dedup key exactly once')
          source = source.replace(old_key, new_key, 1)
          path.write_text(source)
          PY
          git diff --check
          git diff -- src/flow/c_generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/c_generator.py
          git commit -m "Fix private overload deduplication across modules"
          git push origin HEAD:test/private-function-module-collision
