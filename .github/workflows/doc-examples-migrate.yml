name: Migrate documentation examples

on:
  push:
    branches: ['agent/compile-all-doc-examples']
    paths:
      - 'scripts/retag_noncompiling_doc_examples.py'
      - '.github/workflows/doc-examples-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/compile-all-doc-examples
      - uses: ./.github/actions/setup-python
      - name: Classify executable and non-executable snippets
        env:
          PYTHONPATH: src
        run: python3 scripts/retag_noncompiling_doc_examples.py
      - name: Make the main CI gate strict
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = 'run: python3 scripts/check_doc_examples.py --check-ledger'
          new = 'run: python3 scripts/check_doc_examples_strict.py'
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy doc checker command, found {text.count(old)}')
          text = text.replace(old, new)
          text = text.replace(
              '  # Documented examples are compiled. A ratchet, not a wall: the examples that\n'
              '  # do not build today are recorded in docs/generated/example-status.json and\n'
              '  # grandfathered. Rows are keyed by a hash of the block, so editing one\n'
              '  # revokes its exemption and the new text has to compile.\n',
              '  # Every fenced block labelled `flow` must compile through the strict type\n'
              '  # checker, C generation, and clang. There is no grandfathered failure list.\n',
          )
          path.write_text(text)
          PY
      - name: Refresh documentation example status
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import check_doc_examples_strict  # installs the strict harness
          import check_doc_examples as checker
          results = checker.run(use_clang=True)
          checker.write_ledger(results)
          bad = [result for result in results if result.status != 'verified']
          if bad:
              raise SystemExit(f'{len(bad)} Flow blocks still fail after migration')
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: make Flow code blocks compile by construction'
          git push origin HEAD:agent/compile-all-doc-examples
