# ACTIONS-INTENDED: attribution guard for this public repository.
name: Attribution Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  attribution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject misattributed Git identities
        shell: bash
        env:
          FORBIDDEN_EMAIL: abhishek@users.noreply.github.com
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              range="HEAD"
            else
              range="$before..HEAD"
            fi
          fi

          if git log "$range" --format='%ae%n%ce%n%B' | grep -F "$FORBIDDEN_EMAIL"; then
            echo "::error::Forbidden Git identity found: $FORBIDDEN_EMAIL"
            echo "Use abhishek.shivakumar@gmail.com or 11516291+godofecht@users.noreply.github.com."
            exit 1
          fi
