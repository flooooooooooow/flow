# ACTIONS-INTENDED: public repository; dry-run release qualification only.
# Never publishes a GitHub Release, never tags, never updates Homebrew.
name: Release qualification

on:
  workflow_dispatch:
    inputs:
      rev:
        description: 'Git revision to archive (default HEAD)'
        required: false
        default: HEAD
  pull_request:
    paths:
      - 'scripts/tools/qualify_release/**'
      - 'packaging/homebrew/**'
      - 'docs/project/RELEASING.md'
      - 'docs/project/release-qualification.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-qualify.yml'
      - 'tests/scripts/qualify_release.flow'
  push:
    branches: [main, master]
    paths:
      - 'scripts/tools/qualify_release/**'
      - 'packaging/homebrew/**'
      - 'docs/project/RELEASING.md'
      - 'docs/project/release-qualification.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-qualify.yml'
      - 'tests/scripts/qualify_release.flow'

permissions:
  contents: read

jobs:
  qualify:
    name: Dry-run qualify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Formula structural and full local validation check
        run: ./flow tool qualify_release --check-formula --mode full

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Brew install from local formula
        run: brew install --build-from-source ./packaging/homebrew/Formula/flow.rb

      - name: Write archives and qualification record
        env:
          FLOW_QUALIFY_REV: ${{ inputs.rev || 'HEAD' }}
        run: |
          ./flow tool qualify_release --dry-run --artifacts-only \
            --rev "$FLOW_QUALIFY_REV" \
            --out "$RUNNER_TEMP/flow-qualify"

      - name: RC promotion record (no tag)
        run: |
          ./flow tool qualify_release --dry-run --artifacts-only --promote-rc \
            --out "$RUNNER_TEMP/flow-qualify-rc"
          test -f "$RUNNER_TEMP/flow-qualify-rc/rc-promotion.txt"
          grep -q 'published: false' "$RUNNER_TEMP/flow-qualify-rc/rc-promotion.txt"
          grep -q 'tagged: false' "$RUNNER_TEMP/flow-qualify-rc/rc-promotion.txt"

      - name: Refuse publish
        run: |
          set +e
          ./flow tool qualify_release --publish
          ec=$?
          set -e
          test "$ec" -eq 2

      - uses: actions/upload-artifact@v4
        with:
          name: qualify-dry-run
          path: |
            ${{ runner.temp }}/flow-qualify
            ${{ runner.temp }}/flow-qualify-rc
          if-no-files-found: error
