name: wasm32 direct backend

on:
  push:
    paths:
      - 'src/flow/wasm_compiler.py'
      - 'src/flow/mlir_generator.py'
      - 'src/flow/transpiler.py'
      - 'runtime/wasm/**'
      - 'tests/fixtures/wasm/**'
      - '.github/actions/install-toolchain/action.yml'
      - '.github/workflows/wasm32.yml'
  pull_request:
    paths:
      - 'src/flow/wasm_compiler.py'
      - 'src/flow/mlir_generator.py'
      - 'src/flow/transpiler.py'
      - 'runtime/wasm/**'
      - 'tests/fixtures/wasm/**'
      - '.github/actions/install-toolchain/action.yml'
      - '.github/workflows/wasm32.yml'
  workflow_dispatch:

jobs:
  direct-wasm32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'
      - name: Compile Flow through MLIR and LLVM IR to WebAssembly
        env:
          PYTHONPATH: src
        run: |
          python -m flow.wasm_compiler tests/fixtures/wasm/main_42.flow \
            -o /tmp/main_42.wasm \
            --export answer \
            -O O2
          python -m flow.wasm_compiler tests/fixtures/wasm/sum_pair.flow \
            -o /tmp/sum_pair.wasm \
            --export sum_pair \
            -O O2
          python -m flow.wasm_compiler tests/fixtures/wasm/alloc_sum.flow \
            -o /tmp/alloc_sum.wasm \
            --export alloc_sum \
            -O O2
          test -s /tmp/main_42.wasm
          test -s /tmp/sum_pair.wasm
          test -s /tmp/alloc_sum.wasm
          python - <<'PY'
          from pathlib import Path
          for path in ('/tmp/main_42.wasm', '/tmp/sum_pair.wasm', '/tmp/alloc_sum.wasm'):
              data = Path(path).read_bytes()
              assert data[:4] == b'\x00asm', (path, data[:4])
              print(f'{path}: {len(data)} wasm bytes')
          PY
      - name: Instantiate and execute scalar WebAssembly export under Node
        run: |
          node - <<'JS'
          const fs = require('fs');
          const bytes = fs.readFileSync('/tmp/main_42.wasm');
          WebAssembly.instantiate(bytes, {}).then(({instance}) => {
            const names = Object.keys(instance.exports);
            if (!names.includes('answer')) {
              throw new Error(`answer export missing; exports=${names.join(',')}`);
            }
            const result = instance.exports.answer();
            if (result !== 42) {
              throw new Error(`expected answer() == 42, got ${result}`);
            }
            console.log(`answer()=${result}; exports=${names.join(',')}`);
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
      - name: Marshal Float32 values through WebAssembly linear memory
        run: |
          node - <<'JS'
          const fs = require('fs');
          const bytes = fs.readFileSync('/tmp/sum_pair.wasm');
          WebAssembly.instantiate(bytes, {}).then(({instance}) => {
            const {memory, sum_pair} = instance.exports;
            if (!(memory instanceof WebAssembly.Memory)) {
              throw new Error('memory export missing');
            }
            if (typeof sum_pair !== 'function') {
              throw new Error('sum_pair export missing');
            }
            const byteOffset = 4096;
            const values = new Float32Array(memory.buffer, byteOffset, 2);
            values[0] = 1.5;
            values[1] = 2.25;
            const result = sum_pair(byteOffset);
            if (result !== 3.75) {
              throw new Error(`expected sum_pair(memory[${byteOffset}]) == 3.75, got ${result}`);
            }
            console.log(`sum_pair([${values[0]}, ${values[1]}])=${result}`);
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
      - name: Execute allocation-backed Flow under WebAssembly
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createFlowWasmRuntime} from './runtime/wasm/flow_runtime.mjs';

          const bytes = fs.readFileSync('/tmp/alloc_sum.wasm');
          const module = new WebAssembly.Module(bytes);
          const imports = WebAssembly.Module.imports(module);
          if (imports.length !== 1 || imports[0].module !== 'env' || imports[0].name !== 'malloc') {
            throw new Error(`unexpected alloc_sum imports=${JSON.stringify(imports)}`);
          }

          const runtime = createFlowWasmRuntime();
          const instance = await WebAssembly.instantiate(module, runtime.imports);
          runtime.attach(instance);

          const {alloc_sum, memory} = instance.exports;
          if (typeof alloc_sum !== 'function') {
            throw new Error('alloc_sum export missing');
          }
          const initialBytes = memory.buffer.byteLength;
          for (let i = 0; i < 32; i += 1) {
            const result = alloc_sum();
            if (result !== 3.75) {
              throw new Error(`expected alloc_sum() == 3.75 on iteration ${i}, got ${result}`);
            }
          }
          if (memory.buffer.byteLength <= initialBytes) {
            throw new Error('allocator did not grow WebAssembly linear memory');
          }
          console.log(`alloc_sum() x32=3.75; memory ${initialBytes} -> ${memory.buffer.byteLength}; imports=${JSON.stringify(imports)}`);
          JS
