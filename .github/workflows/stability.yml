# ACTIONS-INTENDED: public repository; its CI runs on GitHub Actions.
name: Stability contract

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'STABILITY.md'
      - 'stability/**'
      - 'tools/flow_cli/**'
      - 'scripts/tools/stability_manifest/**'
      - 'scripts/tools/lib/**'
      - 'scripts/tools/build_tool.sh'
      - 'compiler/bootstrap/flowc_stage_a.c'
      - '.github/workflows/stability.yml'
  push:
    branches: [main, master]
    tags:
      - 'v1.0.0-rc.*'
      - 'v1.0.0'
    paths:
      - 'STABILITY.md'
      - 'stability/**'
      - 'tools/flow_cli/**'
      - 'scripts/tools/stability_manifest/**'
      - 'scripts/tools/lib/**'
      - 'scripts/tools/build_tool.sh'
      - 'compiler/bootstrap/flowc_stage_a.c'
      - '.github/workflows/stability.yml'
  workflow_dispatch:
    inputs:
      require_complete:
        description: 'Require every 1.0 surface to be classified'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate stability manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest schema and repository paths
        run: ./flow tool stability_manifest
      - name: Require complete classification for RC/final qualification
        if: >-
          startsWith(github.ref, 'refs/tags/v1.0.0-rc.') ||
          github.ref == 'refs/tags/v1.0.0' ||
          inputs.require_complete == true
        run: ./flow tool stability_manifest --require-complete
