# ACTIONS-INTENDED: public repository; this is its main CI.
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'Makefile'
      - 'tools/**'
      - 'flow.toml'
      - '.gitignore'
      - '.github/**'
      - 'VERSION'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'
      # Version consistency and Doc links are deliberately ungated at the job
      # level so markdown drift gets caught. That only works if the workflow
      # itself fires, so docs-only changes have to be in this list too.
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CITATION.cff'
      - '**.md'
      - '**.py'
      - '**.sh'
      - 'tools/python_ratchet/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'Makefile'
      - 'tools/**'
      - 'flow.toml'
      - '.gitignore'
      - '.github/**'
      - 'VERSION'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'
      # Version consistency and Doc links are deliberately ungated at the job
      # level so markdown drift gets caught. That only works if the workflow
      # itself fires, so docs-only changes have to be in this list too.
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CITATION.cff'
      - '**.md'
      - '**.py'
      - '**.sh'
      - 'tools/python_ratchet/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      compiler: ${{ steps.filter.outputs.compiler }}
      docs: ${{ steps.filter.outputs.docs }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
      libs: ${{ steps.filter.outputs.libs }}
      runtime: ${{ steps.filter.outputs.runtime }}
      workflow: ${{ steps.filter.outputs.workflow }}
      plugins: ${{ steps.filter.outputs.plugins }}
      tools: ${{ steps.filter.outputs.tools }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'compiler/src/**'
            compiler:
              - 'compiler/**'
              - 'tests/cgen/**'
              - 'tests/check/**'
              - 'tests/c_to_hdr/**'
              - 'tools/check/**'
              - 'tools/flow_cli/**'
            tests:
              - 'tests/**'
            examples:
              - 'examples/**'
            libs:
              - 'lib/**'
            runtime:
              - 'runtime/**'
            workflow:
              - '.github/**'
              - 'flow'
              - 'Makefile'
              - 'scripts/**'
            plugins:
              - 'plugins/**'
            tools:
              - 'tools/**'
              - 'tests/tools/**'
              - 'tests/cli/**'
              - 'compiler/src/wcet.flow'
              - 'compiler/src/misra_scan.flow'
              - 'flow'
            docs:
              - 'docs/**'
              - '**.md'
            deps:
              - 'requirements.lock'
              - 'requirements.txt'

  # Manifests, docs headers and the CLI banner all mirror VERSION.
  # They have drifted before: 0.11.0 nearly shipped with the canonical file still
  # reading 0.3.3 and three hardcoded 0.10.0 strings in the flow driver.
  # Deliberately ungated: the drift-prone files (README.md, CITATION.cff,
  # flow.toml, docs/LANGUAGE_SPEC.md) sit outside every paths-filter above.
  # The checker is a Flow program built from the bootstrap C with cc, so no
  # toolchain setup is needed.
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/sync_version.sh --check

  # New code is written in Flow. Fails when a new .py file appears or tracked
  # Python grows past tools/python_ratchet/baseline.txt. The checker is a Flow
  # program that ./flow builds from the checked-in C bootstrap, so no Python
  # is installed. Deliberately ungated, like the version check above.
  python-ratchet:
    name: Python ratchet (Flow first)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./flow tool python_ratchet

  # The same rule for shell. Fails when a new shell script appears or the
  # tracked shell outside tools/shell_ratchet/allow.txt grows past
  # tools/shell_ratchet/baseline.txt. std.process runs commands from Flow,
  # so tooling no longer needs a shell wrapper. Deliberately ungated.
  shell-ratchet:
    name: Shell ratchet (Flow first)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./flow tool shell_ratchet

  # Relative links in tracked markdown, as a reader meets them on GitHub.
  # check_wiki_links.sh validates the built site instead; the two catch
  # different breakage. Both are Flow programs built with cc alone, so no
  # toolchain setup.
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_doc_links.sh
      - run: scripts/check_tool_layout.sh
      - run: scripts/check_makefile_contract.sh
      - run: scripts/check_project_state_sources.sh
      - name: Jules dispatch backpressure tests
        run: ./flow tool scripts/tools/jules_dispatch/test.flow
      - name: Benchmark harness tests (no Python)
        run: ./flow tool tests/bench_harness/run.flow

  # Every part of the language needs a page. The feature list is read from the
  # compiler, so this fails when something is added and left undocumented.
  # A Flow program built with cc, like the checkers above, so no toolchain
  # setup.
  doc-coverage:
    name: Doc coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_doc_coverage.sh

  # Documented examples are compiled. A ratchet, not a wall: the examples that
  # do not build today are recorded in docs/generated/example-status.json and
  # grandfathered. Rows are keyed by a hash of the block, so editing one
  # revokes its exemption and the new text has to compile.
  doc-examples:
    name: Doc examples
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Compile every ```flow block in the documentation
        run: scripts/check_doc_examples.sh --check-ledger

  doc-examples-run:
    name: Doc examples (run)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      # Separate from the compile gate because it takes about two minutes,
      # and because it answers a different question: compiling proves an
      # example is well-formed, running proves it works. A `defer` freeing
      # memory before the return value was read compiled cleanly (#594).
      - name: Run every complete program in the documentation
        run: scripts/check_doc_examples.sh --run --check-ledger

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-toolchain
        with:
          shellcheck: 'true'

      - name: Shellcheck
        if: needs.changes.outputs.workflow == 'true'
        run: shellcheck flow scripts/*.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: pip-audit
        run: pip-audit -r requirements.lock

  flow-tier2:
    name: FLOW tier-2
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'

      - name: Tier 2 (transpile + clang, strict)
        run: |
          chmod +x ./flow
          # Tier 2 already transpiles; tier 1 was redundant (~2× work).
          # --strict: type-checker findings fail the build. Files with a
          # documented "# flow:lenient - <reason>" pragma are exempt.
          ./flow test --tier2 --strict

      - name: Rosetta Code examples (run and compare output)
        run: ./flow test-runtime examples/rosetta

  flowc-bootstrap:
    name: flowc self-host roundtrip
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      # No Python: the compiler host is flowc built from compiler/src by the
      # bootstrap binary (compiler/scripts/flowc_host.flow), and the per-module
      # headers come from the Flow tool scripts/tools/c_to_hdr.
      - name: c_to_hdr goldens
        run: ./flow tool tests/c_to_hdr/run.flow

      - name: Stage-A/B self-host roundtrip
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          # Full roundtrip: Phase-A fixtures + Phase-B bundle/topo/self-emit path.
          timeout 30m ./flow tool compiler/scripts/roundtrip.flow

      # The proof layer runs on flowc; the gate holds it to the recorded
      # Python behaviour (accept/reject, program output). The live diff
      # against the Python at a revision is `--python <rev>`.
      - name: proof layer parity (flowc)
        run: timeout 20m ./compiler/scripts/parity_proofs.sh

      - name: Stage flowc driver for artifact
        run: |
          mkdir -p /tmp/flowc-driver
          picked=""
          for cand in \
            stage_a_driver_flow_self \
            stage_a_driver_flow_g2 \
            stage_a_driver_flow \
            stage_a_driver
          do
            if [[ -x "compiler/build/$cand" ]]; then
              cp "compiler/build/$cand" /tmp/flowc-driver/flowc
              picked="$cand"
              break
            fi
          done
          if [[ -z "$picked" ]]; then
            echo "No stage_a_driver* binary after roundtrip"
            ls -la compiler/build || true
            exit 1
          fi
          echo "Staged $picked as flowc-driver/flowc"
          chmod +x /tmp/flowc-driver/flowc

      - name: Upload Stage-A flowc driver
        uses: actions/upload-artifact@v4
        with:
          name: flowc-driver
          path: /tmp/flowc-driver/flowc
          if-no-files-found: error
          retention-days: 3

  # Phase D/E: a clean checkout must produce a working flowc with cc alone, and
  # three consecutive generations of flowc must agree byte for byte.
  # Deliberately no setup-python step. That is the point of this job.
  flowc-selfhost:
    name: flowc self-host (no Python)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build flowc from the checked-in bootstrap C
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          ./compiler/scripts/bootstrap_from_c.sh

      - name: Every compiler/src module compiles under flowc
        run: ./flow tool compiler/scripts/selfcompile_audit.flow

      - name: Three consecutive generation fixed-points
        run: ./flow tool compiler/scripts/self_host_full.flow

      - name: C output goldens (tests/cgen)
        run: ./flow tool tests/cgen/run.flow

      - name: flow check goldens (tests/check)
        run: ./flow tool tests/check/run.flow

      - name: flow python generator goldens (tests/pywheel)
        run: ./flow tool tests/pywheel/run.flow

      - name: Project test runner parity (flow test)
        run: ./compiler/scripts/parity_project_test.sh

      - name: Debug adapter parity (flow dap)
        run: ./compiler/scripts/parity_dap.sh

      - name: FIR-G goldens (flow fir-g)
        run: ./flow tool tests/fir/run.flow

      - name: flow run --json goldens (tools/run)
        run: ./flow tool tests/flow_run/run.flow

      - name: Package command goldens (init, publish, build, clean)
        run: ./flow tool scripts/check_pkg_commands.flow

      - name: Package dependency goldens (install, sync, add, search, info)
        run: ./flow tool scripts/check_pkg_parity.flow

      - name: GPU shader goldens (flow gpu)
        run: ./flow tool tests/gpu/run.flow

      - name: GPU and shader crossing pages
        run: ./flow tool tests/gpu/crossing.flow

      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'

      # The MLIR emitter (compiler/src/mlirgen.flow) against the goldens
      # recorded from the Python generator, with python stubbed out: the
      # fixtures must emit the same MLIR and, lowered with mlir-opt, print
      # the same output; recorded corpus programs must not regress.
      - name: MLIR emitter parity against goldens (no Python)
        run: |
          mkdir -p /tmp/nopy-mlir
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy-mlir/python3
          cp /tmp/nopy-mlir/python3 /tmp/nopy-mlir/python
          chmod +x /tmp/nopy-mlir/python3 /tmp/nopy-mlir/python
          PATH="/tmp/nopy-mlir:$PATH" timeout 10m ./compiler/scripts/parity_mlir.sh
          # --backend=mlir on the flowc host needs no Python either.
          PATH="/tmp/nopy-mlir:$PATH" FLOW_HOST=flowc \
            ./flow run --backend=mlir compiler/fixtures/mlir/control.flow

      # flow mlir (with --optimize, --llvm, --mlir-gpu, --emit-spirv and the
      # pass pipelines), mlir-run, jit, ml, test-mlir, test-matmul and
      # compile-audio --mlir against the goldens recorded from the Python
      # MLIR stack; the runner stubs python itself.
      - name: MLIR command goldens (no Python)
        run: timeout 20m ./flow tool tests/mlir_commands/run.flow

      - name: Compile and run a Flow program (FLOW_HOST=flowc)
        env:
          FLOW_HOST: flowc
        run: |
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      - name: Same again with python and python3 removed from PATH
        run: |
          mkdir -p /tmp/nopy
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy/python3
          cp /tmp/nopy/python3 /tmp/nopy/python
          chmod +x /tmp/nopy/python3 /tmp/nopy/python
          rm -rf compiler/build build
          export PATH="/tmp/nopy:$PATH"
          export FLOW_HOST=flowc
          ./compiler/scripts/bootstrap_from_c.sh
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      # The default `flow run` / `flow compile` path from a clean compiler/build
      # and build/: flowc comes from ensure_flowc (bootstrap C with cc), and the
      # dependency sync check is scripts/tools/pkg_sync. The check stubs python
      # and python3 to log and exit 127, and fails if either is called.
      - name: flow run with python and python3 stubbed to exit 127
        run: ./flow tool scripts/check_run_without_python.flow

      - name: Package the distributable compiler
        run: ./flow tool compiler/scripts/package_flowc.flow

      - name: Upload flowc package
        uses: actions/upload-artifact@v4
        with:
          name: flowc-package-linux
          path: dist/flowc-*
          if-no-files-found: error
          retention-days: 7

  # Host tools written in Flow (flow repl) run their stdin transcripts with
  # python and python3 removed from PATH, so a Python fallback cannot hide.
  # The same job runs tests/scripts, the shell tests that replaced the pytest
  # files; they drive ./flow and the scripts/*.sh tools as subprocesses.
  native-tools:
    name: Native tools (no Python)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.tools == 'true' ||
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      # The runners are Flow programs (tests/tools/run.flow and the ones it
      # starts), built by `./flow tool`.
      - name: Tool transcripts without Python
        run: |
          mkdir -p /tmp/nopy
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy/python3
          cp /tmp/nopy/python3 /tmp/nopy/python
          chmod +x /tmp/nopy/python3 /tmp/nopy/python
          export PATH="/tmp/nopy:$PATH"
          chmod +x ./flow compiler/scripts/*.sh tools/discord-welcome/build.sh
          ./compiler/scripts/bootstrap_from_c.sh
          ./flow tool tests/tools/run.flow

      # Checks print SKIP when mlir-opt or emcc is missing, as on this runner.
      # tests/scripts/run.sh stubs python and python3 itself.
      - name: Shell tests (tests/scripts)
        run: |
          chmod +x ./flow tests/scripts/*.sh
          ./tests/scripts/run.sh

      # The benchmark publisher's harness builds and runs each published
      # program and checks its result (scripts/tools/bench_publish).
      - name: Benchmark publisher check
        run: ./scripts/check_bench_publish.sh

      # The flow command line (tools/flow_cli, built by the ./flow stub)
      # against goldens recorded from the bash driver it replaced: stdout,
      # stderr, exit code and files written for every subcommand, per OS.
      - name: CLI goldens (tests/cli)
        run: ./flow tool tests/cli/run.flow

  # flowc must keep parsing every .flow file the Python parser accepts. The
  # count of files that parse may not fall below compiler/parse_coverage/
  # floor.txt. Needs only cc: the reference list of files the Python parser
  # rejects is checked in.
  flowc-parse-coverage:
    name: flowc parse coverage
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Parse every tracked .flow file with flowc
        run: |
          chmod +x compiler/scripts/parse_coverage.sh
          ./compiler/scripts/parse_coverage.sh --check

  # Non-regression gates for the Flow ports. Each runs in golden mode against
  # outputs recorded from the Python reference, so it needs only a C
  # compiler. parity_shader_dsl skips its xcrun metal step where there is no
  # Metal toolchain. parse_coverage.sh --check runs in its own job above.
  flowc-parity-gates:
    name: flowc parity gates (golden)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Build flowc from the bootstrap C
        run: ./flow tool compiler/scripts/ensure_flowc.flow
      - name: parity_lowering
        run: timeout 20m ./flow tool compiler/scripts/parity_lowering.flow
      - name: parity_field_dsl
        run: timeout 10m ./flow tool compiler/scripts/parity_field_dsl.flow
      - name: parity_shader_dsl
        run: timeout 10m ./flow tool compiler/scripts/parity_shader_dsl.flow
      - name: parity_dynamics_dsl
        run: timeout 10m ./flow tool compiler/scripts/parity_dynamics_dsl.flow
      - name: parity_flow_blocks
        run: timeout 10m ./flow tool compiler/scripts/parity_flow_blocks.flow
      - name: parity_effects
        run: timeout 10m ./flow tool compiler/scripts/parity_effects.flow
      - name: parity_typecheck --check
        run: timeout 20m ./compiler/scripts/parity_typecheck.sh --check
      - name: typecheck_rules
        run: timeout 10m ./compiler/scripts/typecheck_rules.sh
      - name: fmt_check --check
        run: timeout 20m ./compiler/scripts/fmt_check.sh --check

  # Whole-corpus parity between the flowc and Python hosts on the C backend,
  # against recorded Python goldens (no Python). The floor is kept per OS;
  # --check passes with a note on an OS that has none recorded yet.
  flowc-corpus-parity:
    name: flowc corpus parity
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: corpus_parity --check
        run: timeout 45m ./compiler/scripts/corpus_parity.sh --check

  # Phase D: user-facing compile must not pip-install the Python compiler.
  flowc-compile:
    name: flowc compile (no pip)
    runs-on: ubuntu-latest
    needs: [changes, flowc-bootstrap]
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Download Stage-A flowc driver
        uses: actions/download-artifact@v4
        with:
          name: flowc-driver
          path: compiler/build

      - name: Stage-A compile without Python/pip
        env:
          FLOW_HOST: flowc
        run: |
          chmod +x ./flow
          FLOWC_BIN="compiler/build/flowc"
          if [[ ! -f "$FLOWC_BIN" ]]; then
            echo "Missing downloaded flowc at $FLOWC_BIN"
            ls -laR compiler/build || true
            exit 1
          fi
          chmod +x "$FLOWC_BIN"
          export FLOWC_BIN
          echo "Using flowc: $FLOWC_BIN"
          # FLOWC_BIN is the downloaded driver, so ensure_flowc does not run here.
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow
          # fibonacci.flow main returns fib(10) == 55 as process exit status
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

  # The pytest job used to live here. Its tests are shell tests now
  # (tests/scripts, run by native-tools), so this job keeps only the corpus.
  conformance:
    name: Conformance corpus
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Stable conformance corpus
        run: ./flow tool tests/conformance/run.flow

  fuzz:
    name: Fuzz (flowc)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build flowc from the bootstrap C
        run: ./flow tool compiler/scripts/ensure_flowc.flow

      # Crash pins, deep nesting and 30s of seeded mutation; fails on a
      # signal or a hang.
      - name: Fuzz flowc
        run: ./flow tool tests/fuzz/run.flow --seconds 30 --seed 1234

  plugin-dsp:
    name: Plugin DSP test
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.plugins == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build and run Schur DSP correctness tests
        run: |
          cd plugins/SchurPhaser
          ./tests/run.sh

  flow-examples:
    name: Example smoke
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.examples == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: hello_world + fibonacci
        run: |
          chmod +x ./flow
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow

  windows-gfx-stub:
    name: Windows gfx stub smoke
    runs-on: windows-latest
    needs: changes
    if: |
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile + run gfx_windows.c under FLOW_GFX_STUB
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang -O2 -DFLOW_GFX_STUB \
              runtime/tests/gfx_stub_smoke.c runtime/gfx_windows.c \
              -o gfx_stub_smoke.exe
          else
            cl /nologo /O2 /DFLOW_GFX_STUB \
              runtime/tests/gfx_stub_smoke.c runtime/gfx_windows.c \
              /Fe:gfx_stub_smoke.exe
          fi
          ./gfx_stub_smoke.exe

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Fibonacci benchmark
        run: |
          chmod +x ./flow
          ./flow compile benchmarks/suite/flow/01_fibonacci.flow
          ./build/01_fibonacci

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - security
      - doc-coverage
      - doc-examples
      - flow-tier2
      - flowc-bootstrap
      - flowc-selfhost
      - flowc-compile
      - conformance
      - fuzz
      - flow-examples
      - plugin-dsp
      - windows-gfx-stub
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Summarize job results
        id: summarize
        env:
          CI_FAILED: ${{ job.status != 'success' }}
        run: |
          fail=0
          FIELDS=""
          FAILURES=""
          add() {
            local name="$1"
            local result="$2"
            local required="$3"
            if [ "$required" != "true" ]; then
              FIELDS="$FIELDS{\"name\":\"$name\",\"value\":\"skipped\",\"inline\":true},"
              return
            fi
            case "$result" in
              success) glyph="passed" ;;
              skipped) glyph="skipped" ;;
              *) glyph="failed ($result)"; fail=1; FAILURES="$FAILURES ${name}" ;;
            esac
            FIELDS="$FIELDS{\"name\":\"$name\",\"value\":\"$glyph\",\"inline\":true},"
          }
          src='${{ needs.changes.outputs.src }}'
          tests='${{ needs.changes.outputs.tests }}'
          examples='${{ needs.changes.outputs.examples }}'
          libs='${{ needs.changes.outputs.libs }}'
          runtime='${{ needs.changes.outputs.runtime }}'
          compiler='${{ needs.changes.outputs.compiler }}'
          workflow='${{ needs.changes.outputs.workflow }}'
          plugins='${{ needs.changes.outputs.plugins }}'
          deps='${{ needs.changes.outputs.deps }}'
          lint_req=false;  if [ "$src" = "true" ] || [ "$workflow" = "true" ] || [ "$deps" = "true" ]; then lint_req=true; fi
          sec_req=false;   if [ "$src" = "true" ] || [ "$deps" = "true" ]; then sec_req=true; fi
          tier_req=false;  if [ "$src" = "true" ] || [ "$tests" = "true" ] || [ "$libs" = "true" ] || [ "$runtime" = "true" ]; then tier_req=true; fi
          conf_req=false;  if [ "$src" = "true" ] || [ "$tests" = "true" ]; then conf_req=true; fi
          fuzz_req=$conf_req
          ex_req=false;    if [ "$src" = "true" ] || [ "$examples" = "true" ]; then ex_req=true; fi
          compiler_req=false; if [ "$compiler" = "true" ] || [ "$workflow" = "true" ]; then compiler_req=true; fi
          plugin_req=false; if [ "$plugins" = "true" ] || [ "$workflow" = "true" ]; then plugin_req=true; fi
          gfx_req=false;   if [ "$runtime" = "true" ] || [ "$workflow" = "true" ]; then gfx_req=true; fi
          docs='${{ needs.changes.outputs.docs }}'
          # Coverage is ungated: a new keyword or subcommand in src/ must not
          # land undocumented just because the PR touched no markdown.
          doccov_req=true
          docex_req=false; if [ "$src" = "true" ] || [ "$docs" = "true" ]; then docex_req=true; fi
          add doc-coverage      '${{ needs.doc-coverage.result }}'      "$doccov_req"
          add doc-examples      '${{ needs.doc-examples.result }}'      "$docex_req"
          add lint              '${{ needs.lint.result }}'              "$lint_req"
          add security          '${{ needs.security.result }}'          "$sec_req"
          add flow-tier2        '${{ needs.flow-tier2.result }}'        "$tier_req"
          add flowc-bootstrap   '${{ needs.flowc-bootstrap.result }}'    "$compiler_req"
          add flowc-selfhost    '${{ needs.flowc-selfhost.result }}'     "$compiler_req"
          add flowc-compile     '${{ needs.flowc-compile.result }}'      "$compiler_req"
          add conformance       '${{ needs.conformance.result }}'       "$conf_req"
          add fuzz              '${{ needs.fuzz.result }}'              "$fuzz_req"
          add flow-examples     '${{ needs.flow-examples.result }}'      "$ex_req"
          add plugin-dsp        '${{ needs.plugin-dsp.result }}'         "$plugin_req"
          add windows-gfx-stub  '${{ needs.windows-gfx-stub.result }}'   "$gfx_req"
          # meta fields so the embed also carries where to look.
          SERVER="$GITHUB_SERVER_URL"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          RUNURL="$SERVER/$REPO/actions/runs/${{ github.run_id }}"
          FIELDS="$FIELDS{\"name\":\"Commit\",\"value\":\"[\`$SHA\`]($SERVER/$REPO/commit/$SHA)\",\"inline\":true},"
          FIELDS="$FIELDS{\"name\":\"Branch\",\"value\":\"\`${{ github.head_ref || github.ref_name }}\`\",\"inline\":true},"
          FIELDS="$FIELDS{\"name\":\"Run\",\"value\":\"#${{ github.run_number }}\",\"inline\":true}"
          subject="$(git -C "$GITHUB_WORKSPACE" log -1 --format='%s' 2>/dev/null || echo '')"
          if [ "$fail" = "1" ]; then failed_out=true; else failed_out=false; fi
          {
            echo "failed=$failed_out"
            echo "failures=${FAILURES# }"
            echo "fields=[$FIELDS]"
            echo "subject=$subject"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require passing jobs
        if: steps.summarize.outputs.failed == 'true'
        run: |-
          echo "Required jobs failed: ${{ steps.summarize.outputs.failures }}"
          exit 1

      # Notify on main pushes always; on PRs only when something failed (cut noise).
      - name: Post CI status to Discord #ci-releases
        if: >-
          always() &&
          (github.event_name == 'push' ||
           steps.summarize.outputs.failed == 'true')
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
          botname: Flow CI
          avatar_url: ${{ github.server_url }}/${{ github.repository_owner }}.png
          content: "${{ steps.summarize.outputs.failed == 'true' && format('CI failed: {0}', steps.summarize.outputs.failures) || '' }}"
          color: ${{ steps.summarize.outputs.failed == 'true' && '15158332' || '3066993' }}
          title: CI ${{ steps.summarize.outputs.failed == 'true' && 'failed' || 'passed' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: "${{ github.repository }} on ${{ github.event_name }} by ${{ github.actor }}: ${{ steps.summarize.outputs.subject }}"
          author_name: Flow CI
          author_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
          fields: ${{ steps.summarize.outputs.fields }}
          footer_text: Flow CI · run ${{ github.run_id }}
          footer_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
