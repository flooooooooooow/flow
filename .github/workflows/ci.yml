# ACTIONS-INTENDED: public repository; this is its main CI.
name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'Makefile'
      - 'tools/**'
      - 'flow.toml'
      - '.gitignore'
      - '.github/**'
      - 'VERSION'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'
      # Version consistency and Doc links are deliberately ungated at the job
      # level so markdown drift gets caught. That only works if the workflow
      # itself fires, so docs-only changes have to be in this list too.
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CITATION.cff'
      - '**.md'
      - '**.py'
      - '**.sh'
      - 'tools/python_ratchet/**'
  # Every pull request runs the workflow, whatever paths it touches. The
  # `changes` job gates each job by path, and a skipped job counts as passing
  # for a required check, so every PR gets a CI status. A paths list here left
  # PRs outside it with no status at all, which deadlocks required checks
  # (#816).
  pull_request:
    branches: [main, master]
  # The merge queue tests each batch on a temporary branch before it lands
  # on main. The `changes` job gates a batch on its diff against the queue
  # base, so every required check reports on it.
  merge_group:
    types: [checks_requested]

# A new push to a pull request cancels the run on its previous head. Pushes
# to main and merge queue batches are grouped by commit, so each one gets a
# complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

# Job layout. Runner slots are the scarce resource (20 concurrent jobs for
# the whole repository), so small checks share a job:
#   - `checks` (Doc links) runs the version, ratchet, link, coverage, lint,
#     security and pygments checks as steps.
#   - `parity` (flowc parity gates) also runs parse coverage.
#   - `lang-tests` (Language tests) also runs tests/runtime.
#   - `smoke` runs the conformance corpus, the fuzzer, the example smoke and
#     the plugin DSP test.
# Each required check that moved into a shared job keeps its name as a small
# job below the one that runs it. That job is skipped when its step passed or
# was not needed (a skipped job counts as passing for a required check) and
# runs, and fails, when its step failed or never ran. So it needs no runner
# on a green run.
#
# Runners. The light jobs (Detect changes, the checks job and the small
# report jobs, Doc examples, Smoke and CI) and Language tests run on two
# self-hosted runners, flow-vps-1 and flow-vps-2 (labels self-hosted and
# flow-vps), to take load off the hosted pool. Language tests is there
# because it measured faster on the VPS (about 50 s against 80 s). The long
# jobs stay on ubuntu-latest, where they do not hold up the two VPS runners
# that every run needs for Detect changes and CI.
#
# Every routed job uses the `&flow-runner` anchor on `changes`, which picks
# the VPS only for trusted events: a push to main, a merge queue batch, and
# a pull request from a branch of this repository. A pull request from a
# fork, and any other event, runs on ubuntu-latest, so outside code never
# reaches the VPS.
#
# If the VPS runners are down, routed jobs wait in the queue for them.
# Set the repository variable FLOW_VPS_RUNNERS to `off` to send every job
# back to ubuntu-latest, then re-run the waiting runs:
#   gh variable set FLOW_VPS_RUNNERS --body off -R flooooooooooow/flow
# Delete the variable (or set it to `on`) to use the VPS again. Each routed
# job has a timeout-minutes, so a job that hangs on the VPS fails instead of
# holding a runner. The runner setup is in docs/project/ci-runners.md.
jobs:
  # Path flags that gate the jobs below. On pull_request the diff is the
  # pull request's; on merge_group it is the batch against the queue base
  # (merge_group.base_sha), which covers every pull request in the batch.
  # Both go through this one filter, so a pull request runs what its queue
  # batch would. If the filter cannot run, every flag is true.
  #
  # This job also fills the flowc and flow CLI build cache
  # (.github/actions/flow-bin-cache) when this commit's inputs are not in it,
  # so the jobs after it restore the binaries instead of building them. A
  # failed build is left to the jobs that need the binaries, which build
  # them again and report the error where it matters.
  changes:
    name: Detect changes
    runs-on: &flow-runner ${{ vars.FLOW_VPS_RUNNERS != 'off' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","flow-vps"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    outputs:
      src: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.src || 'true' }}
      compiler: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.compiler || 'true' }}
      docs: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.docs || 'true' }}
      tests: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.tests || 'true' }}
      examples: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.examples || 'true' }}
      libs: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.libs || 'true' }}
      runtime: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.runtime || 'true' }}
      workflow: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.workflow || 'true' }}
      plugins: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.plugins || 'true' }}
      tools: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.tools || 'true' }}
      deps: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.deps || 'true' }}
      pygments: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.pygments || 'true' }}
      goldens: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.goldens || 'true' }}
      flowfiles: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.flowfiles || 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        continue-on-error: true
        with:
          base: ${{ github.event.merge_group.base_sha || '' }}
          filters: |
            src:
              - 'compiler/src/**'
            compiler:
              - 'compiler/**'
              - 'tests/cgen/**'
              - 'tests/check/**'
              - 'tests/c_to_hdr/**'
              - 'tools/check/**'
              - 'tools/flow_cli/**'
            tests:
              - 'tests/**'
            examples:
              - 'examples/**'
            libs:
              - 'lib/**'
            runtime:
              - 'runtime/**'
            workflow:
              - '.github/**'
              - 'flow'
              - 'Makefile'
              - 'scripts/**'
            plugins:
              - 'plugins/**'
            tools:
              - 'tools/**'
              - 'tests/tools/**'
              - 'tests/cli/**'
              - 'compiler/src/wcet.flow'
              - 'compiler/src/misra_scan.flow'
              - 'flow'
            docs:
              - 'docs/**'
              - '**.md'
            deps:
              - 'requirements.lock'
              - 'requirements.txt'
            pygments:
              - 'third_party/integrations/pygments-flow/**'
              - '.github/**'
            # Everything the goldens and MLIR job reads: the compiler, the
            # MLIR corpus (compiler/fixtures/mlir/corpus.txt names programs
            # under examples, tests, lib, compiler and benchmarks), the
            # runtime, the GPU tools and the wasm crossing assets.
            # `./flow tool ci_gating` (in the Doc links job) fails when a
            # corpus program or one of these surfaces is missing here.
            goldens:
              - 'compiler/**'
              - 'lib/**'
              - 'runtime/**'
              - 'examples/**'
              - 'tests/**'
              - 'tools/**'
              - 'scripts/**'
              - 'wasm/**'
              - 'benchmarks/**'
              - '.github/**'
              - 'flow'
              - 'Makefile'
            # Any Flow source: parse coverage and fmt_check read them all.
            flowfiles:
              - '**.flow'

      - id: bin
        uses: ./.github/actions/flow-bin-cache
      - name: Build flowc, the flow CLI and the tool flowc
        id: build
        if: steps.bin.outputs.cache-hit != 'true'
        continue-on-error: true
        run: ./flow tool --path python_ratchet
      - name: Save the build cache
        if: steps.bin.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.bin.outputs.paths }}
          key: ${{ steps.bin.outputs.key }}

  # The small checks, one step each. The job's own result (the Doc links
  # check) covers the link, coverage, security and pygments steps; version,
  # the two ratchets and lint report through their own jobs below.
  checks:
    name: Doc links
    runs-on: *flow-runner
    timeout-minutes: 30
    needs: changes
    outputs:
      version: ${{ steps.version.outcome }}
      python: ${{ steps.python.outcome }}
      shell: ${{ steps.shell.outcome }}
      lint: ${{ steps.lint.outcome }}
      links: ${{ steps.links.outcome }}
      coverage: ${{ steps.coverage.outcome }}
      security: ${{ steps.security.outcome }}
      pygments: ${{ steps.pygments.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      # Manifests, docs headers and the CLI banner all mirror VERSION. They
      # have drifted before: 0.11.0 nearly shipped with the canonical file
      # still reading 0.3.3 and three hardcoded 0.10.0 strings in the flow
      # driver. Ungated: the drift-prone files (README.md, CITATION.cff,
      # flow.toml, docs/LANGUAGE_SPEC.md) sit outside every path flag.
      - name: Version consistency
        id: version
        continue-on-error: true
        run: ./flow tool sync_version --check

      # New code is written in Flow. Fails when a new .py file appears or
      # tracked Python grows past tools/python_ratchet/baseline.txt.
      - name: Python ratchet (Flow first)
        id: python
        continue-on-error: true
        run: ./flow tool python_ratchet

      # The same rule for shell: a new shell script, or tracked shell outside
      # tools/shell_ratchet/allow.txt past tools/shell_ratchet/baseline.txt.
      - name: Shell ratchet (Flow first)
        id: shell
        continue-on-error: true
        run: ./flow tool shell_ratchet

      # Relative links in tracked markdown, as a reader meets them on GitHub.
      # `flow tool wiki_links` validates the built site instead; the two
      # catch different breakage. script_refs fails when a .flow file names
      # a scripts/ or compiler/scripts/ path that does not exist.
      # docs/library/stdlib-api.md is generated from lib/stdlib; it fails
      # when the committed page is behind the generator. ci_gating fails
      # when a file the goldens job reads is outside its path filter.
      - name: Doc links, script refs, layout, stdlib API page, CI gating, harness tests
        id: links
        continue-on-error: true
        run: |
          set -e
          ./flow tool doc_links
          ./flow tool script_refs
          ./flow tool tool_layout
          ./flow tool makefile_contract
          ./flow tool project_state
          ./flow tool gen_stdlib_docs --check
          ./flow tool ci_gating
          ./flow tool scripts/tools/jules_dispatch/test.flow
          ./flow tool tests/bench_harness/run.flow

      # Every part of the language needs a page. The feature list is read
      # from the compiler, so this fails when something is added and left
      # undocumented. Ungated.
      - name: Doc coverage
        id: coverage
        continue-on-error: true
        run: ./flow tool doc_coverage

      # The launchers that stay shell (tools/shell_ratchet/allow.txt), and
      # any .sh left in scripts/; find keeps an empty set from failing
      # (#1153).
      - name: Lint (shellcheck)
        id: lint
        if: needs.changes.outputs.workflow == 'true'
        continue-on-error: true
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck flow flow-lsp $(find scripts -maxdepth 1 -type f -name '*.sh' -print)

      - name: Set up Python for pip-audit
        if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
        continue-on-error: true
        uses: ./.github/actions/setup-python
      - name: Security scan (pip-audit)
        id: security
        if: needs.changes.outputs.src == 'true' || needs.changes.outputs.deps == 'true'
        continue-on-error: true
        run: pip-audit -r requirements.lock

      - name: flow-pygments lexer tests
        id: pygments
        if: needs.changes.outputs.pygments == 'true'
        continue-on-error: true
        run: |
          cd third_party/integrations/pygments-flow
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -e .
          python3 test_lexer.py

      - name: Fail when a doc, security or pygments step failed
        if: always()
        env:
          LINKS: ${{ steps.links.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          SECURITY: ${{ steps.security.outcome }}
          PYGMENTS: ${{ steps.pygments.outcome }}
        run: |
          fail=0
          for pair in "links=$LINKS" "coverage=$COVERAGE" "security=$SECURITY" "pygments=$PYGMENTS"; do
            case "${pair#*=}" in
              success|skipped) ;;
              *) echo "failed: ${pair%%=*} (${pair#*=})"; fail=1 ;;
            esac
          done
          exit "$fail"

  # Required checks whose work runs as a step of `checks`. Each is skipped
  # when its step passed or was skipped, and fails otherwise.
  version:
    name: Version consistency
    runs-on: *flow-runner
    timeout-minutes: 5
    needs: checks
    if: always() && !contains(fromJSON('["success","skipped"]'), needs.checks.outputs.version)
    steps:
      - run: |
          echo "Version consistency: '${{ needs.checks.outputs.version }}' (job ${{ needs.checks.result }}); see the Doc links job"
          exit 1

  python-ratchet:
    name: Python ratchet (Flow first)
    runs-on: *flow-runner
    timeout-minutes: 5
    needs: checks
    if: always() && !contains(fromJSON('["success","skipped"]'), needs.checks.outputs.python)
    steps:
      - run: |
          echo "Python ratchet: '${{ needs.checks.outputs.python }}' (job ${{ needs.checks.result }}); see the Doc links job"
          exit 1

  shell-ratchet:
    name: Shell ratchet (Flow first)
    runs-on: *flow-runner
    timeout-minutes: 5
    needs: checks
    if: always() && !contains(fromJSON('["success","skipped"]'), needs.checks.outputs.shell)
    steps:
      - run: |
          echo "Shell ratchet: '${{ needs.checks.outputs.shell }}' (job ${{ needs.checks.result }}); see the Doc links job"
          exit 1

  # The lint step only runs when the workflow, the launchers or scripts/
  # changed, so a skipped step passes. An empty outcome means the checks
  # job did not get that far, which fails.
  lint:
    name: Lint
    runs-on: *flow-runner
    timeout-minutes: 5
    needs: checks
    if: always() && !contains(fromJSON('["success","skipped"]'), needs.checks.outputs.lint)
    steps:
      - run: |
          echo "Lint: '${{ needs.checks.outputs.lint }}' (job ${{ needs.checks.result }}); see the Doc links job"
          exit 1

  # Documented examples are compiled, then the complete programs are run.
  # A ratchet, not a wall: the examples that do not build today are
  # recorded in docs/generated/example-status.json and grandfathered. Rows
  # are keyed by a hash of the block, so editing one revokes its exemption
  # and the new text has to compile. Running answers a different question:
  # a `defer` freeing memory before the return value was read compiled
  # cleanly (#594).
  doc-examples:
    name: Doc examples
    runs-on: *flow-runner
    timeout-minutes: 40
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache
      - name: Compile every ```flow block in the documentation
        run: ./flow tool doc_examples --check-ledger
      - name: Run every complete program in the documentation
        if: always()
        run: ./flow tool doc_examples --run --check-ledger

  flow-tier2:
    name: FLOW tier-2
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'

      - name: Tier 2 (transpile + clang, strict)
        run: |
          chmod +x ./flow
          # Tier 2 already transpiles; tier 1 was redundant (~2× work).
          # --strict: type-checker findings fail the build. Files with a
          # documented "# flow:lenient - <reason>" pragma are exempt.
          ./flow test --tier2 --strict

      - name: Rosetta Code examples (run and compare output)
        run: ./flow test-runtime examples/rosetta

  flowc-bootstrap:
    name: flowc self-host roundtrip
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    env:
      # The runner has four CPUs. selfcompile_audit (inside the roundtrip)
      # and parity_proofs default to half of them; both print their results
      # in input order, whatever the job count.
      FLOW_GATE_JOBS: '4'
      # self_host_full starts from compiler/build/flowc_bootstrap wherever
      # it runs (#1435); the self-host job runs it, so the roundtrip leaves
      # it out.
      FLOWC_ROUNDTRIP_SKIP_SELF_HOST_FULL: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      # No Python: the compiler host is flowc built from compiler/src by the
      # bootstrap binary (compiler/scripts/flowc_host.flow), and the per-module
      # headers come from the Flow tool scripts/tools/c_to_hdr.
      - name: c_to_hdr goldens
        run: ./flow tool tests/c_to_hdr/run.flow

      - name: Stage-A/B self-host roundtrip
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          # Full roundtrip: Phase-A fixtures + Phase-B bundle/topo/self-emit path.
          timeout 30m ./flow tool compiler/scripts/roundtrip.flow

      # The proof layer runs on flowc; the gate holds it to the recorded
      # Python behaviour (accept/reject, program output). The live diff
      # against the Python at a revision is `--python <rev>`.
      - name: proof layer parity (flowc)
        run: timeout 20m ./flow tool compiler/scripts/parity_proofs.flow

      - name: Stage flowc driver for artifact
        run: |
          mkdir -p /tmp/flowc-driver
          picked=""
          for cand in \
            stage_a_driver_flow_self \
            stage_a_driver_flow_g2 \
            stage_a_driver_flow \
            stage_a_driver
          do
            if [[ -x "compiler/build/$cand" ]]; then
              cp "compiler/build/$cand" /tmp/flowc-driver/flowc
              picked="$cand"
              break
            fi
          done
          if [[ -z "$picked" ]]; then
            echo "No stage_a_driver* binary after roundtrip"
            ls -la compiler/build || true
            exit 1
          fi
          echo "Staged $picked as flowc-driver/flowc"
          chmod +x /tmp/flowc-driver/flowc

      - name: Upload Stage-A flowc driver
        uses: actions/upload-artifact@v4
        with:
          name: flowc-driver
          path: /tmp/flowc-driver/flowc
          if-no-files-found: error
          retention-days: 3

      # Phase D: user-facing compile with the Stage-A driver must not
      # pip-install the Python compiler. This was a separate job that
      # downloaded the artifact above; it runs on the staged copy here.
      - name: Stage-A compile without Python/pip (flowc compile)
        env:
          FLOW_HOST: flowc
          FLOWC_BIN: /tmp/flowc-driver/flowc
        run: |
          rm -rf build/fibonacci build/hello_world
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow
          # fibonacci.flow main returns fib(10) == 55 as process exit status
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

  # Phase D/E: a clean checkout must produce a working flowc with cc alone, and
  # three consecutive generations of flowc must agree byte for byte.
  # Deliberately no setup-python step. That is the point of this job.
  flowc-selfhost:
    name: flowc self-host (no Python)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    env:
      # selfcompile_audit audits four modules at a time on the four-CPU
      # runner and prints them in input order.
      FLOW_GATE_JOBS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      - name: Build flowc from the checked-in bootstrap C
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          ./compiler/scripts/bootstrap_from_c.sh

      - name: Every compiler/src module compiles under flowc
        run: ./flow tool compiler/scripts/selfcompile_audit.flow

      - name: Three consecutive generation fixed-points
        run: ./flow tool compiler/scripts/self_host_full.flow

      - name: Compile and run a Flow program (FLOW_HOST=flowc)
        env:
          FLOW_HOST: flowc
        run: |
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      - name: Same again with python and python3 removed from PATH
        run: |
          mkdir -p /tmp/nopy
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy/python3
          cp /tmp/nopy/python3 /tmp/nopy/python
          chmod +x /tmp/nopy/python3 /tmp/nopy/python
          rm -rf compiler/build build
          export PATH="/tmp/nopy:$PATH"
          export FLOW_HOST=flowc
          ./compiler/scripts/bootstrap_from_c.sh
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      # The default `flow run` / `flow compile` path from a clean compiler/build
      # and build/: flowc comes from ensure_flowc (bootstrap C with cc), and the
      # dependency sync check is scripts/tools/pkg_sync. The check stubs python
      # and python3 to log and exit 127, and fails if either is called.
      - name: flow run with python and python3 stubbed to exit 127
        run: ./flow tool scripts/check_run_without_python.flow

      - name: Package the distributable compiler
        run: ./flow tool compiler/scripts/package_flowc.flow

      - name: Upload flowc package
        uses: actions/upload-artifact@v4
        with:
          name: flowc-package-linux
          path: dist/flowc-*
          if-no-files-found: error
          retention-days: 7

  # Goldens for the compiler's outputs and the commands built on it, then
  # the MLIR emitter and commands with LLVM/MLIR 22. Each runner builds what
  # it needs from a clean checkout, so nothing here waits on the self-host
  # job. Gated on the `goldens` filter, which `./flow tool ci_gating` holds
  # to everything these goldens read.
  flowc-goldens:
    name: flowc goldens and MLIR (no Python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.goldens == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      - name: C output goldens (tests/cgen)
        run: ./flow tool tests/cgen/run.flow

      - name: flow check goldens (tests/check)
        run: ./flow tool tests/check/run.flow

      - name: flow python generator goldens (tests/pywheel)
        run: ./flow tool tests/pywheel/run.flow

      - name: Project test runner parity (flow test)
        run: ./flow tool compiler/scripts/parity_project_test.flow

      - name: Debug adapter parity (flow dap)
        run: ./flow tool compiler/scripts/parity_dap.flow

      - name: FIR-G goldens (flow fir-g)
        run: ./flow tool tests/fir/run.flow

      - name: flow run --json goldens (tools/run)
        run: ./flow tool tests/flow_run/run.flow

      - name: Package command goldens (init, publish, build, clean)
        run: ./flow tool scripts/check_pkg_commands.flow

      - name: Package dependency goldens (install, sync, add, search, info)
        run: ./flow tool scripts/check_pkg_parity.flow

      - name: GPU shader goldens (flow gpu)
        run: ./flow tool tests/gpu/run.flow

      - name: GPU and shader crossing pages
        run: ./flow tool tests/gpu/crossing.flow

      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'

      # The MLIR emitter (compiler/src/mlirgen.flow) against the goldens
      # recorded from the Python generator, with python stubbed out: the
      # fixtures must emit the same MLIR and, lowered with mlir-opt, print
      # the same output; recorded corpus programs must not regress.
      - name: MLIR emitter parity against goldens (no Python)
        run: |
          mkdir -p /tmp/nopy-mlir
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy-mlir/python3
          cp /tmp/nopy-mlir/python3 /tmp/nopy-mlir/python
          chmod +x /tmp/nopy-mlir/python3 /tmp/nopy-mlir/python
          PATH="/tmp/nopy-mlir:$PATH" timeout 10m ./flow tool compiler/scripts/parity_mlir.flow
          # --backend=mlir on the flowc host needs no Python either.
          PATH="/tmp/nopy-mlir:$PATH" FLOW_HOST=flowc \
            ./flow run --backend=mlir compiler/fixtures/mlir/control.flow

      # flow mlir (with --optimize, --llvm, --mlir-gpu, --emit-spirv and the
      # pass pipelines), mlir-run, jit, ml, test-mlir, test-matmul and
      # compile-audio --mlir against the goldens recorded from the Python
      # MLIR stack; the runner stubs python itself.
      - name: MLIR command goldens (no Python)
        run: timeout 20m ./flow tool tests/mlir_commands/run.flow

  # Host tools written in Flow (flow repl) run their stdin transcripts with
  # python and python3 removed from PATH, so a Python fallback cannot hide.
  # The same job runs tests/scripts, the Flow tests that replaced the pytest
  # files; they drive ./flow, the Flow tools and the docs as subprocesses.
  native-tools:
    name: Native tools (no Python)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.tools == 'true' ||
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      # The runners are Flow programs (tests/tools/run.flow and the ones it
      # starts), built by `./flow tool`. The cc-only bootstrap and its smoke
      # test are the self-host job's; here ./flow builds what it needs.
      - name: Tool transcripts without Python
        run: |
          mkdir -p /tmp/nopy
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy/python3
          cp /tmp/nopy/python3 /tmp/nopy/python
          chmod +x /tmp/nopy/python3 /tmp/nopy/python
          export PATH="/tmp/nopy:$PATH"
          chmod +x ./flow compiler/scripts/*.sh
          ./flow tool tests/tools/run.flow

      # Checks print SKIP when mlir-opt or emcc is missing, as on this runner.
      # The runner (tests/scripts/run.flow) stubs python and python3 itself.
      - name: Flow tests (tests/scripts)
        run: ./flow test-scripts

      # The benchmark publisher's harness builds and runs each published
      # program and checks its result (scripts/tools/bench_publish).
      - name: Benchmark publisher check
        run: ./flow tool bench_publish --check

      # The flow command line (tools/flow_cli, built by the ./flow stub)
      # against goldens recorded from the bash driver it replaced: stdout,
      # stderr, exit code and files written for every subcommand, per OS.
      - name: CLI goldens (tests/cli)
        run: ./flow tool tests/cli/run.flow

  # Non-regression gates for the Flow ports. Each runs in golden mode against
  # outputs recorded from the Python reference, so it needs only a C
  # compiler. parity_shader_dsl skips its xcrun metal step where there is no
  # Metal toolchain. Parse coverage runs first and reports through the
  # `flowc parse coverage` job below. Parse coverage and fmt_check read every
  # tracked .flow file, so any .flow change runs this job.
  flowc-parity-gates:
    name: flowc parity gates (golden)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.flowfiles == 'true'
    outputs:
      parse: ${{ steps.parse.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache
      - name: Build flowc from the bootstrap C
        run: ./flow tool compiler/scripts/ensure_flowc.flow
      # flowc must keep parsing every .flow file the Python parser accepts.
      # The count of files that parse may not fall below
      # compiler/parse_coverage/floor.txt.
      - name: Parse every tracked .flow file with flowc (parse coverage)
        id: parse
        continue-on-error: true
        run: ./flow tool compiler/scripts/parse_coverage.flow --check
      - name: parity_lowering
        run: timeout 20m ./flow tool compiler/scripts/parity_lowering.flow
      - name: parity_field_dsl
        run: timeout 10m ./flow tool compiler/scripts/parity_field_dsl.flow
      - name: parity_shader_dsl
        run: timeout 10m ./flow tool compiler/scripts/parity_shader_dsl.flow
      - name: parity_dynamics_dsl
        run: timeout 10m ./flow tool compiler/scripts/parity_dynamics_dsl.flow
      - name: parity_flow_blocks
        run: timeout 10m ./flow tool compiler/scripts/parity_flow_blocks.flow
      - name: parity_effects
        run: timeout 10m ./flow tool compiler/scripts/parity_effects.flow
      - name: parity_typecheck --check
        run: timeout 20m ./flow tool compiler/scripts/parity_typecheck.flow --check
      - name: typecheck_rules
        run: timeout 10m ./flow tool compiler/scripts/typecheck_rules.flow
      - name: fmt_check --check
        run: timeout 20m ./flow tool compiler/scripts/fmt_check.flow --check

  flowc-parse-coverage:
    name: flowc parse coverage
    runs-on: *flow-runner
    timeout-minutes: 5
    needs: flowc-parity-gates
    if: always() && needs.flowc-parity-gates.result != 'skipped' && !contains(fromJSON('["success","skipped"]'), needs.flowc-parity-gates.outputs.parse)
    steps:
      - run: |
          echo "flowc parse coverage: '${{ needs.flowc-parity-gates.outputs.parse }}' (job ${{ needs.flowc-parity-gates.result }}); see the parity gates job"
          exit 1

  # Whole-corpus parity between the flowc and Python hosts on the C backend,
  # against recorded Python goldens (no Python). The floor is kept per OS;
  # --check passes with a note on an OS that has none recorded yet. Files
  # with no Python golden are reported without being built.
  flowc-corpus-parity:
    name: flowc corpus parity
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache
      - name: corpus_parity --check
        run: timeout 45m ./flow tool compiler/scripts/corpus_parity.flow --check

  # tests/lang through the Stage-A compiler, as `./flow test-lang` runs it
  # locally: strict transpile, link (with the concurrency runtime when a
  # program imports it), run, and compare the exit code and any .expected
  # output. Each program runs under a time limit and a hang fails with a
  # timeout line (#1174). Before it, tests/runtime, compiled with the flowc
  # host and linked against the runtime archive, which reports through the
  # `Runtime tests` job below.
  lang-tests:
    name: Language tests
    runs-on: *flow-runner
    timeout-minutes: 45
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.tools == 'true' ||
      needs.changes.outputs.workflow == 'true'
    outputs:
      runtime: ${{ steps.runtime.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      - uses: ./.github/actions/install-toolchain

      - name: Runtime tests (tests/runtime)
        id: runtime
        continue-on-error: true
        timeout-minutes: 30
        run: ./flow test-runtime

      - name: Language tests (tests/lang)
        run: ./flow test-lang

  runtime-tests:
    name: Runtime tests
    runs-on: *flow-runner
    timeout-minutes: 5
    needs: lang-tests
    if: always() && needs.lang-tests.result != 'skipped' && !contains(fromJSON('["success","skipped"]'), needs.lang-tests.outputs.runtime)
    steps:
      - run: |
          echo "Runtime tests: '${{ needs.lang-tests.outputs.runtime }}' (job ${{ needs.lang-tests.result }}); see the Language tests job"
          exit 1

  # Quick end-to-end checks, each a step gated on its own paths: the Stable
  # conformance corpus, the fuzzer (crash pins, deep nesting and 30s of
  # seeded mutation; fails on a signal or a hang), the example smoke and the
  # plugin DSP correctness tests.
  smoke:
    name: Smoke (conformance, fuzz, examples, plugin DSP)
    runs-on: *flow-runner
    timeout-minutes: 40
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.plugins == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      - name: Stable conformance corpus
        if: needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true'
        run: ./flow tool tests/conformance/run.flow

      - name: Fuzz flowc
        if: always() && (needs.changes.outputs.src == 'true' || needs.changes.outputs.tests == 'true')
        run: |
          ./flow tool compiler/scripts/ensure_flowc.flow
          ./flow tool tests/fuzz/run.flow --seconds 30 --seed 1234

      - name: Set up Python for the example smoke
        if: always() && (needs.changes.outputs.src == 'true' || needs.changes.outputs.examples == 'true')
        uses: ./.github/actions/setup-python

      - name: Example smoke (hello_world + fibonacci)
        if: always() && (needs.changes.outputs.src == 'true' || needs.changes.outputs.examples == 'true')
        run: |
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow

      - name: Build and run Schur DSP correctness tests
        if: always() && (needs.changes.outputs.plugins == 'true' || needs.changes.outputs.workflow == 'true')
        run: |
          cd plugins/SchurPhaser
          ./tests/run.sh

  windows-gfx-stub:
    name: Windows gfx stub smoke
    runs-on: windows-latest
    needs: changes
    if: |
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile + run gfx_windows.c under FLOW_GFX_STUB
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang -O2 -DFLOW_GFX_STUB \
              runtime/tests/gfx_stub_smoke.c runtime/gfx_windows.c \
              -o gfx_stub_smoke.exe
          else
            cl /nologo /O2 /DFLOW_GFX_STUB \
              runtime/tests/gfx_stub_smoke.c runtime/gfx_windows.c \
              /Fe:gfx_stub_smoke.exe
          fi
          ./gfx_stub_smoke.exe

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/flow-bin-cache

      - uses: ./.github/actions/setup-python

      - name: Fibonacci benchmark
        run: |
          chmod +x ./flow
          ./flow compile benchmarks/suite/flow/01_fibonacci.flow
          ./build/01_fibonacci

  ci-ok:
    name: CI
    runs-on: *flow-runner
    timeout-minutes: 10
    needs:
      - changes
      - checks
      - doc-examples
      - flow-tier2
      - flowc-bootstrap
      - flowc-selfhost
      - flowc-goldens
      - lang-tests
      - smoke
      - windows-gfx-stub
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Summarize job results
        id: summarize
        env:
          CI_FAILED: ${{ job.status != 'success' }}
        run: |
          fail=0
          FIELDS=""
          FAILURES=""
          add() {
            local name="$1"
            local result="$2"
            local required="$3"
            if [ "$required" != "true" ]; then
              FIELDS="$FIELDS{\"name\":\"$name\",\"value\":\"skipped\",\"inline\":true},"
              return
            fi
            case "$result" in
              success) glyph="passed" ;;
              skipped) glyph="skipped" ;;
              *) glyph="failed ($result)"; fail=1; FAILURES="$FAILURES ${name}" ;;
            esac
            FIELDS="$FIELDS{\"name\":\"$name\",\"value\":\"$glyph\",\"inline\":true},"
          }
          src='${{ needs.changes.outputs.src }}'
          tests='${{ needs.changes.outputs.tests }}'
          examples='${{ needs.changes.outputs.examples }}'
          libs='${{ needs.changes.outputs.libs }}'
          runtime='${{ needs.changes.outputs.runtime }}'
          compiler='${{ needs.changes.outputs.compiler }}'
          workflow='${{ needs.changes.outputs.workflow }}'
          plugins='${{ needs.changes.outputs.plugins }}'
          deps='${{ needs.changes.outputs.deps }}'
          tools='${{ needs.changes.outputs.tools }}'
          docs='${{ needs.changes.outputs.docs }}'
          goldens='${{ needs.changes.outputs.goldens }}'
          tier_req=false;  if [ "$src" = "true" ] || [ "$tests" = "true" ] || [ "$examples" = "true" ] || [ "$libs" = "true" ] || [ "$runtime" = "true" ]; then tier_req=true; fi
          compiler_req=false; if [ "$compiler" = "true" ] || [ "$workflow" = "true" ]; then compiler_req=true; fi
          gfx_req=false;   if [ "$runtime" = "true" ] || [ "$workflow" = "true" ]; then gfx_req=true; fi
          suite_req=false; if [ "$compiler" = "true" ] || [ "$libs" = "true" ] || [ "$runtime" = "true" ] || [ "$tests" = "true" ] || [ "$tools" = "true" ] || [ "$workflow" = "true" ]; then suite_req=true; fi
          smoke_req=false; if [ "$src" = "true" ] || [ "$tests" = "true" ] || [ "$examples" = "true" ] || [ "$plugins" = "true" ] || [ "$workflow" = "true" ]; then smoke_req=true; fi
          docex_req=false; if [ "$src" = "true" ] || [ "$docs" = "true" ]; then docex_req=true; fi
          goldens_req=false; if [ "$goldens" = "true" ]; then goldens_req=true; fi
          # The checks job is ungated; its steps report one by one.
          add checks            '${{ needs.checks.result }}'            true
          add version           '${{ needs.checks.outputs.version }}'   true
          add python-ratchet    '${{ needs.checks.outputs.python }}'    true
          add shell-ratchet     '${{ needs.checks.outputs.shell }}'     true
          add doc-coverage      '${{ needs.checks.outputs.coverage }}'  true
          add lint              '${{ needs.checks.outputs.lint }}'      true
          add security          '${{ needs.checks.outputs.security }}'  true
          add doc-examples      '${{ needs.doc-examples.result }}'      "$docex_req"
          add flow-tier2        '${{ needs.flow-tier2.result }}'        "$tier_req"
          add flowc-bootstrap   '${{ needs.flowc-bootstrap.result }}'   "$compiler_req"
          add flowc-selfhost    '${{ needs.flowc-selfhost.result }}'    "$compiler_req"
          add flowc-goldens     '${{ needs.flowc-goldens.result }}'     "$goldens_req"
          add lang-tests        '${{ needs.lang-tests.result }}'        "$suite_req"
          add runtime-tests     '${{ needs.lang-tests.outputs.runtime }}' "$suite_req"
          add smoke             '${{ needs.smoke.result }}'             "$smoke_req"
          add windows-gfx-stub  '${{ needs.windows-gfx-stub.result }}'  "$gfx_req"
          # meta fields so the embed also carries where to look.
          SERVER="$GITHUB_SERVER_URL"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          RUNURL="$SERVER/$REPO/actions/runs/${{ github.run_id }}"
          FIELDS="$FIELDS{\"name\":\"Commit\",\"value\":\"[\`$SHA\`]($SERVER/$REPO/commit/$SHA)\",\"inline\":true},"
          FIELDS="$FIELDS{\"name\":\"Branch\",\"value\":\"\`${{ github.head_ref || github.ref_name }}\`\",\"inline\":true},"
          FIELDS="$FIELDS{\"name\":\"Run\",\"value\":\"#${{ github.run_number }}\",\"inline\":true}"
          subject="$(git -C "$GITHUB_WORKSPACE" log -1 --format='%s' 2>/dev/null || echo '')"
          if [ "$fail" = "1" ]; then failed_out=true; else failed_out=false; fi
          {
            echo "failed=$failed_out"
            echo "failures=${FAILURES# }"
            echo "fields=[$FIELDS]"
            echo "subject=$subject"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require passing jobs
        if: steps.summarize.outputs.failed == 'true'
        run: |-
          echo "Required jobs failed: ${{ steps.summarize.outputs.failures }}"
          exit 1

      # Notify on main pushes always; on PRs only when something failed (cut noise).
      - name: Post CI status to Discord #ci-releases
        if: >-
          always() &&
          (github.event_name == 'push' ||
           steps.summarize.outputs.failed == 'true')
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
          botname: Flow CI
          avatar_url: ${{ github.server_url }}/${{ github.repository_owner }}.png
          content: "${{ steps.summarize.outputs.failed == 'true' && format('CI failed: {0}', steps.summarize.outputs.failures) || '' }}"
          color: ${{ steps.summarize.outputs.failed == 'true' && '15158332' || '3066993' }}
          title: CI ${{ steps.summarize.outputs.failed == 'true' && 'failed' || 'passed' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: "${{ github.repository }} on ${{ github.event_name }} by ${{ github.actor }}: ${{ steps.summarize.outputs.subject }}"
          author_name: Flow CI
          author_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
          fields: ${{ steps.summarize.outputs.fields }}
          footer_text: Flow CI · run ${{ github.run_id }}
          footer_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
