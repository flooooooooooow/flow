name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'flow.toml'
      - '.github/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'flow.toml'
      - '.github/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      compiler: ${{ steps.filter.outputs.compiler }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
      libs: ${{ steps.filter.outputs.libs }}
      runtime: ${{ steps.filter.outputs.runtime }}
      workflow: ${{ steps.filter.outputs.workflow }}
      plugins: ${{ steps.filter.outputs.plugins }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
            compiler:
              - 'compiler/**'
              - 'src/flow/c_generator.py'
            tests:
              - 'tests/**'
            examples:
              - 'examples/**'
            libs:
              - 'lib/**'
            runtime:
              - 'runtime/**'
            workflow:
              - '.github/**'
              - 'flow'
              - 'scripts/**'
            plugins:
              - 'plugins/**'
            deps:
              - 'requirements.lock'
              - 'requirements.txt'
              - 'pyproject.toml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-toolchain
        with:
          shellcheck: 'true'

      - name: Ruff
        run: ruff check src

      - name: Mypy (best effort)
        if: needs.changes.outputs.src == 'true'
        run: mypy src || true

      - name: Shellcheck
        if: needs.changes.outputs.workflow == 'true'
        run: shellcheck flow scripts/*.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Bandit
        if: needs.changes.outputs.src == 'true'
        run: bandit -r src -ll

      - name: pip-audit
        run: pip-audit -r requirements.lock

  flow-tier2:
    name: FLOW tier-2
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'

      - name: Tier 2 (transpile + clang, strict)
        env:
          PYTHONPATH: src
        run: |
          chmod +x ./flow
          # Tier 2 already transpiles; tier 1 was redundant (~2× work).
          # --strict: type-checker findings fail the build. Files with a
          # documented "# flow:lenient - <reason>" pragma are exempt.
          ./flow test --tier2 --strict

  flowc-bootstrap:
    name: flowc Stage-A bootstrap
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Stage-A self-host roundtrip
        env:
          PYTHONPATH: src
          FLOWC_PHASE_A_ONLY: "1"
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          timeout 12m ./compiler/scripts/roundtrip.sh

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Pytest (fast)
        env:
          PYTHONPATH: src
          PYTEST_ADDOPTS: --tb=short -q
        run: pytest tests/ -m "not slow"

  fuzz:
    name: Fuzz (parser/pipeline)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Fuzz targets (30s each, fails only on new crash classes)
        env:
          PYTHONPATH: src
        run: python3 tests/fuzz/run_fuzz.py --seconds 30 --seed 1234

  plugin-dsp:
    name: Plugin DSP test
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.plugins == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build and run Schur DSP correctness tests
        run: |
          cd plugins/SchurPhaser
          ./tests/run.sh

  flow-examples:
    name: Example smoke
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.examples == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: hello_world + fibonacci
        env:
          PYTHONPATH: src
        run: |
          chmod +x ./flow
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Fibonacci benchmark
        env:
          PYTHONPATH: src
        run: |
          chmod +x ./flow
          ./flow compile benchmarks/suite/flow/01_fibonacci.flow
          ./build/01_fibonacci

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - security
      - flow-tier2
      - flowc-bootstrap
      - pytest
      - fuzz
      - flow-examples
      - plugin-dsp
    if: always()
    steps:
      - name: Require passing jobs
        run: |
          fail=0
          check() {
            local name="$1"
            local result="$2"
            local required="$3"
            if [ "$required" != "true" ]; then
              echo "↷ $name (skipped)"
              return
            fi
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "✗ $name ($result)"
              fail=1
            else
              echo "✓ $name"
            fi
          }
          src='${{ needs.changes.outputs.src }}'
          tests='${{ needs.changes.outputs.tests }}'
          examples='${{ needs.changes.outputs.examples }}'
          libs='${{ needs.changes.outputs.libs }}'
          runtime='${{ needs.changes.outputs.runtime }}'
          compiler='${{ needs.changes.outputs.compiler }}'
          workflow='${{ needs.changes.outputs.workflow }}'
          deps='${{ needs.changes.outputs.deps }}'
          lint_req=false
          if [ "$src" = "true" ] || [ "$workflow" = "true" ] || [ "$deps" = "true" ]; then lint_req=true; fi
          sec_req=false
          if [ "$src" = "true" ] || [ "$deps" = "true" ]; then sec_req=true; fi
          tier_req=false
          if [ "$src" = "true" ] || [ "$tests" = "true" ] || [ "$libs" = "true" ] || [ "$runtime" = "true" ]; then tier_req=true; fi
          pytest_req=false
          if [ "$src" = "true" ] || [ "$tests" = "true" ]; then pytest_req=true; fi
          fuzz_req=$pytest_req
          ex_req=false
          if [ "$src" = "true" ] || [ "$examples" = "true" ]; then ex_req=true; fi
          check lint '${{ needs.lint.result }}' "$lint_req"
          check security '${{ needs.security.result }}' "$sec_req"
          check flow-tier2 '${{ needs.flow-tier2.result }}' "$tier_req"
          compiler_req=false
          if [ "$compiler" = "true" ] || [ "$workflow" = "true" ]; then compiler_req=true; fi
          check flowc-bootstrap '${{ needs.flowc-bootstrap.result }}' "$compiler_req"
          check pytest '${{ needs.pytest.result }}' "$pytest_req"
          check fuzz '${{ needs.fuzz.result }}' "$fuzz_req"
          check flow-examples '${{ needs.flow-examples.result }}' "$ex_req"
          plugins='${{ needs.changes.outputs.plugins }}'
          plugin_req=false
          if [ "$plugins" = "true" ] || [ "$workflow" = "true" ]; then plugin_req=true; fi
          check plugin-dsp '${{ needs.plugin-dsp.result }}' "$plugin_req"
          exit $fail