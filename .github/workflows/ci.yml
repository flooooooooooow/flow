name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'flow.toml'
      - '.github/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'compiler/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - 'flow.toml'
      - '.github/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'scripts/**'
      - 'plugins/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      compiler: ${{ steps.filter.outputs.compiler }}
      tests: ${{ steps.filter.outputs.tests }}
      examples: ${{ steps.filter.outputs.examples }}
      libs: ${{ steps.filter.outputs.libs }}
      runtime: ${{ steps.filter.outputs.runtime }}
      workflow: ${{ steps.filter.outputs.workflow }}
      plugins: ${{ steps.filter.outputs.plugins }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
            compiler:
              - 'compiler/**'
              - 'src/flow/c_generator.py'
            tests:
              - 'tests/**'
            examples:
              - 'examples/**'
            libs:
              - 'lib/**'
            runtime:
              - 'runtime/**'
            workflow:
              - '.github/**'
              - 'flow'
              - 'scripts/**'
            plugins:
              - 'plugins/**'
            deps:
              - 'requirements.lock'
              - 'requirements.txt'
              - 'pyproject.toml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-toolchain
        with:
          shellcheck: 'true'

      - name: Ruff
        run: ruff check src

      - name: Mypy (best effort)
        if: needs.changes.outputs.src == 'true'
        run: mypy src || true

      - name: Shellcheck
        if: needs.changes.outputs.workflow == 'true'
        run: shellcheck flow scripts/*.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Bandit
        if: needs.changes.outputs.src == 'true'
        run: bandit -r src -ll

      - name: pip-audit
        run: pip-audit -r requirements.lock

  flow-tier2:
    name: FLOW tier-2
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true' ||
      needs.changes.outputs.libs == 'true' ||
      needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-toolchain
        with:
          mlir: 'true'

      - name: Tier 2 (transpile + clang, strict)
        env:
          PYTHONPATH: src
        run: |
          chmod +x ./flow
          # Tier 2 already transpiles; tier 1 was redundant (~2× work).
          # --strict: type-checker findings fail the build. Files with a
          # documented "# flow:lenient - <reason>" pragma are exempt.
          ./flow test --tier2 --strict

  flowc-bootstrap:
    name: flowc self-host roundtrip
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      # Gen0 still imports the Python transpiler (numpy via gpu_runtime). User
      # compile is proven pip-free in the flowc-compile job below.
      - uses: ./.github/actions/setup-python

      - name: Stage-A/B self-host roundtrip
        env:
          PYTHONPATH: src
          FLOW_HOST: python
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          # Full roundtrip: Phase-A fixtures + Phase-B bundle/topo/self-emit path.
          timeout 20m ./compiler/scripts/roundtrip.sh

      - name: Stage flowc driver for artifact
        run: |
          mkdir -p /tmp/flowc-driver
          picked=""
          for cand in \
            stage_a_driver_flow_self \
            stage_a_driver_flow_g2 \
            stage_a_driver_flow \
            stage_a_driver
          do
            if [[ -x "compiler/build/$cand" ]]; then
              cp "compiler/build/$cand" /tmp/flowc-driver/flowc
              picked="$cand"
              break
            fi
          done
          if [[ -z "$picked" ]]; then
            echo "No stage_a_driver* binary after roundtrip"
            ls -la compiler/build || true
            exit 1
          fi
          echo "Staged $picked as flowc-driver/flowc"
          chmod +x /tmp/flowc-driver/flowc

      - name: Upload Stage-A flowc driver
        uses: actions/upload-artifact@v4
        with:
          name: flowc-driver
          path: /tmp/flowc-driver/flowc
          if-no-files-found: error
          retention-days: 3

  # Phase D/E: a clean checkout must produce a working flowc with cc alone, and
  # three consecutive generations of flowc must agree byte for byte.
  # Deliberately no setup-python step — that is the point of this job.
  flowc-selfhost:
    name: flowc self-host (no Python)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build flowc from the checked-in bootstrap C
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          ./compiler/scripts/bootstrap_from_c.sh

      - name: Every compiler/src module compiles under flowc
        run: ./compiler/scripts/selfcompile_audit.sh

      - name: Three consecutive generation fixed-points
        run: ./compiler/scripts/self_host_full.sh

      - name: Compile and run a Flow program (FLOW_HOST=flowc)
        env:
          FLOW_HOST: flowc
        run: |
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      - name: Same again with python and python3 removed from PATH
        run: |
          mkdir -p /tmp/nopy
          printf '#!/bin/sh\necho "python invoked: $0 $*" >&2\nexit 127\n' > /tmp/nopy/python3
          cp /tmp/nopy/python3 /tmp/nopy/python
          chmod +x /tmp/nopy/python3 /tmp/nopy/python
          rm -rf compiler/build build
          export PATH="/tmp/nopy:$PATH"
          export FLOW_HOST=flowc
          ./compiler/scripts/bootstrap_from_c.sh
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      - name: Package the distributable compiler
        run: ./compiler/scripts/package_flowc.sh

      - name: Upload flowc package
        uses: actions/upload-artifact@v4
        with:
          name: flowc-package-linux
          path: dist/flowc-*
          if-no-files-found: error
          retention-days: 7

  # Phase D: user-facing compile must not pip-install the Python compiler.
  flowc-compile:
    name: flowc compile (no pip)
    runs-on: ubuntu-latest
    needs: [changes, flowc-bootstrap]
    if: |
      needs.changes.outputs.compiler == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Download Stage-A flowc driver
        uses: actions/download-artifact@v4
        with:
          name: flowc-driver
          path: compiler/build

      - name: Stage-A compile without Python/pip
        env:
          FLOW_HOST: flowc
        run: |
          chmod +x ./flow
          FLOWC_BIN="compiler/build/flowc"
          if [[ ! -f "$FLOWC_BIN" ]]; then
            echo "Missing downloaded flowc at $FLOWC_BIN"
            ls -laR compiler/build || true
            exit 1
          fi
          chmod +x "$FLOWC_BIN"
          export FLOWC_BIN
          echo "Using flowc: $FLOWC_BIN"
          # No ensure_flowc / Gen0 bootstrap here — that would need Python.
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow
          # fibonacci.flow main returns fib(10) == 55 as process exit status
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Pytest (fast)
        env:
          PYTHONPATH: src
          PYTEST_ADDOPTS: --tb=short -q
        run: pytest tests/ -m "not slow"

  fuzz:
    name: Fuzz (parser/pipeline)
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.tests == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Fuzz targets (30s each, fails only on new crash classes)
        env:
          PYTHONPATH: src
        run: python3 tests/fuzz/run_fuzz.py --seconds 30 --seed 1234

  plugin-dsp:
    name: Plugin DSP test
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.plugins == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build and run Schur DSP correctness tests
        run: |
          cd plugins/SchurPhaser
          ./tests/run.sh

  flow-examples:
    name: Example smoke
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.src == 'true' ||
      needs.changes.outputs.examples == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: hello_world + fibonacci
        env:
          PYTHONPATH: src
          # Example smoke stays on the full-language Python host until Phase D.
          FLOW_HOST: python
        run: |
          chmod +x ./flow
          ./flow run examples/basics/hello_world.flow
          ./flow compile examples/basics/fibonacci.flow

  windows-gfx-stub:
    name: Windows gfx stub smoke
    runs-on: windows-latest
    needs: changes
    if: |
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Compile + run gfx_windows.c under FLOW_GFX_STUB
        shell: bash
        run: |
          set -euo pipefail
          if command -v clang >/dev/null 2>&1; then
            clang -O2 -DFLOW_GFX_STUB \
              runtime/tests/gfx_stub_smoke.c runtime/gfx_windows.c \
              -o gfx_stub_smoke.exe
          else
            cl /nologo /O2 /DFLOW_GFX_STUB \
              runtime/tests/gfx_stub_smoke.c runtime/gfx_windows.c \
              /Fe:gfx_stub_smoke.exe
          fi
          ./gfx_stub_smoke.exe

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-python

      - name: Fibonacci benchmark
        env:
          PYTHONPATH: src
          FLOW_HOST: python
        run: |
          chmod +x ./flow
          ./flow compile benchmarks/suite/flow/01_fibonacci.flow
          ./build/01_fibonacci

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - security
      - flow-tier2
      - flowc-bootstrap
      - flowc-selfhost
      - flowc-compile
      - pytest
      - fuzz
      - flow-examples
      - plugin-dsp
      - windows-gfx-stub
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Require passing jobs
        run: |
          fail=0
          check() {
            local name="$1"
            local result="$2"
            local required="$3"
            if [ "$required" != "true" ]; then
              echo "↷ $name (skipped)"
              return
            fi
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "✗ $name ($result)"
              fail=1
            else
              echo "✓ $name"
            fi
          }
          src='${{ needs.changes.outputs.src }}'
          tests='${{ needs.changes.outputs.tests }}'
          examples='${{ needs.changes.outputs.examples }}'
          libs='${{ needs.changes.outputs.libs }}'
          runtime='${{ needs.changes.outputs.runtime }}'
          compiler='${{ needs.changes.outputs.compiler }}'
          workflow='${{ needs.changes.outputs.workflow }}'
          deps='${{ needs.changes.outputs.deps }}'
          lint_req=false
          if [ "$src" = "true" ] || [ "$workflow" = "true" ] || [ "$deps" = "true" ]; then lint_req=true; fi
          sec_req=false
          if [ "$src" = "true" ] || [ "$deps" = "true" ]; then sec_req=true; fi
          tier_req=false
          if [ "$src" = "true" ] || [ "$tests" = "true" ] || [ "$libs" = "true" ] || [ "$runtime" = "true" ]; then tier_req=true; fi
          pytest_req=false
          if [ "$src" = "true" ] || [ "$tests" = "true" ]; then pytest_req=true; fi
          fuzz_req=$pytest_req
          ex_req=false
          if [ "$src" = "true" ] || [ "$examples" = "true" ]; then ex_req=true; fi
          check lint '${{ needs.lint.result }}' "$lint_req"
          check security '${{ needs.security.result }}' "$sec_req"
          check flow-tier2 '${{ needs.flow-tier2.result }}' "$tier_req"
          compiler_req=false
          if [ "$compiler" = "true" ] || [ "$workflow" = "true" ]; then compiler_req=true; fi
          check flowc-bootstrap '${{ needs.flowc-bootstrap.result }}' "$compiler_req"
          check flowc-selfhost '${{ needs.flowc-selfhost.result }}' "$compiler_req"
          check flowc-compile '${{ needs.flowc-compile.result }}' "$compiler_req"
          check pytest '${{ needs.pytest.result }}' "$pytest_req"
          check fuzz '${{ needs.fuzz.result }}' "$fuzz_req"
          check flow-examples '${{ needs.flow-examples.result }}' "$ex_req"
          plugins='${{ needs.changes.outputs.plugins }}'
          plugin_req=false
          if [ "$plugins" = "true" ] || [ "$workflow" = "true" ]; then plugin_req=true; fi
          check plugin-dsp '${{ needs.plugin-dsp.result }}' "$plugin_req"
          gfx_req=false
          if [ "$runtime" = "true" ] || [ "$workflow" = "true" ]; then gfx_req=true; fi
          check windows-gfx-stub '${{ needs.windows-gfx-stub.result }}' "$gfx_req"
          exit $fail

      - name: Post CI status to Discord #ci-releases
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
          botname: Flow CI
          color: ${{ job.status == 'success' && '3066993' || '15158332' }}
          title: CI ${{ job.status == 'success' && 'passed' || 'failed' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: '${{ github.sha }} @ ${{ github.repository }}'