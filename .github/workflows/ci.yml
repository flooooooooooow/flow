name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'runtime/**'
      - 'flow'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements.lock'

# Restrict token permissions to read-only (fixes #89)
permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only test on Ubuntu (free/cheap) with latest Python version
        # macOS runners cost 10x more - skip them for private repos
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Detect changed files
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          src:
            - 'src/**'
          tests:
            - 'tests/**'
          examples:
            - 'examples/**'
          libs:
            - 'lib/**'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Install LLVM, Clang, and MLIR tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld mlir-14-tools
        # Create symlink for mlir-opt if needed
        if [ -f /usr/bin/mlir-opt-14 ] && [ ! -f /usr/local/bin/mlir-opt ]; then
          sudo ln -sf /usr/bin/mlir-opt-14 /usr/local/bin/mlir-opt
        fi

    - name: Verify setup
      run: |
        python --version
        clang --version
        mlir-opt --version || echo "mlir-opt not available"
        echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Run Tier 1 tests (transpile only)
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true' || steps.changes.outputs.libs == 'true'
      run: |
        chmod +x ./flow
        set -x  # Show commands being executed
        ./flow test --tier1 2>&1 | tee test_output.log
        exit ${PIPESTATUS[0]}

    - name: Run Tier 2 tests (transpile + compile)
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true'
      run: |
        ./flow test --tier2

    - name: Run Python unit tests
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true'
      run: |
        PYTHONPATH=src pytest tests/ -v --tb=short

    - name: Run example programs
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.examples == 'true'
      run: |
        ./flow run examples/basics/hello_world.flow
        ./flow compile examples/basics/fibonacci.flow

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install lint dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run Ruff
      run: |
        ruff check src

    - name: Run Mypy (best effort)
      run: |
        mypy src || true

    - name: Run Shellcheck
      run: |
        shellcheck flow scripts/*.sh

    - name: Check Python syntax
      run: |
        python -m py_compile src/flow/parser.py
        python -m py_compile src/flow/c_generator.py
        python -m py_compile src/flow/transpiler.py
        python -m py_compile src/flow/type_checker.py
        python -m py_compile src/flow/mlir_generator.py
        python -m py_compile src/flow/monomorphize.py
        python -m py_compile src/flow/module_resolver.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock

    - name: Run Bandit
      run: |
        bandit -r src -ll

    - name: Run pip-audit
      run: |
        pip-audit -r requirements.lock

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmarks on pushes to main, not on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Benchmarks are informational and should not block merges
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
        pip install -r requirements.lock

    - name: Set up environment
      run: |
        echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Run benchmarks
      run: |
        chmod +x ./flow
        # Run fibonacci benchmark (spmv requires too much stack space for CI)
        ./flow compile benchmarks/suite/flow/01_fibonacci.flow && ./build/01_fibonacci
