name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'flow'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements.txt'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'lib/**'
      - 'flow'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'requirements.txt'

# Restrict token permissions to read-only
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test across supported Python versions
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Detect changed files
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          src:
            - 'src/**'
          tests:
            - 'tests/**'
          examples:
            - 'examples/**'
          libs:
            - 'lib/**'

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Install LLVM, Clang, and MLIR tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm lld mlir-14-tools
        # Create symlink for mlir-opt if needed
        if [ -f /usr/bin/mlir-opt-14 ] && [ ! -f /usr/local/bin/mlir-opt ]; then
          sudo ln -sf /usr/bin/mlir-opt-14 /usr/local/bin/mlir-opt
        fi

    - name: Verify setup
      run: |
        python --version
        clang --version
        mlir-opt --version || echo "mlir-opt not available"
        echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Run Tier 1 tests (transpile only)
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true' || steps.changes.outputs.libs == 'true'
      run: |
        chmod +x ./flow
        ./flow test --tier 1

    - name: Run Tier 2 tests (transpile + compile)
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true'
      run: |
        ./flow test --tier 2

    - name: Run Runtime tests (compile + execute)
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true'
      run: |
        ./flow test-runtime

    - name: Run MLIR verification tests
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true'
      run: |
        ./flow test-mlir

    - name: Run Python unit tests with coverage
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true'
      run: |
        PYTHONPATH=src pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --tb=short

    - name: Upload coverage report
      if: (steps.changes.outputs.src == 'true' || steps.changes.outputs.tests == 'true') && matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

    - name: Run example programs
      if: steps.changes.outputs.src == 'true' || steps.changes.outputs.examples == 'true'
      run: |
        ./flow run examples/basics/hello_world.flow
        ./flow compile examples/basics/fibonacci.flow

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install linting tools
      run: pip install ruff

    - name: Check formatting with Ruff
      run: ruff format --check src

    - name: Lint with Ruff
      run: ruff check src

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install mypy

    - name: Run Mypy
      run: mypy src

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    needs: test
    # Only run benchmarks on pushes to main, not on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Benchmarks are informational and should not block merges
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
        pip install -r requirements.txt

    - name: Set up environment
      run: |
        echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Run benchmarks
      run: |
        chmod +x ./flow
        # Run fibonacci benchmark (spmv requires too much stack space for CI)
        ./flow compile benchmarks/suite/flow/01_fibonacci.flow && ./build/01_fibonacci
