name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Restrict token permissions to read-only (fixes #89)
permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only test on Ubuntu (free/cheap) with latest Python version
        # macOS runners cost 10x more - skip them for private repos
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang

    - name: Verify setup
      run: |
        python --version
        clang --version
        echo "PYTHONPATH=src" >> $GITHUB_ENV

    - name: Run Tier 1 tests (transpile only)
      run: |
        chmod +x ./flow
        ./flow test --tier 1 || (echo "Tests failed with exit code $?" && exit 1)

    - name: Run Tier 2 tests (transpile + compile)
      run: |
        ./flow test --tier 2

    - name: Run Python unit tests
      run: |
        PYTHONPATH=src pytest tests/ -v --tb=short

    - name: Run example programs
      run: |
        ./flow run examples/basics/hello_world.flow
        ./flow compile examples/basics/variables.flow

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Check Python syntax
      run: |
        python -m py_compile src/flow/parser.py
        python -m py_compile src/flow/c_generator.py
        python -m py_compile src/flow/transpiler.py
        python -m py_compile src/flow/type_checker.py
        python -m py_compile src/flow/mlir_generator.py
        python -m py_compile src/flow/monomorphize.py
        python -m py_compile src/flow/module_resolver.py

  benchmarks:
    name: Benchmarks (informational)
    runs-on: ubuntu-latest
    needs: test
    # Benchmarks are informational and should not block merges
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
        pip install pytest

    - name: Run benchmarks
      run: |
        chmod +x ./flow
        ./flow compile benchmarks/suite/flow/01_fibonacci.flow && ./build/01_fibonacci
        ./flow compile benchmarks/suite/flow/05_spmv.flow && ./build/05_spmv
