name: Wiki

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_wiki.py'
      - 'scripts/check_wiki_links.py'
      - 'scripts/deploy_wiki.py'
      - 'lib/verify/**'
      - 'examples/verify/**'
      - 'ROADMAP.md'
      - 'docs/project/CHANGELOG.md'
      - '.github/workflows/wiki.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_wiki.py'
      - 'scripts/check_wiki_links.py'
      - 'scripts/deploy_wiki.py'
      - 'lib/verify/**'
      - 'examples/verify/**'
      - 'ROADMAP.md'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-flight deploys (a follow-up dispatch cancelled the #149 push deploy).
concurrency:
  group: wiki-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build static wiki
        run: python3 scripts/build_wiki.py

      - name: Verify wiki artifacts
        run: |
          test -f build/wiki/index.html
          test -f build/wiki/wiki-nav.json
          test -f build/wiki/search-index.json
          test -f build/wiki/flow-compile.js
          test -f build/wiki/tutorials/exercises.json
          test -f build/wiki/llms.txt
          test -f build/wiki/vendor/marked.min.js
          grep -q 'wiki.js' build/wiki/index.html
          echo "Wiki artifacts OK ($(du -sh build/wiki | cut -f1))"

      - name: Check internal links
        run: python3 scripts/check_wiki_links.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: flow-wiki
          path: build/wiki/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/wiki

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The site is ~1900 files. Raising this was not enough on its own
          # (one success, then another abort), so the proof corpus is now left
          # out of the pagefind index, cutting 1086 files. Keep the longer
          # timeout as headroom.
          timeout: 1800000
          error_count: 20

      - name: Post docs deploy to Discord #announcements
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          botname: Flow Docs Bot
          avatar_url: ${{ github.server_url }}/${{ github.repository_owner }}.png
          color: ${{ job.status == 'success' && '3066993' || '15158332' }}
          title: Docs deploy ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          url: ${{ steps.deployment.outputs.page_url || github.server_url }}
          description: Wiki deploy for commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          author_name: Flow Docs
          author_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
          fields: >-
            [
              {"name":"Commit","value":"[`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})","inline":true},
              {"name":"Trigger","value":"`${{ github.event_name }}`","inline":true},
              {"name":"Pages","value":"[site](${{ steps.deployment.outputs.page_url }})","inline":true}
            ]
          footer_text: Flow Docs · deploy ${{ github.run_id }}
          footer_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png

      - name: Post docs deploy to Discord #projects forum
        if: job.status == 'success'
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_PROJECTS_WEBHOOK }}
          botname: Flow Projects
          avatar_url: ${{ github.server_url }}/${{ github.repository_owner }}.png
          color: '5763719'
          title: Docs deploy ${{ github.run_id }}
          url: ${{ steps.deployment.outputs.page_url }}
          description: Wiki updated for commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on ${{ github.ref_name }}
          author_name: Flow
          author_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
          thread_name: Docs deploy ${{ github.run_id }}
          footer_text: Flow projects hub · deploy ${{ github.run_id }}
