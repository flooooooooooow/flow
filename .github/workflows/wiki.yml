name: Wiki

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_wiki.py'
      - 'scripts/check_wiki_links.py'
      - 'scripts/deploy_wiki.py'
      - 'lib/verify/**'
      - 'examples/verify/**'
      - 'ROADMAP.md'
      - 'docs/project/CHANGELOG.md'
      - '.github/workflows/wiki.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/build_wiki.py'
      - 'scripts/check_wiki_links.py'
      - 'scripts/deploy_wiki.py'
      - 'lib/verify/**'
      - 'examples/verify/**'
      - 'ROADMAP.md'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wiki-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build static wiki
        run: python3 scripts/build_wiki.py

      - name: Verify wiki artifacts
        run: |
          test -f build/wiki/index.html
          test -f build/wiki/wiki-nav.json
          test -f build/wiki/search-index.json
          test -f build/wiki/flow-compile.js
          test -f build/wiki/tutorials/exercises.json
          test -f build/wiki/llms.txt
          test -f build/wiki/vendor/marked.min.js
          grep -q 'wiki.js' build/wiki/index.html
          echo "Wiki artifacts OK ($(du -sh build/wiki | cut -f1))"

      - name: Check internal links
        run: python3 scripts/check_wiki_links.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flow-wiki
          path: build/wiki/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wiki

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
