name: Patch issue 528 array constructor lowering

on:
  push:
    paths:
      - '.github/workflows/patch-534.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/wasm32-allocation-smoke
      - name: Recognize parser-normalized array constructors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/flow/mlir_generator.py')
          source = path.read_text()
          old = """        # Handle array<T>(size) constructor specially
        if func_call.name.startswith('array<') and func_call.name.endswith('>'):
            # Extract element type from array<type>
            elem_type = func_call.name[6:-1]  # Remove 'array<' and '>'
"""
          new = """        # Handle array<T>(...) constructors specially. The parser normalizes
        # generic constructor names to array_T; keep the legacy spelling for
        # direct AST producers. Never steal a real declared array_* function.
        elem_type = None
        if func_call.name.startswith('array<') and func_call.name.endswith('>'):
            elem_type = func_call.name[6:-1]
        elif func_call.name.startswith('array_') and func_call.name not in self.symbol_table:
            elem_type = func_call.name[len('array_'):]

        if elem_type is not None:
"""
          if source.count(old) != 1:
              raise SystemExit(f'expected array constructor dispatch exactly once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/flow/mlir_generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/mlir_generator.py
          git commit -m "Recognize normalized MLIR array constructors"
          git push origin HEAD:feat/wasm32-allocation-smoke
