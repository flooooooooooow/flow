name: Patch issue 528 array constructor lowering

on:
  push:
    paths:
      - '.github/workflows/patch-534.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/wasm32-allocation-smoke
      - name: Recognize parser-normalized array constructors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/flow/mlir_generator.py')
          source = path.read_text()
          old = (
              "        # Handle array<T>(size) constructor specially\n"
              "        if func_call.name.startswith('array<') and func_call.name.endswith('>'):\n"
              "            # Extract element type from array<type>\n"
              "            elem_type = func_call.name[6:-1]  # Remove 'array<' and '>'\n"
          )
          new = (
              "        # Handle array<T>(...) constructors specially. The parser normalizes\n"
              "        # generic constructor names to array_T; keep the legacy spelling for\n"
              "        # direct AST producers. Never steal a real declared array_* function.\n"
              "        elem_type = None\n"
              "        if func_call.name.startswith('array<') and func_call.name.endswith('>'):\n"
              "            elem_type = func_call.name[6:-1]\n"
              "        elif func_call.name.startswith('array_') and func_call.name not in self.symbol_table:\n"
              "            elem_type = func_call.name[len('array_'):]\n"
              "\n"
              "        if elem_type is not None:\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected array constructor dispatch exactly once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/flow/mlir_generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/mlir_generator.py
          git commit -m "Recognize normalized MLIR array constructors"
          git push origin HEAD:feat/wasm32-allocation-smoke
