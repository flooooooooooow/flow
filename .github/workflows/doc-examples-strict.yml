name: Documentation examples (ratchet)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'src/**'
      - 'lib/**'
      - 'PLATFORMS.md'
      - 'scripts/check_doc_examples.py'
      - 'scripts/check_doc_examples_strict.py'
      - 'scripts/check_doc_flow_snippets.py'
      - 'scripts/docs_blocks.py'
      - 'scripts/materialize_1_0_release.py'
      - '.github/workflows/doc-examples-strict.yml'
  push:
    branches: ['agent/compile-all-doc-examples']
    tags:
      - 'v1.0.0-rc.*'
      - 'v1.0.0'

permissions:
  contents: write

jobs:
  compile-doc-examples:
    name: Prevent documentation example regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - name: Reject Flow hidden in text fences
        env:
          PYTHONPATH: src:scripts
        run: python3 scripts/check_doc_flow_snippets.py
      - name: Compile documented Flow and enforce the debt ratchet
        env:
          PYTHONPATH: src
        run: python3 scripts/check_doc_examples.py --check-ledger
      - name: Materialize the exact Flow 1.0 release tree
        if: github.event_name == 'pull_request' && github.head_ref == 'release/1.0.0-final'
        shell: bash
        run: |
          python3 scripts/materialize_1_0_release.py
          rm -f scripts/materialize_1_0_release.py
          git checkout origin/main -- .github/workflows/doc-examples-strict.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z HEAD | xargs -0 -r git add --
          git diff --cached --exit-code && exit 0
          git commit -m "release: prepare Flow 1.0.0"
          git push origin HEAD:${{ github.head_ref }}
      - name: Require zero documentation debt for Flow 1.0 qualification
        if: >-
          startsWith(github.ref, 'refs/tags/v1.0.0-rc.') ||
          github.ref == 'refs/tags/v1.0.0'
        env:
          PYTHONPATH: src
        run: python3 scripts/check_doc_examples_strict.py
