name: Documentation examples (ratchet)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'src/**'
      - 'lib/**'
      - 'scripts/check_doc_examples.sh'
      - 'tools/doc_examples/**'
      - 'tests/doc_examples/**'
      - 'compiler/**'
      - '.github/workflows/doc-examples-strict.yml'
  push:
    branches: ['agent/compile-all-doc-examples']
    tags:
      - 'v1.0.0-rc.*'
      - 'v1.0.0'

permissions:
  contents: read

jobs:
  compile-doc-examples:
    name: Prevent documentation example regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checker goldens
        run: tests/doc_examples/run.sh
      - name: Reject Flow hidden in text fences
        run: scripts/check_doc_examples.sh snippets
      - name: Compile documented Flow and enforce the debt ratchet
        run: scripts/check_doc_examples.sh --check-ledger
      - name: Require zero documentation debt for Flow 1.0 qualification
        if: >-
          startsWith(github.ref, 'refs/tags/v1.0.0-rc.') ||
          github.ref == 'refs/tags/v1.0.0'
        run: scripts/check_doc_examples.sh strict
