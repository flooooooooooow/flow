name: Documentation examples (ratchet)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'src/**'
      - 'lib/**'
      - 'scripts/check_doc_examples.py'
      - 'scripts/check_doc_examples_strict.py'
      - 'scripts/check_doc_flow_snippets.py'
      - 'scripts/docs_blocks.py'
      - '.github/workflows/doc-examples-strict.yml'
  push:
    branches: ['agent/compile-all-doc-examples']

permissions:
  contents: read

jobs:
  compile-doc-examples:
    name: Prevent documentation example regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Reject Flow hidden in text fences
        env:
          PYTHONPATH: src:scripts
        run: python3 scripts/check_doc_flow_snippets.py
      - name: Compile documented Flow and enforce the debt ratchet
        env:
          PYTHONPATH: src
        run: python3 scripts/check_doc_examples.py --check-ledger
