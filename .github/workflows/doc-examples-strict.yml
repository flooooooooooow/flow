name: Documentation examples (strict)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - 'src/**'
      - 'lib/**'
      - 'scripts/check_doc_examples.py'
      - 'scripts/check_doc_examples_strict.py'
      - 'scripts/check_doc_flow_snippets.py'
      - 'scripts/finalize_doc_snippets.py'
      - 'scripts/docs_blocks.py'
      - '.github/workflows/doc-examples-strict.yml'
  push:
    branches: ['agent/compile-all-doc-examples']

permissions:
  contents: write

jobs:
  compile-doc-examples:
    name: Compile every Flow documentation example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && 'agent/compile-all-doc-examples' || github.ref }}
      - uses: ./.github/actions/setup-python
      - name: Apply one-time documentation finalization
        if: github.event_name == 'push'
        run: |
          python3 scripts/finalize_doc_snippets.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize executable snippet classifications'
          git pull --rebase origin agent/compile-all-doc-examples
          git push origin HEAD:agent/compile-all-doc-examples
      - name: Reject Flow hidden in text fences
        env:
          PYTHONPATH: src:scripts
        run: python3 scripts/check_doc_flow_snippets.py
      - name: Compile all documented Flow code
        env:
          PYTHONPATH: src
        run: python3 scripts/check_doc_examples_strict.py
