name: Patch doc coverage mention

on:
  push:
    branches: ['agent/compile-all-doc-examples']
    paths:
      - '.github/workflows/patch-doc-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/compile-all-doc-examples
      - name: Document analyze CLI entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/language/dynamics-dsl.md')
          text = path.read_text()
          anchor = 'Working examples:\n'
          replacement = 'The command-line entry point for this analysis surface is `flow analyze`.\n\nWorking examples:\n'
          if anchor not in text:
              raise SystemExit('documentation anchor not found')
          if '`flow analyze`' not in text:
              text = text.replace(anchor, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit coverage fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/language/dynamics-dsl.md
          git commit -m 'docs: mention flow analyze in dynamics reference'
          git push origin HEAD:agent/compile-all-doc-examples
