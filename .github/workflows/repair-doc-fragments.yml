name: Repair handbook and README fragments

on:
  push:
    branches: ['agent/compile-all-doc-examples']
    paths:
      - '.github/workflows/repair-doc-fragments.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/compile-all-doc-examples
      - name: Repair fragments
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = '''### Types

```
Primitives:  i32, i64, f32, f64, bool, string, void
Pointers:    ptr<T>, ptr<void>
Arrays:      array<T, N>
Generics:    function identity<T>(x: T) -> T
```'''
          new = '''### Types

```flow-pseudocode
Primitives:  i32, i64, f32, f64, bool, string, void
Pointers:    ptr<T>, ptr<void>
Arrays:      array<T, N>
Generics:    function identity<T>(x: T) -> T
```'''
          if old in text:
              text = text.replace(old, new, 1)
          readme.write_text(text)

          path = Path('docs/AI_FLOW_HANDBOOK.md')
          text = path.read_text()
          replacements = [
              ('''```text
let mut position: f64 = 0.0
position = position + velocity * dt
```''', '''```flow
function advance(position: f64, velocity: f64, dt: f64) -> f64 {
    let mut next: f64 = position
    next = next + velocity * dt
    return next
}
```'''),
              ('''```text
let mut p: Pendulum = Pendulum_new()
Pendulum_step(&p, 0.001)
```''', '''The generated constructor/step API is exercised in complete programs such as `examples/evolution/pendulum_evolves.flow`; callers create the model inside a function and advance it with `Pendulum_step`.'''),
              ('''```text
when height reaches 0.0 {
    velocity becomes -restitution * velocity
    height becomes 0.0
}
```''', '''```flow
flow HandbookBall {
    state height: f64 = 2.0
    state velocity: f64 = 0.0
    param gravity: f64 = 9.81
    param restitution: f64 = 0.8

    height evolves as velocity
    velocity evolves as -gravity

    when height reaches 0.0 {
        velocity becomes -restitution * velocity
        height becomes 0.0
    }
}
```'''),
              ('''```text
handle Log with QuietLog {
    do_work()
}
```''', '''```flow
effect ScopedLog {
    info(msg: string) -> void,
}

capability ScopedQuietLog {
    effect ScopedLog,
    function info(msg: string) -> void { },
}

function scoped_work() -> void with ScopedLog {
    ScopedLog.info("work started")
}

function scoped_handler_demo() -> i32 {
    handle ScopedLog with ScopedQuietLog {
        scoped_work()
    }
    return 0
}
```'''),
              ('''```text
@max_iterations(1000)
while condition {
    step()
}
```''', '''```flow
function bounded_iteration(limit: i32) -> i32 {
    let mut i: i32 = 0
    @max_iterations(1000)
    while i < limit {
        i = i + 1
    }
    return i
}
```'''),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/AI_FLOW_HANDBOOK.md
          git commit -m 'docs: make handbook fragments self-contained'
          git pull --rebase origin agent/compile-all-doc-examples
          git push origin HEAD:agent/compile-all-doc-examples
