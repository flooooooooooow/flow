name: PR conflict probe (temporary)
on:
  push:
    branches:
      - automation/resolve-flow-pr-conflicts-20261106
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect actual merge conflicts against main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Flow conflict audit"
          git config user.email "flow-conflict-audit@users.noreply.github.com"
          mkdir -p conflict-probe
          git fetch origin main
          for pr in 1560 1568 1616 1620 1638 1674; do
            git fetch --no-tags origin "refs/pull/${pr}/head:refs/remotes/pr-${pr}"
            git switch -C "probe-${pr}" origin/main
            set +e
            git merge --no-commit --no-ff "refs/remotes/pr-${pr}" >"conflict-probe/pr-${pr}-merge.log" 2>&1
            outcome=$?
            set -e
            printf '%s\n' "PR #${pr} merge exit: ${outcome}" | tee "conflict-probe/pr-${pr}-status.txt"
            git diff --name-only --diff-filter=U | tee "conflict-probe/pr-${pr}-conflicts.txt"
            git status --short >"conflict-probe/pr-${pr}-files.txt"
            if [ "${outcome}" -ne 0 ]; then
              git merge --abort
            else
              git reset --hard origin/main
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-pr-conflict-probe
          path: conflict-probe/
          if-no-files-found: warn

  repair-remaining:
    if: github.repository == 'flooooooooooow/flow'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: [1560, 1568, 1616, 1620, 1638, 1674]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile merge and verify the compiler before pushing
        shell: bash
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          git config user.name "Flow PR integration"
          git config user.email "flow-pr-integration@users.noreply.github.com"
          case "$PR_NUMBER" in
            1560) target="fix/mlir-extern-type" ;;
            1568) target="fix/mlir-complex" ;;
            1616) target="issue-562-module-statics-8220065690770900155" ;;
            1620) target="issue-562-module-statics-8220065690770900155-11774196869383385865" ;;
            1638) target="reapply-mlir-parity-1577-10551875307817394677" ;;
            1674) target="jules-1562-vector-lit-309291271695338674" ;;
            *) echo "Unknown PR" >&2; exit 1 ;;
          esac
          git fetch origin main
          git fetch origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr-${PR_NUMBER}"
          git switch -C "repair-${PR_NUMBER}" "refs/remotes/pr-${PR_NUMBER}"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            mapfile -t conflicted_files < <(git diff --name-only --diff-filter=U)
            for file in "${conflicted_files[@]}"; do
              case "$file" in
                compiler/bootstrap/flowc_stage_a|compiler/bootstrap/flowc_stage_a.c|compiler/fixtures/mlir/corpus.txt|tests/mlir_commands/expected/test_mlir.out|runtime/flow_fctx_arm64.S|runtime/flow_fctx_x86_64.S)
                  git checkout --theirs -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "Unexpected real-source conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done
          fi
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved merge" >&2
            exit 1
          fi
          git add -u
          git commit -m "merge: bring PR #${PR_NUMBER} onto current main"
          env -u FLOWC_IN -u FLOWC_OUT "$(./flow tool compiler/scripts/flowc_host.flow)"
          ./compiler/scripts/bootstrap_from_c.sh --regen
          ./compiler/scripts/bootstrap_from_c.sh --verify
          ./flow tool compiler/scripts/self_host_full.flow
          ./flow tool compiler/scripts/roundtrip.flow
          git add -- compiler/bootstrap/flowc_stage_a.c compiler/bootstrap/flowc_stage_a
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate bootstrap after PR #${PR_NUMBER} merge"
          fi
          git status --short
          git push origin "HEAD:refs/heads/${target}"
