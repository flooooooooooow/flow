name: Patch range sum parser

on:
  push:
    paths:
      - '.github/workflows/patch-range-sum-parser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sum-range-closed-form
      - name: Add RangeExpression and sum(range) parsing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/flow/parser.py')
          source = path.read_text()

          old_dataclass = (
              '@dataclass\n'
              'class ForStatement:\n'
              '    variable: str\n'
              '    range_start: "Expression"\n'
              '    range_end: "Expression"\n'
              '    step: Optional["Expression"]\n'
              '    body: Block\n'
              '    is_parallel: bool\n'
              '\n'
              '\n'
              '@dataclass\n'
              'class ReturnStatement:\n'
          )
          new_dataclass = (
              '@dataclass\n'
              'class ForStatement:\n'
              '    variable: str\n'
              '    range_start: "Expression"\n'
              '    range_end: "Expression"\n'
              '    step: Optional["Expression"]\n'
              '    body: Block\n'
              '    is_parallel: bool\n'
              '\n'
              '\n'
              '@dataclass\n'
              'class RangeExpression:\n'
              '    """Exclusive-end arithmetic range used by range-aware builtins.\n'
              '\n'
              '    Kept separate from ForStatement so range algebra can become a\n'
              '    first-class expression without changing loop representation.\n'
              '    """\n'
              '\n'
              '    start: "Expression"\n'
              '    end: "Expression"\n'
              '    step: "Expression"\n'
              '\n'
              '\n'
              '@dataclass\n'
              'class ReturnStatement:\n'
          )
          if source.count(old_dataclass) != 1:
              raise SystemExit(f'expected ForStatement insertion target once, found {source.count(old_dataclass)}')
          source = source.replace(old_dataclass, new_dataclass, 1)

          old_call = (
              '    def parse_function_call(self, name: str) -> FunctionCall:\n'
              '        self.expect(TokenType.LPAREN)\n'
              '        arguments = []\n'
              '\n'
              '        if self.current_token.type != TokenType.RPAREN:\n'
              '            arguments.append(self.parse_expression_without_assign())\n'
              '            while self.current_token.type == TokenType.COMMA:\n'
              '                self.advance()\n'
              '                arguments.append(self.parse_expression_without_assign())\n'
              '\n'
              '        self.expect(TokenType.RPAREN)\n'
              '        return FunctionCall(name, arguments)\n'
          )
          new_call = (
              '    def parse_function_call(self, name: str) -> Expression:\n'
              '        self.expect(TokenType.LPAREN)\n'
              '        arguments = []\n'
              '\n'
              '        if self.current_token.type != TokenType.RPAREN:\n'
              '            first = self.parse_expression_without_assign()\n'
              '            if name == "sum" and self.current_token.type in (TokenType.DOTDOT, TokenType.TO):\n'
              '                self.advance()\n'
              '                end = self.parse_expression_without_assign()\n'
              '                step: Expression = Literal("1", Type("i32"))\n'
              '                if (\n'
              '                    self.current_token.type == TokenType.STEP\n'
              '                    or (\n'
              '                        self.current_token.type == TokenType.IDENTIFIER\n'
              '                        and self.current_token.value == "step"\n'
              '                    )\n'
              '                ):\n'
              '                    self.advance()\n'
              '                    step = self.parse_expression_without_assign()\n'
              '                first = RangeExpression(first, end, step)\n'
              '            arguments.append(first)\n'
              '            while self.current_token.type == TokenType.COMMA:\n'
              '                self.advance()\n'
              '                arguments.append(self.parse_expression_without_assign())\n'
              '\n'
              '        self.expect(TokenType.RPAREN)\n'
              '        if name == "sum" and len(arguments) == 1 and isinstance(arguments[0], RangeExpression):\n'
              '            from .range_sums import lower_range_sum\n'
              '\n'
              '            return lower_range_sum(arguments[0])\n'
              '        return FunctionCall(name, arguments)\n'
          )
          if source.count(old_call) != 1:
              raise SystemExit(f'expected parse_function_call target once, found {source.count(old_call)}')
          source = source.replace(old_call, new_call, 1)

          path.write_text(source)
          PY
          git diff --check
          git diff -- src/flow/parser.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/parser.py
          git commit -m "Parse and lower sum over arithmetic ranges"
          git push origin HEAD:feat/sum-range-closed-form
