# ACTIONS-INTENDED: public repository; its CI runs on GitHub Actions.
name: Changelog

on:
  push:
    branches: [main, master]
    paths:
      - 'CHANGELOG.md'
      - 'docs/project/CHANGELOG.md'
      - 'VERSION'
      - 'tools/flow_cli/**'
      - 'scripts/tools/changelog_check/**'
      - 'scripts/tools/lib/**'
      - 'scripts/tools/build_tool.sh'
      - '.github/workflows/changelog.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'CHANGELOG.md'
      - 'docs/project/CHANGELOG.md'
      - 'VERSION'
      - 'tools/flow_cli/**'
      - 'scripts/tools/changelog_check/**'
      - 'scripts/tools/lib/**'
      - 'scripts/tools/build_tool.sh'
      - '.github/workflows/changelog.yml'

permissions:
  contents: read

jobs:
  version-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require current version in canonical changelog
        run: ./flow tool changelog_check
