name: Normalize documentation Flow fences

on:
  push:
    branches: ['agent/compile-all-doc-examples']
    paths:
      - 'scripts/normalize_doc_flow_fences.py'
      - '.github/workflows/normalize-doc-flow-fences.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/compile-all-doc-examples
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
      - name: Normalize fence intent
        env:
          PYTHONPATH: src:scripts
        run: python3 scripts/normalize_doc_flow_fences.py
      - name: Commit normalized documentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: restore executable and explicit non-current snippets'
          git pull --rebase origin agent/compile-all-doc-examples
          git push origin HEAD:agent/compile-all-doc-examples
