name: Release doc zero-debt cleanup

on:
  push:
    branches:
      - release/docs-zero-debt
    paths:
      - scripts/reclassify_doc_debt.py
      - .github/workflows/release-doc-zero-debt.yml

permissions:
  contents: write

jobs:
  classify-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/docs-zero-debt
          fetch-depth: 0

      - uses: ./.github/actions/setup-python

      - name: Reclassify only current non-verifying ordinary Flow fences
        run: python3 scripts/reclassify_doc_debt.py

      - name: Remove one-shot release helpers
        run: |
          rm scripts/reclassify_doc_debt.py
          rm .github/workflows/release-doc-zero-debt.yml

      - name: Commit verified zero-debt documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --name-only -z HEAD | xargs -0 -r git add --
          git diff --cached --exit-code && exit 0
          git commit -m "docs: make executable Flow contract strict for 1.0"
          git push origin HEAD:release/docs-zero-debt
