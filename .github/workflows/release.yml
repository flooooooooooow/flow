# ACTIONS-INTENDED: public repository; qualifies and publishes releases.
# RC tags (*-rc*) and workflow_dispatch qualify_only skip the publish job.
# Dry-run qualification without contents:write is release-qualify.yml.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build a release for (e.g. v1.0.0)'
        required: true
      qualify_only:
        description: 'Qualify without publishing a GitHub Release or Homebrew update'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  qualify:
    name: Qualify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-python

      - name: Verify tag version matches the source tree
        shell: bash
        run: |
          ./flow tool sync_version --check
          actual="$(head -n 1 VERSION)"
          if [ "$actual" != "${FLOW_RELEASE_TAG#v}" ]; then
            echo "tag $FLOW_RELEASE_TAG does not match VERSION ($actual)" >&2
            exit 1
          fi
          echo "version contract: $actual"
        env:
          FLOW_RELEASE_TAG: ${{ steps.tag.outputs.name }}

      - name: Require complete 1.x stability classification
        if: startsWith(steps.tag.outputs.name, 'v1.')
        run: ./flow tool stability_manifest --require-complete

      - name: Require zero ordinary documentation debt for 1.x
        if: startsWith(steps.tag.outputs.name, 'v1.')
        run: ./flow tool doc_examples strict

      - name: Run permanent Stable conformance corpus
        run: ./flow tool tests/conformance/run.flow

      - name: Fuzz release compiler front end
        if: startsWith(steps.tag.outputs.name, 'v1.')
        env:
          FLOW_FUZZ_SECONDS: '60'
        run: ./flow tool tests/fuzz/run.flow --seconds "$FLOW_FUZZ_SECONDS" --seed 1000

      - name: Strict Flow corpus
        run: |
          chmod +x ./flow compiler/scripts/*.sh
          ./flow test --tier2 --strict

      - name: Build self-hosted flowc from checked-in bootstrap C
        run: ./compiler/scripts/bootstrap_from_c.sh

      - name: Audit self-host compiler sources
        run: ./flow tool compiler/scripts/selfcompile_audit.flow

      - name: Compile and execute Stable program with flowc
        env:
          FLOW_HOST: flowc
        run: |
          ./flow compile examples/basics/fibonacci.flow
          set +e
          ./build/fibonacci
          ec=$?
          set -e
          test "$ec" -eq 55

      - name: Build distributable flowc archive
        env:
          FLOWC_VERSION: ${{ steps.tag.outputs.name }}
        run: ./flow tool compiler/scripts/package_flowc.flow

      - name: Unpack release compiler archive
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/flow-release-package"
          mkdir -p "$RUNNER_TEMP/flow-release-package"
          archive="$(cat dist/flowc-latest.txt)"
          tar -xzf "$archive" -C "$RUNNER_TEMP/flow-release-package"
          package_root="$(find "$RUNNER_TEMP/flow-release-package" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$package_root"
          echo "FLOWC_PACKAGE_ROOT=$package_root" >> "$GITHUB_ENV"

      - name: Rebuild packaged compiler
        shell: bash
        run: |
          cd "$FLOWC_PACKAGE_ROOT"
          ./build.sh
          test -x bin/flowc

      - name: Compile, build and execute packaged sample
        shell: bash
        run: |
          cd "$FLOWC_PACKAGE_ROOT"
          ./bin/flowc examples/stage_a_sum.flow sum.c
          test -s sum.c
          cc -O0 -o sum sum.c
          set +e
          ./sum
          ec=$?
          set -e
          test "$ec" -eq 45

  release:
    name: Publish qualified release
    needs: qualify
    if: >-
      ${{ !inputs.qualify_only &&
          !contains(github.ref_name, '-rc') &&
          !contains(inputs.tag, '-rc') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Create source archives
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          git archive --format=tar.gz --prefix="flow-${TAG#v}/" -o "flow-${TAG}.tar.gz" "$TAG"
          git archive --format=zip --prefix="flow-${TAG#v}/" -o "flow-${TAG}.zip" "$TAG"
          shasum -a 256 "flow-${TAG}.tar.gz" "flow-${TAG}.zip" | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        id: release
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Flow ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            flow-*.tar.gz
            flow-*.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Sync Homebrew formula to the published tarball
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          SHA="$(sha256sum "flow-${TAG}.tar.gz" | awk '{print $1}')"
          git fetch origin main
          git switch -C release-homebrew origin/main
          ./flow tool sync_version --homebrew --sha256 "$SHA"
          if git diff --quiet -- packaging/homebrew/Formula/flow.rb; then
            echo "Homebrew formula already matches $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- packaging/homebrew/Formula/flow.rb
          git commit -m "packaging: point Homebrew at ${TAG}"
          git push origin HEAD:main

      - name: Compute release summary
        id: summary
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PREV="$(git describe --tags --abbrev=0 "$TAG"~1 2>/dev/null || echo '')"
          RANGE="${PREV:+$PREV..}$TAG"
          if [[ -z "$PREV" ]]; then RANGE="$TAG"; fi
          COUNT="$(git rev-list --count ${RANGE:-} 2>/dev/null | tr -d ' ' || echo '?')"
          AUTHORS="$(git shortlog -sne "${RANGE:-}" 2>/dev/null | wc -l | tr -d ' ' || echo '?')"
          {
            echo "commits=$COUNT"
            echo "authors=$AUTHORS"
            echo "prev=$PREV"
          } >> "$GITHUB_OUTPUT"

      - name: Post release announcement to Discord #announcements
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          botname: Flow Release Bot
          avatar_url: ${{ github.server_url }}/${{ github.repository_owner }}.png
          color: '5763719'
          title: Flow ${{ steps.tag.outputs.name }} is out
          url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}
          description: >-
            ${{ steps.summary.outputs.commits }} commits since
            ${{ steps.summary.outputs.prev }}, from
            ${{ steps.summary.outputs.authors }} contributors. Read the full
            changelog in [#changelog](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}).
          author_name: Flow Releases
          author_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
          thumbnail: ${{ github.server_url }}/${{ github.repository_owner }}.png
          footer_text: Flow Releases · ${{ steps.tag.outputs.name }}
          footer_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png

      - name: Post changelog to Discord #changelog
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.body' > /tmp/flow_changelog.md || true
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          body = open('/tmp/flow_changelog.md').read().strip() or 'Auto-generated changelog.'
          body = body.lstrip('#').strip()
          if len(body) > 4000:
              body = body[:4000].rsplit('\n', 1)[0] + '\n…'
          owner_avatar = f"https://github.com/{os.environ['REPO'].split('/')[0]}.png"
          embed = {
              'title': f"Changelog {os.environ['TAG']}",
              'color': 5763719,
              'description': body,
              'author': {'name': 'Flow', 'icon_url': owner_avatar},
              'footer': {'text': f"Flow {os.environ['TAG']} · generated from release notes"},
              'timestamp': datetime.now(timezone.utc).isoformat(),
          }
          payload = {
              'username': 'Flow Changelog',
              'avatar_url': owner_avatar,
              'embeds': [embed],
          }
          webhook = os.environ['DISCORD_CHANGELOG_WEBHOOK']
          try:
              req = urllib.request.Request(webhook, data=json.dumps(payload).encode(),
                                           headers={'Content-Type': 'application/json'})
              urllib.request.urlopen(req)
          except Exception as e:
              print(f'changelog webhook failed (non-fatal): {e}', file=sys.stderr)
          PY
