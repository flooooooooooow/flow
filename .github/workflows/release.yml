name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build a release for (e.g. v0.8.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create source archives
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          git archive --format=tar.gz --prefix="flow-${TAG#v}/" -o "flow-${TAG}.tar.gz" "$TAG"
          git archive --format=zip --prefix="flow-${TAG#v}/" -o "flow-${TAG}.zip" "$TAG"
          shasum -a 256 "flow-${TAG}.tar.gz" "flow-${TAG}.zip" | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        id: release
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Flow ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            flow-*.tar.gz
            flow-*.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Compute release summary
        id: summary
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PREV="$(git describe --tags --abbrev=0 "$TAG"~1 2>/dev/null || echo '')"
          RANGE="${PREV:+$PREV..}$TAG"
          if [[ -z "$PREV" ]]; then RANGE="$TAG"; fi
          COUNT="$(git rev-list --count ${RANGE:-} 2>/dev/null | tr -d ' ' || echo '?')"
          AUTHORS="$(git shortlog -sne "${RANGE:-}" 2>/dev/null | wc -l | tr -d ' ' || echo '?')"
          {
            echo "commits=$COUNT"
            echo "authors=$AUTHORS"
            echo "prev=$PREV"
          } >> "$GITHUB_OUTPUT"

      - name: Post release announcement to Discord #announcements
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          botname: Flow Release Bot
          avatar_url: ${{ github.server_url }}/${{ github.repository_owner }}.png
          color: '5763719'
          title: Flow ${{ steps.tag.outputs.name }} is out
          url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}
          description: >-
            ${{ steps.summary.outputs.commits }} commits since
            ${{ steps.summary.outputs.prev }}, from
            ${{ steps.summary.outputs.authors }} contributors. Read the full
            changelog in [#changelog](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.name }}).
          author_name: Flow Releases
          author_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png
          thumbnail: ${{ github.server_url }}/${{ github.repository_owner }}.png
          footer_text: Flow Releases · ${{ steps.tag.outputs.name }}
          footer_icon: ${{ github.server_url }}/${{ github.repository_owner }}.png

      - name: Post changelog to Discord #changelog
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.body' > /tmp/flow_changelog.md || true
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          from datetime import datetime, timezone
          body = open("/tmp/flow_changelog.md").read().strip() or "Auto-generated changelog."
          body = body.lstrip("#").strip()
          # Strip HTML comments and tags (Cursor/Devin agent footers, etc.)
          body = re.sub(r'<!--.*?-->', '', body, flags=re.DOTALL)
          body = re.sub(r'<[^>]+>', '', body)
          body = re.sub(r'&(?:nbsp|amp|lt|gt|quot|#\d+);', '', body)
          body = re.sub(r'\n{3,}', '\n\n', body).strip()
          if len(body) > 4000:
              body = body[:4000].rsplit("\n", 1)[0] + "\n…"
          owner_avatar = f"https://github.com/{os.environ['REPO'].split('/')[0]}.png"
          embed = {
              "title": f"Changelog {os.environ['TAG']}",
              "color": 5763719,
              "description": body,
              "author": {"name": "Flow", "icon_url": owner_avatar},
              "footer": {"text": f"Flow {os.environ['TAG']} · generated from release notes"},
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }
          payload = {
              "username": "Flow Changelog",
              "avatar_url": owner_avatar,
              "embeds": [embed],
          }
          webhook = os.environ["DISCORD_CHANGELOG_WEBHOOK"]
          try:
              req = urllib.request.Request(webhook, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
          except Exception as e:
              print(f"changelog webhook failed (non-fatal): {e}", file=sys.stderr)
          PY
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
