name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build a release for (e.g. v0.8.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create source archives
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          git archive --format=tar.gz --prefix="flow-${TAG#v}/" -o "flow-${TAG}.tar.gz" "$TAG"
          git archive --format=zip --prefix="flow-${TAG#v}/" -o "flow-${TAG}.zip" "$TAG"
          shasum -a 256 "flow-${TAG}.tar.gz" "flow-${TAG}.zip" | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Flow ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            flow-*.tar.gz
            flow-*.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true
