name: Patch issue 521

on:
  push:
    paths:
      - '.github/workflows/patch-521.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/time-header-extern-prototypes
      - name: Let time.h own localtime_r and strftime prototypes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/flow/c_generator.py')
          source = path.read_text()
          old = "                           'usleep', 'sleep', 'gettimeofday', 'time', 'system',\n"
          new = "                           'usleep', 'sleep', 'gettimeofday', 'time', 'localtime_r', 'strftime', 'system',\n"
          if source.count(old) != 1:
              raise SystemExit(f'expected time.h stdlib entry exactly once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/flow/c_generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/flow/c_generator.py
          git commit -m "Avoid conflicting time.h extern prototypes"
          git push origin HEAD:fix/time-header-extern-prototypes
