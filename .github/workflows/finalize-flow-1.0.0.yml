name: Finalize Flow 1.0.0

on:
  push:
    branches: [main]
    paths:
      - 'src/flow/version.py'
      - '.github/workflows/finalize-flow-1.0.0.yml'

permissions:
  contents: write
  actions: write
  pull-requests: read

jobs:
  finalize:
    if: github.repository == 'flooooooooooow/flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify this is the intended 1.0 tree
        shell: bash
        run: |
          python3 scripts/sync_version.py --check
          test "$(PYTHONPATH=src python3 - <<'PY'
          from flow.version import __version__
          print(__version__)
          PY
          )" = "1.0.0"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; refusing to move it"
            exit 1
          fi
          echo "FLOW_1_0_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create immutable Flow 1.0.0 tag
        shell: bash
        run: |
          git tag -a v1.0.0 "$FLOW_1_0_SHA" -m "Flow 1.0.0"
          git push origin refs/tags/v1.0.0

      - name: Dispatch hardened release qualification explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f tag=v1.0.0

      - name: Prune exact merged PR branch heads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deleted=0
          while IFS=$'\t' read -r branch merged_sha; do
            case "$branch" in
              main|master|gh-pages|"") continue ;;
            esac
            current_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            if [[ -n "$current_sha" && "$current_sha" == "$merged_sha" ]]; then
              echo "pruning merged branch: $branch"
              if git push origin --delete "$branch"; then
                deleted=$((deleted + 1))
              fi
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null) | [.head.ref, .head.sha] | @tsv'
          )
          echo "pruned $deleted exact merged branch head(s)"
