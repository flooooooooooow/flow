name: sum(range) focused smoke

on:
  push:
    paths:
      - '.github/workflows/smoke-range-sum.yml'

jobs:
  range-sum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python
      - name: Run sum(range) regression
        env:
          PYTHONPATH: src
        run: pytest -q tests/integration/test_range_sum.py
