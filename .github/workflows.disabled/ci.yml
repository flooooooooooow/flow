name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # Install any requirements if they exist
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Install clang (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
    
    - name: Verify setup
      run: |
        python --version
        clang --version
        echo "PYTHONPATH=src" >> $GITHUB_ENV
    
    - name: Run Tier 1 tests (transpile only)
      run: |
        chmod +x ./flow
        ./flow test --tier 1
    
    - name: Run Tier 2 tests (transpile + compile)
      run: |
        ./flow test --tier 2
    
    - name: Run example programs
      run: |
        ./flow run examples/basics/hello_world.flow || true
        ./flow compile examples/basics/variables.flow || true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
        pip install pytest
    
    - name: Run benchmarks
      run: |
        chmod +x ./flow
        # Compile and run a few benchmarks
        ./flow compile benchmarks/suite/flow/01_fibonacci.flow && ./build/01_fibonacci || true
        ./flow compile benchmarks/suite/flow/05_spmv.flow && ./build/05_spmv || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Check Python syntax
      run: |
        python -m py_compile src/flow/parser.py
        python -m py_compile src/flow/c_generator.py
        python -m py_compile src/flow/type_checker.py || true
