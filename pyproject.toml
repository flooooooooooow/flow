[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-lang"
version = "0.1.0"
description = "FLOW language compiler/transpiler"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
flowc = "flow.transpiler:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
