site_name: FLOW Programming Language Documentation
site_description: Comprehensive documentation for the FLOW programming language
repo_url: https://github.com/yourusername/transpile
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Getting Started:
    - getting-started.md
  - Tutorials:
    - tutorials/beginner.md
    - tutorials/intermediate.md
    - tutorials/advanced.md
    - tutorials/graphics.md
    - tutorials/performance.md
    - tutorials/projects.md
  - Language Reference:
    - language/overview.md
    - language/syntax.md
    - language/types.md
    - language/variables.md
    - language/functions.md
    - language/control-flow.md
    - language/structs.md
    - language/arrays.md
    - language/pattern-matching.md
    - language/effects.md
    - language/modules.md
    - language/graphics.md
    - language/memory.md
    - language/performance.md
    - language/error-handling.md
    - language/metaprogramming.md
    - language/ffi.md
    - language/language_design.md
  - Standard Library:
    - library/overview.md
    - library/core.md
    - library/math.md
    - library/strings.md
    - library/arrays.md
    - library/io.md
    - library/memory.md
  - Examples:
    - examples/README.md
    - examples/modules/README.md
    - Interactive Demo: examples/interactive_demo.html
    - Metal GPU Examples: examples/metal_examples.md
    - WebAssembly Examples: examples/web_examples.md
  - Project Documentation:
    - Project Structure: project/PROJECT_STRUCTURE.md
    - Changelog: project/CHANGELOG.md
    - Contributing: project/CONTRIBUTING.md
  - Research:
    - Turing Proof: research/turing_proof.md
    - Research Paper: research/FLOW_RESEARCH_PAPER.md
  - Development:
    - DEVELOPMENT.md
