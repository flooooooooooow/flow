site_name: FLOW Programming Language Documentation
site_description: Comprehensive documentation for the FLOW programming language
repo_url: https://github.com/yourusername/transpile
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Playground: playground/index.html
  - Getting Started: getting-started.md
  - Comparison: comparison.md
  - Tutorials:
    - Beginner: tutorials/beginner.md
    - Intermediate: tutorials/intermediate.md
    - Advanced: tutorials/advanced.md
  - Language:
    - Overview: language/overview.md
    - Syntax: language/syntax.md
    - Types: language/types.md
    - Variables: language/variables.md
    - Functions: language/functions.md
    - Graphics: language/graphics.md
    - Design: language/language_design.md
  - Standard Library:
    - API Reference: library/stdlib-reference.md
    - Core: library/core.md
    - Autodiff: library/autodiff.md
    - Memory: library/memory.md
  - Specification:
    - Language Spec: LANGUAGE_SPEC.md
  - Examples:
    - Overview: examples/README.md
    - Basic: examples/basic/README.md
    - Algorithms: examples/algorithms/README.md
    - Data Structures: examples/data-structures/README.md
    - Effects: examples/effects/README.md
    - GPU: examples/gpu/README.md
    - Graphics: examples/graphics/README.md
    - Performance: examples/performance/README.md
    - Modules: examples/modules/README.md
  - Project:
    - Structure: project/PROJECT_STRUCTURE.md
    - Changelog: project/CHANGELOG.md
    - Contributing: project/CONTRIBUTING.md
  - Research:
    - Turing Proof: research/turing_proof.md
    - Research Paper: research/FLOW_RESEARCH_PAPER.md
  - Development: DEVELOPMENT.md
