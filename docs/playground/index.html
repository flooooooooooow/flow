<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --error: #f85149;
            --warning: #d29922;
            --purple: #a371f7;
            --pink: #db61a2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .logo-badge {
            background: var(--bg-tertiary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #000;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .btn-error {
            background: var(--error);
            border-color: var(--error);
            color: #fff;
        }

        .btn-error:hover {
            opacity: 0.9;
        }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        select {
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 0;
        }

        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-right: 1px solid var(--border);
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: var(--bg-secondary);
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .panel-header .status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.success { background: var(--success); }
        .status-dot.error { background: var(--error); }
        .status-dot.running { background: var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .panel-content {
            flex: 1;
            overflow: auto;
            min-height: 0;
        }

        /* Code Editor */
        #editor {
            width: 100%;
            height: 100%;
            padding: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            border: none;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        #editor::placeholder {
            color: var(--text-muted);
        }

        /* Output */
        .output-tabs {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
        }

        .output-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .output-tab:hover {
            color: var(--text-primary);
        }

        .output-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .output-content {
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output-content.hidden {
            display: none;
        }

        .output-content.error {
            color: var(--error);
        }

        .output-content.success {
            color: var(--success);
        }

        /* Syntax Highlighting (basic) */
        .keyword { color: var(--pink); }
        .type { color: var(--accent); }
        .string { color: var(--success); }
        .number { color: var(--warning); }
        .comment { color: var(--text-muted); font-style: italic; }
        .function { color: var(--purple); }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .keyboard-shortcuts {
            display: flex;
            gap: 1rem;
        }

        kbd {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.7rem;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Share Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
        }

        .modal h3 {
            margin-bottom: 1rem;
        }

        .modal input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <header>
        <a href="../" class="logo">
            <div class="logo-icon">F</div>
            <span class="logo-text">FLOW Playground</span>
            <span class="logo-badge">v0.3.0</span>
        </a>
        <div class="header-actions">
            <button class="btn" onclick="shareCode()" title="Share code">

    <main>
        <div class="toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Example:</span>
                <select id="examples" onchange="loadExample()">
                    <option value="hello">Hello World</option>
                    <option value="fibonacci">Fibonacci</option>
                    <option value="struct">Structs</option>
                    <option value="generics">Generics</option>
                    <option value="effects">Effects</option>
                    <option value="pattern">Pattern Matching</option>
                    <option value="autodiff">Autodiff</option>
                    <option value="gpu">GPU Kernel</option>
                    <option value="neural">Neural Network</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.8rem; color: var(--text-secondary);">
                    <input type="checkbox" id="autoRun" style="cursor: pointer;">

        <div class="editor-container">
            <div class="panel">
                <div class="panel-header">

                        <span id="editorStatusText">Ready</span>

                <div class="panel-content">
                    <div id="output" class="output-content">Click "Run" to execute your code.</div>
                    <div id="variables" class="output-content hidden">

                                    <th style="padding: 0.5rem; font-weight: 600;">Type</th>

    <script src="../flow-compile.js"></script>
    <script>
        // Example programs
        const examples = {
            hello: `// Hello World in FLOW
function main() -> i32 {
    print("Hello, World!")
    print("Welcome to FLOW Playground!")
    return 0
}`,

            fibonacci: `// Fibonacci sequence
function fibonacci(n: i32) -> i32 {
    if n <= 1 {
        return n
    }
    return fibonacci(n - 1) + fibonacci(n - 2)
}

function main() -> i32 {
    print("Fibonacci sequence:")
    for i in 0..10 {
        let fib = fibonacci(i)
        printf("fib(%d) = %d\\n", i, fib)
    }
    return 0
}`,

            struct: `// Structs and methods
struct Point {
    x: f32,
    y: f32
}

struct Rectangle {
    origin: Point,
    width: f32,
    height: f32
}

function point_distance(p1: Point, p2: Point) -> f32 {
    let dx = p2.x - p1.x
    let dy = p2.y - p1.y
    return sqrt(dx * dx + dy * dy)
}

function rect_area(r: Rectangle) -> f32 {
    return r.width * r.height
}

function main() -> i32 {
    let p1 = Point { x: 0.0, y: 0.0 }
    let p2 = Point { x: 3.0, y: 4.0 }
    
    printf("Distance: %f\\n", point_distance(p1, p2))
    
    let rect = Rectangle {
        origin: p1,
        width: 10.0,
        height: 5.0
    }
    
    printf("Area: %f\\n", rect_area(rect))
    return 0
}`,

            generics: `// Generic programming
struct Box<T> {
    value: T
}

struct Pair<A, B> {
    first: A,
    second: B
}

function identity<T>(x: T) -> T {
    return x
}

function swap<A, B>(p: Pair<A, B>) -> Pair<B, A> {
    return Pair<B, A> {
        first: p.second,
        second: p.first
    }
}

function main() -> i32 {
    // Generic box
    let int_box = Box<i32> { value: 42 }
    let float_box = Box<f32> { value: 3.14 }
    
    printf("Int box: %d\\n", int_box.value)
    printf("Float box: %f\\n", float_box.value)
    
    // Generic pair
    let pair = Pair<i32, f32> { first: 1, second: 2.5 }
    let swapped = swap(pair)
    
    printf("Swapped: (%f, %d)\\n", swapped.first, swapped.second)
    
    // Identity function
    let x = identity<i32>(100)
    printf("Identity: %d\\n", x)
    
    return 0
}`,

            effects: `// Algebraic Effects
effect Console {
    function print(msg: string) -> void
    function read() -> string
}

effect State<T> {
    function get() -> T
    function set(val: T) -> void
}

function counter() -> i32 with State<i32> {
    let current = State.get()
    State.set(current + 1)
    return current
}

function greet(name: string) -> void with Console {
    Console.print("Hello, ")
    Console.print(name)
    Console.print("!\\n")
}

capability StdioConsole for Console {
    function print(msg: string) -> void {
        printf("%s", msg)
    }
    
    function read() -> string {
        return "User"
    }
}

function main() -> i32 {
    handle greet("World") with StdioConsole
    return 0
}`,

            pattern: `// Pattern Matching
enum Option<T> {
    Some(T),
    None
}

enum Result<T, E> {
    Ok(T),
    Err(E)
}

function divide(a: f64, b: f64) -> Result<f64, string> {
    if b == 0.0 {
        return Err("division by zero")
    }
    return Ok(a / b)
}

function main() -> i32 {
    let result = divide(10.0, 2.0)
    
    match result {
        Ok(value) => {
            printf("Result: %f\\n", value)
        }
        Err(msg) => {
            printf("Error: %s\\n", msg)
        }
    }
    
    // Integer matching
    let x = 42
    match x {
        0 => print("zero")
        1 => print("one")
        42 => print("the answer!")
        _ => print("something else")
    }
    
    return 0
}`,

            autodiff: `// Automatic Differentiation
import "stdlib/autodiff.flow"

// Forward mode autodiff using dual numbers
function gradient_example() -> void {
    // Create dual number: x = 3.0, dx/dx = 1.0
    let x = dual(3.0, 1.0)
    
    // f(x) = x² 
    let f = dual_mul(x, x)
    
    printf("f(3) = %f\\n", f.val)    // 9.0
    printf("f'(3) = %f\\n", f.grad)  // 6.0 (derivative of x² is 2x)
    
    // g(x) = sin(x)
    let g = dual_sin(x)
    printf("sin(3) = %f\\n", g.val)
    printf("cos(3) = %f\\n", g.grad)  // derivative of sin is cos
    
    // h(x) = sigmoid(x)
    let h = dual_sigmoid(x)
    printf("sigmoid(3) = %f\\n", h.val)
    printf("sigmoid'(3) = %f\\n", h.grad)
}

function main() -> i32 {
    gradient_example()
    return 0
}`,

            gpu: `// GPU Kernel (generates Metal shader)
@gpu
function vector_add(
    a: array<f32>,
    b: array<f32>,
    out: array<f32>,
    n: i32
) {
    let i = gpu_thread_id()
    if i < n {
        out[i] = a[i] + b[i]
    }
}

@gpu
function matrix_multiply(
    A: array<f32>,
    B: array<f32>,
    C: array<f32>,
    M: i32,
    N: i32,
    K: i32
) {
    let idx = gpu_thread_id()
    let row = idx / N

        // Debugging state
        let isDebugging = false;
        let debugSession = null;

        class FlowDebugger {
            constructor(code) {
                this.lines = code.split('\n');
                this.pc = -1;
                this.variables = {};
                this.callStack = [];
                this.output = '';
                this.isFinished = false;

                // Find main
                for (let i = 0; i < this.lines.length; i++) {
                    if (this.lines[i].includes('function main')) {
                        this.pc = i;
                        break;
                    }
                }
                if (this.pc === -1) this.pc = 0;
            }

            step() {
                if (this.pc >= this.lines.length) {
                    this.isFinished = true;
                    return;
                }

                const line = this.lines[this.pc].trim();

                // Skip empty lines and comments
                if (!line || line.startsWith('//') || line.startsWith('function') || line === '}') {
                    this.pc++;
                    if (this.pc >= this.lines.length) {
                        this.isFinished = true;
                    } else {
                        return this.step();
                    }
                    return;
                }

                // Simple "Execution"
                // 1. Assignments: let x = 5
                let match = line.match(/let\s+(?:mut\s+)?(\w+)(?:\s*:\s*([^=]+))?\s*=\s*(.+)/);
                if (match) {
                    const name = match[1];
                    const type = match[2] || 'auto';
                    let expr = match[3].trim();

                    // Simple expression evaluation
                    let val = this.evaluate(expr);
                    this.variables[name] = { type, value: val };
                }

                // 2. Print: print("hi")
                match = line.match(/print\s*\(\s*"([^"]*)"\s*\)/);
                if (match) {
                    this.output += match[1] + '\n';
                }

                // printf("fmt", args)
                match = line.match(/printf\s*\(\s*"([^"]*)"\s*,\s*(.+)\s*\)/);
                if (match) {
                    let fmt = match[1];
                    let args = match[2].split(',').map(s => s.trim());
                    let result = fmt;
                    args.forEach(arg => {
                        let val = this.evaluate(arg);
                        result = result.replace(/%[dfsi]/, val);
                    });
                    this.output += result.replace(/\\n/g, '\n');
                }

                this.pc++;
                if (this.pc >= this.lines.length) {
                    this.isFinished = true;
                }
            }

            evaluate(expr) {
                // Check if it's a variable
                if (this.variables[expr]) {
                    return this.variables[expr].value;
                }

                // Check if it's a number
                if (/^-?\d+(\.\d+)?$/.test(expr)) {
                    return expr;
                }

                // Check if it's a string
                if (expr.startsWith('"') && expr.endsWith('"')) {
                    return expr.substring(1, expr.length - 1);
                }

                // Simple arithmetic
                if (expr.includes('+')) {
                    let parts = expr.split('+').map(p => this.evaluate(p.trim()));
                    if (parts.every(p => !isNaN(p))) {
                        return parts.reduce((a, b) => parseFloat(a) + parseFloat(b), 0).toString();
                    }
                    return parts.join('');
                }

                return expr;
            }
        }

        function highlightLine(lineIndex) {
            const lines = editor.value.split('\n');
            // In a real editor we'd use a better way, but for a textarea
            // we can just select the line to highlight it
            let start = 0;
            for (let i = 0; i < lineIndex; i++) {
                start += lines[i].length + 1;
            }
            const end = start + lines[lineIndex].length;

            editor.focus();
            editor.setSelectionRange(start, end);

            document.querySelectorAll('.output-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.remove('hidden');
        }

        // Format code (basic indentation)
        function formatCode() {
            const code = editor.value;
            let formatted = '';
            let indent = 0;
            const lines = code.split('\n');
            
            for (let line of lines) {
                line = line.trim();
                if (!line) {
                    formatted += '\n';
                    continue;
                }
                
                // Decrease indent for closing braces
                if (line.startsWith('}') || line.startsWith(']')) {
                    indent = Math.max(0, indent - 1);
                }
                
                // Add indentation
                formatted += '    '.repeat(indent) + line + '\n';
                
                // Increase indent after opening braces
                if (line.endsWith('{') || line.endsWith('[')) {
                    indent++;
                }
                
                // Handle inline braces like } else {
                if (line.includes('}') && line.endsWith('{')) {
                    // Already handled
                }
            }
            
            editor.value = formatted.trimEnd();
            
            const statusDot = document.getElementById('editorStatus');
            const statusText = document.getElementById('editorStatusText');
            statusDot.className = 'status-dot success';
            statusText.textContent = 'Formatted';
            
            // Also update outputs to reflect changes
            runCode();
