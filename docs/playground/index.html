<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLOW Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #6e7681;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --success: #3fb950;
            --error: #f85149;
            --warning: #d29922;
            --purple: #a371f7;
            --pink: #db61a2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.25rem;
        }

        .logo-badge {
            background: var(--bg-tertiary);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: var(--border);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .btn-success {
            background: var(--success);
            border-color: var(--success);
            color: #000;
        }

        .btn-success:hover {
            opacity: 0.9;
        }

        .btn-error {
            background: var(--error);
            border-color: var(--error);
            color: #fff;
        }

        .btn-error:hover {
            opacity: 0.9;
        }

        /* Main Layout */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        select {
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 0;
        }

        @media (max-width: 900px) {
            .editor-container {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-right: 1px solid var(--border);
        }

        .panel:last-child {
            border-right: none;
        }

        .panel-header {
            background: var(--bg-secondary);
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .panel-header .status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.success { background: var(--success); }
        .status-dot.error { background: var(--error); }
        .status-dot.running { background: var(--warning); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .panel-content {
            flex: 1;
            overflow: auto;
            min-height: 0;
        }

        /* Code Editor */
        #editor {
            width: 100%;
            height: 100%;
            padding: 1rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            border: none;
            resize: none;
            outline: none;
            tab-size: 4;
        }

        #editor::placeholder {
            color: var(--text-muted);
        }

        /* Output */
        .output-tabs {
            display: flex;
            gap: 0;
            background: var(--bg-secondary);
        }

        .output-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .output-tab:hover {
            color: var(--text-primary);
        }

        .output-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .output-content {
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .output-content.hidden {
            display: none;
        }

        .output-content.error {
            color: var(--error);
        }

        .output-content.success {
            color: var(--success);
        }

        /* Syntax Highlighting (basic) */
        .keyword { color: var(--pink); }
        .type { color: var(--accent); }
        .string { color: var(--success); }
        .number { color: var(--warning); }
        .comment { color: var(--text-muted); font-style: italic; }
        .function { color: var(--purple); }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .keyboard-shortcuts {
            display: flex;
            gap: 1rem;
        }

        kbd {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.7rem;
        }

        /* Loading */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Share Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
        }

        .modal h3 {
            margin-bottom: 1rem;
        }

        .modal input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <header>
        <a href="../" class="logo">
            <div class="logo-icon">F</div>
            <span class="logo-text">FLOW Playground</span>
            <span class="logo-badge">v0.3.0</span>
        </a>
        <div class="header-actions">
            <button class="btn" onclick="shareCode()" title="Share code">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>

            </button>

                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub

    </header>

    <main>
        <div class="toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label">Example:</span>
                <select id="examples" onchange="loadExample()">
                    <option value="hello">Hello World</option>
                    <option value="fibonacci">Fibonacci</option>
                    <option value="struct">Structs</option>
                    <option value="generics">Generics</option>
                    <option value="effects">Effects</option>
                    <option value="pattern">Pattern Matching</option>
                    <option value="autodiff">Autodiff</option>
                    <option value="gpu">GPU Kernel</option>
                    <option value="neural">Neural Network</option>
                </select>
            </div>
            <div class="toolbar-group">
                <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.8rem; color: var(--text-secondary);">
                    <input type="checkbox" id="autoRun" style="cursor: pointer;">
                    Auto-run
                </label>
            </div>
            <div class="toolbar-group" style="margin-left: auto;">
                <button id="btnDebug" class="btn" onclick="debugCode()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="2"/>
                    </svg>
                    Debug
                </button>
                <div id="debugControls" style="display: none; gap: 0.5rem; align-items: center;">
                    <button class="btn" onclick="step()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 6 15 12 9 18"/>
                        </svg>
                        Step
                    </button>
                    <button class="btn" onclick="continueExecution()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        Continue
                    </button>
                    <button class="btn btn-error" onclick="stopDebugging()">
                        Stop

                <button class="btn" onclick="formatCode()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="21" y1="10" x2="3" y2="10"/>
                        <line x1="21" y1="6" x2="3" y2="6"/>
                        <line x1="21" y1="14" x2="3" y2="14"/>

                    </svg>
                    Format
                </button>
                <button class="btn btn-success" onclick="runCode()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    Run
                </button>
            </div>
        </div>

        <div class="editor-container">
            <div class="panel">
                <div class="panel-header">
                    <span>main.flow</span>
                    <span class="status">
                        <span class="status-dot" id="editorStatus"></span>
                        <span id="editorStatusText">Ready</span>
                    </span>
                </div>
                <div class="panel-content">
                    <textarea id="editor" spellcheck="false" placeholder="// Write your FLOW code here..."></textarea>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="output-tabs">
                        <button class="output-tab active" onclick="showTab('output')">Output</button>
                        <button class="output-tab" onclick="showTab('variables')">Variables</button>
                        <button class="output-tab" onclick="showTab('ast')">AST</button>
                        <button class="output-tab" onclick="showTab('c')">Generated C</button>
                        <button class="output-tab" onclick="showTab('mlir')">MLIR</button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="output" class="output-content">Click "Run" to execute your code.</div>
                    <div id="variables" class="output-content hidden">
                        <table style="width: 100%; border-collapse: collapse; font-family: inherit;">
                            <thead>
                                <tr style="border-bottom: 1px solid var(--border); text-align: left; color: var(--text-secondary); font-size: 0.75rem;">
                                    <th style="padding: 0.5rem; font-weight: 600;">Name</th>
                                    <th style="padding: 0.5rem; font-weight: 600;">Type</th>
                                    <th style="padding: 0.5rem; font-weight: 600;">Value</th>
                                </tr>
                            </thead>
                            <tbody id="variablesList">
                                <tr>
                                    <td colspan="3" style="padding: 2rem; color: var(--text-muted); text-align: center;">Start debugging to see variables</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="ast" class="output-content hidden"></div>
                    <div id="c" class="output-content hidden"></div>
                    <div id="mlir" class="output-content hidden"></div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <a href="../">Documentation</a> · 
            <a href="../comparison.html">Language Comparison</a> ·

    <!-- Share Modal -->

                <button class="btn btn-primary" onclick="copyShareUrl()">Copy URL</button>

    <script>
        // Example programs
        const examples = {
            hello: `// Hello World in FLOW
function main() -> i32 {
    print("Hello, World!")
    print("Welcome to FLOW Playground!")
    return 0
}`,

            fibonacci: `// Fibonacci sequence
function fibonacci(n: i32) -> i32 {
    if n <= 1 {
        return n
    }
    return fibonacci(n - 1) + fibonacci(n - 2)
}

function main() -> i32 {
    print("Fibonacci sequence:")
    for i in 0..10 {
        let fib = fibonacci(i)
        printf("fib(%d) = %d\\n", i, fib)
    }
    return 0
}`,

            struct: `// Structs and methods
struct Point {
    x: f32,
    y: f32
}

struct Rectangle {
    origin: Point,
    width: f32,
    height: f32
}

function point_distance(p1: Point, p2: Point) -> f32 {
    let dx = p2.x - p1.x
    let dy = p2.y - p1.y
    return sqrt(dx * dx + dy * dy)
}

function rect_area(r: Rectangle) -> f32 {
    return r.width * r.height
}

function main() -> i32 {
    let p1 = Point { x: 0.0, y: 0.0 }
    let p2 = Point { x: 3.0, y: 4.0 }
    
    printf("Distance: %f\\n", point_distance(p1, p2))
    
    let rect = Rectangle {
        origin: p1,
        width: 10.0,
        height: 5.0
    }
    
    printf("Area: %f\\n", rect_area(rect))
    return 0
}`,

            generics: `// Generic programming
struct Box<T> {
    value: T
}

struct Pair<A, B> {
    first: A,
    second: B
}

function identity<T>(x: T) -> T {
    return x
}

function swap<A, B>(p: Pair<A, B>) -> Pair<B, A> {
    return Pair<B, A> {
        first: p.second,
        second: p.first
    }
}

function main() -> i32 {
    // Generic box
    let int_box = Box<i32> { value: 42 }
    let float_box = Box<f32> { value: 3.14 }
    
    printf("Int box: %d\\n", int_box.value)
    printf("Float box: %f\\n", float_box.value)
    
    // Generic pair
    let pair = Pair<i32, f32> { first: 1, second: 2.5 }
    let swapped = swap(pair)
    
    printf("Swapped: (%f, %d)\\n", swapped.first, swapped.second)
    
    // Identity function
    let x = identity<i32>(100)
    printf("Identity: %d\\n", x)
    
    return 0
}`,

            effects: `// Algebraic Effects
effect Console {
    function print(msg: string) -> void
    function read() -> string
}

effect State<T> {
    function get() -> T
    function set(val: T) -> void
}

function counter() -> i32 with State<i32> {
    let current = State.get()
    State.set(current + 1)
    return current
}

function greet(name: string) -> void with Console {
    Console.print("Hello, ")
    Console.print(name)
    Console.print("!\\n")
}

capability StdioConsole for Console {
    function print(msg: string) -> void {
        printf("%s", msg)
    }
    
    function read() -> string {
        return "User"
    }
}

function main() -> i32 {
    handle greet("World") with StdioConsole
    return 0
}`,

            pattern: `// Pattern Matching
enum Option<T> {
    Some(T),
    None
}

enum Result<T, E> {
    Ok(T),
    Err(E)
}

function divide(a: f64, b: f64) -> Result<f64, string> {
    if b == 0.0 {
        return Err("division by zero")
    }
    return Ok(a / b)
}

function main() -> i32 {
    let result = divide(10.0, 2.0)
    
    match result {
        Ok(value) => {
            printf("Result: %f\\n", value)
        }
        Err(msg) => {
            printf("Error: %s\\n", msg)
        }
    }
    
    // Integer matching
    let x = 42
    match x {
        0 => print("zero")
        1 => print("one")
        42 => print("the answer!")
        _ => print("something else")
    }
    
    return 0
}`,

            autodiff: `// Automatic Differentiation
import "stdlib/autodiff.flow"

// Forward mode autodiff using dual numbers
function gradient_example() -> void {
    // Create dual number: x = 3.0, dx/dx = 1.0
    let x = dual(3.0, 1.0)
    
    // f(x) = x² 
    let f = dual_mul(x, x)
    
    printf("f(3) = %f\\n", f.val)    // 9.0
    printf("f'(3) = %f\\n", f.grad)  // 6.0 (derivative of x² is 2x)
    
    // g(x) = sin(x)
    let g = dual_sin(x)
    printf("sin(3) = %f\\n", g.val)
    printf("cos(3) = %f\\n", g.grad)  // derivative of sin is cos
    
    // h(x) = sigmoid(x)
    let h = dual_sigmoid(x)
    printf("sigmoid(3) = %f\\n", h.val)
    printf("sigmoid'(3) = %f\\n", h.grad)
}

function main() -> i32 {
    gradient_example()
    return 0
}`,

            gpu: `// GPU Kernel (generates Metal shader)
@gpu
function vector_add(
    a: array<f32>,
    b: array<f32>,
    out: array<f32>,
    n: i32
) {
    let i = gpu_thread_id()
    if i < n {
        out[i] = a[i] + b[i]
    }
}

@gpu
function matrix_multiply(
    A: array<f32>,
    B: array<f32>,
    C: array<f32>,
    M: i32,
    N: i32,
    K: i32
) {
    let idx = gpu_thread_id()
    let row = idx / N
    let col = idx % N

            const cos_scaled = (x, a) => new Dual(Math.cos(a * x.val), -a * Math.sin(a * x.val) * x.grad);
            const exp_scaled = (x, a) => { const e = Math.exp(a * x.val); return new Dual(e, a * e * x.grad); };
            
            const sum3 = (a, b, c) => new Dual(a.val + b.val + c.val, a.grad + b.grad + c.grad);
            const weighted_sum = (f, a, g, b) => new Dual(a * f.val + b * g.val, a * f.grad + b * g.grad);
            
            // Additional helpers for cleaner syntax
            const neg = (x) => new Dual(-x.val, -x.grad);
            const smul = (a, x) => new Dual(a * x.val, a * x.grad);  // scalar * Dual
            const addc = (a, x) => new Dual(a + x.val, x.grad);      // scalar + Dual
            const rsub = (a, x) => new Dual(a - x.val, -x.grad);     // scalar - Dual
            
            // Short aliases for transcendentals
            const sigmoid = dual_sigmoid;
            const log = dual_log;
            const exp_d = dual_exp;  // renamed to avoid conflict with Math.exp
            const sin_d = dual_sin;
            const cos_d = dual_cos;
            const tanh_d = dual_tanh;
            
            // Try to find and evaluate autodiff expressions
            const results = [];
            
            // Look for variable declarations like dx(0.7) or dual(3.0, 1.0)
            const varMatches = [...code.matchAll(/let\s+(\w+)\s*=\s*dx\s*\(\s*([\d.]+)\s*\)/g)];
            for (const m of varMatches) {
                const varName = m[1];
                const xVal = parseFloat(m[2]);
                output += `Variable: ${varName} = ${xVal} (tracking derivative)\n`;
            }
            
            const dualVarMatches = [...code.matchAll(/let\s+(\w+)\s*=\s*dual\s*\(\s*([\d.]+)\s*,\s*1\.0\s*\)/g)];
            for (const m of dualVarMatches) {
                const varName = m[1];
                const xVal = parseFloat(m[2]);
                output += `Variable: ${varName} = ${xVal} (tracking derivative)\n`;
            }
            
            output += '\n';
            
            // Try to evaluate specific patterns
            // Energy function: E(x) = (x − 1)² + sin(3x) + 0.1 * x⁴
            if (code.includes('sq_diff') && code.includes('sin_scaled') && code.includes('pow4')) {
                // Extract x value
                let xVal = 0.7;
                const xMatch = code.match(/dx\s*\(\s*([\d.]+)\s*\)/);
                if (xMatch) xVal = parseFloat(xMatch[1]);
                
                const x = dx(xVal);
                const term1 = sq_diff(x, 1.0);
                const term2 = sin_scaled(x, 3.0);
                const term3 = mul(pow4(x), 0.1);
                const E = sum3(term1, term2, term3);
                
                output += `Computing: E(x) = (x-1)² + sin(3x) + 0.1·x⁴\n`;
                output += `At x = ${xVal}:\n\n`;
                output += `  (x-1)²     = ${term1.val.toFixed(6)}  (deriv: ${term1.grad.toFixed(6)})\n`;
                output += `  sin(3x)    = ${term2.val.toFixed(6)}  (deriv: ${term2.grad.toFixed(6)})\n`;
                output += `  0.1·x⁴     = ${term3.val.toFixed(6)}  (deriv: ${term3.grad.toFixed(6)})\n`;
                output += `  ─────────────────────────────────────\n`;
                output += `  E(${xVal})    = ${E.val.toFixed(6)}\n`;
                output += `  dE/dx     = ${E.grad.toFixed(6)}\n`;
            }
            // Newton step example
            else if (code.includes('newton') || code.includes('hessian')) {
                let xVal = 0.7;
                const xMatch = code.match(/(?:x0|x)\s*=\s*([\d.]+)/);
                if (xMatch) xVal = parseFloat(xMatch[1]);
                
                const x = dx(xVal);
                
                // E(x) = (x-1)² + sin(3x) + 0.1x⁴
                const computeE = (xd) => {
                    const t1 = sq_diff(xd, 1.0);
                    const t2 = sin_scaled(xd, 3.0);
                    const t3 = mul(pow4(xd), 0.1);
                    return sum3(t1, t2, t3);
                };
                
                const E = computeE(x);
                
                // Numerical second derivative
                const eps = 1e-4;
                const E_plus = computeE(dx(xVal + eps));
                const E_minus = computeE(dx(xVal - eps));
                const hessian = (E_plus.grad - E_minus.grad) / (2 * eps);
                const x_next = xVal - E.grad / hessian;
                
                output += `Newton's Method on E(x) = (x-1)² + sin(3x) + 0.1·x⁴\n`;
                output += `Starting at x₀ = ${xVal}\n\n`;
                output += `  E(x₀)     = ${E.val.toFixed(6)}\n`;
                output += `  dE/dx     = ${E.grad.toFixed(6)}\n`;
                output += `  d²E/dx²   = ${hessian.toFixed(6)}  (numerical)\n`;
                output += `  ─────────────────────────────────────\n`;
                output += `  Newton x₁ = ${x_next.toFixed(6)}\n`;
                
                // Show convergence
                const E_new = computeE(dx(x_next));
                output += `  E(x₁)     = ${E_new.val.toFixed(6)}  (${E_new.val < E.val ? '↓ improved!' : 'no improvement'})\n`;
            }
            // Physics force example
            else if (code.includes('force') || code.includes('spring')) {
                let xVal = 0.4;
                const xMatch = code.match(/dx\s*\(\s*([\d.-]+)\s*\)/);
                if (xMatch) xVal = parseFloat(xMatch[1]);
                
                const x = dx(xVal);
                const k = 2.0;
                
                // E = 0.5*k*x² + 0.05*sin(5x)
                const spring = mul(sq(x), 0.5 * k);
                const ripple = mul(sin_scaled(x, 5.0), 0.05);
                const E = dual_add(spring, ripple);
                const force = -E.grad;
                
                output += `Harmonic Oscillator with Perturbation\n`;
                output += `E(x) = 0.5·k·x² + 0.05·sin(5x)  where k = ${k}\n`;
                output += `At x = ${xVal}:\n\n`;
                output += `  Spring energy  = ${spring.val.toFixed(6)}\n`;
                output += `  Ripple energy  = ${ripple.val.toFixed(6)}\n`;
                output += `  ─────────────────────────────────────\n`;
                output += `  Total E(x)     = ${E.val.toFixed(6)}\n`;
                output += `  Force = -dE/dx = ${force.toFixed(6)}\n`;
            }
            // Rosenbrock function
            else if (code.includes('rosenbrock') || code.includes('Rosenbrock') || 
                     (code.includes('100') && code.includes('sq_diff'))) {
                let xVal = 0.8;
                const xMatch = code.match(/dx\s*\(\s*([\d.-]+)\s*\)/);
                if (xMatch) xVal = parseFloat(xMatch[1]);
                
                const x = dx(xVal);
                
                // f(x) = (1 - x)² + 100(x² - 1)²
                const term1 = sq_diff(x, 1.0);                      // (1 - x)²
                const x_sq = sq(x);
                const term2_inner = sq_diff(x_sq, 1.0);             // (x² - 1)²
                const term2 = smul(100.0, term2_inner);             // 100 * (x² - 1)²
                const f = dual_add(term1, term2);
                
                output += `Rosenbrock Function (1D slice)\n`;
                output += `f(x) = (1 - x)² + 100(x² - 1)²\n`;
                output += `Global minimum at x = 1\n\n`;
                output += `At x = ${xVal}:\n\n`;
                output += `  (1 - x)²        = ${term1.val.toFixed(6)}  (deriv: ${term1.grad.toFixed(6)})\n`;
                output += `  (x² - 1)²       = ${term2_inner.val.toFixed(6)}  (deriv: ${term2_inner.grad.toFixed(6)})\n`;
                output += `  100(x² - 1)²    = ${term2.val.toFixed(6)}  (deriv: ${term2.grad.toFixed(6)})\n`;
                output += `  ─────────────────────────────────────\n`;
                output += `  f(${xVal})        = ${f.val.toFixed(6)}\n`;
                output += `  df/dx          = ${f.grad.toFixed(6)}\n`;
                
                // Show how far from minimum
                const f_at_1 = 0.0;
                output += `\n  f(1.0) = ${f_at_1.toFixed(6)}  (minimum)\n`;
            }
            // Logistic loss
            else if (code.includes('logistic') || code.includes('Logistic') || 
                     (code.includes('sigmoid') && code.includes('log'))) {
                let wVal = -0.4;
                const wMatch = code.match(/dx\s*\(\s*([\d.-]+)\s*\)/);
                if (wMatch) wVal = parseFloat(wMatch[1]);
                
                const w = dx(wVal);
                const y = 1.0;  // label
                
                // L(w) = -[ y log σ(w) + (1-y) log(1-σ(w)) ]
                const p = dual_sigmoid(w);
                const log_p = dual_log(p);
                const one_minus_p = rsub(1.0, p);
                const log_one_minus_p = dual_log(one_minus_p);
                
                const loss_pos = smul(y, log_p);
                const loss_neg = smul(1.0 - y, log_one_minus_p);
                const L = neg(dual_add(loss_pos, loss_neg));
                
                output += `Logistic Regression Loss (single sample)\n`;
                output += `L(w) = -[ y·log(σ(w)) + (1-y)·log(1-σ(w)) ]\n`;
                output += `where σ(w) = 1/(1+e^(-w))  (sigmoid)\n\n`;
                output += `At w = ${wVal}, y = ${y}:\n\n`;
                output += `  σ(w)           = ${p.val.toFixed(6)}\n`;
                output += `  log(σ(w))      = ${log_p.val.toFixed(6)}\n`;
                output += `  1 - σ(w)       = ${one_minus_p.val.toFixed(6)}\n`;
                output += `  ─────────────────────────────────────\n`;
                output += `  L(w)           = ${L.val.toFixed(6)}\n`;
                output += `  dL/dw          = ${L.grad.toFixed(6)}\n`;
                output += `\n  (gradient points toward increasing loss)\n`;
                output += `  To minimize: w_new = w - lr * dL/dw\n`;
            }
            // Generic autodiff - basic operations
            else if (code.includes('dual_mul(x, x)') || code.includes('sq(x)')) {
                let xVal = 3.0;
                const xMatch = code.match(/(?:dual|dx)\s*\(\s*([\d.]+)/);
                if (xMatch) xVal = parseFloat(xMatch[1]);
                
                const x = dx(xVal);
                output += `At x = ${xVal}:\n\n`;
                
                if (code.includes('dual_mul(x, x)') || code.includes('sq(x)')) {
                    const f = sq(x);
                    output += `  f(x) = x²\n`;
                    output += `  f(${xVal}) = ${f.val.toFixed(6)}\n`;
                    output += `  f'(${xVal}) = ${f.grad.toFixed(6)}  (= 2x)\n\n`;
                }
                if (code.includes('dual_sin')) {
                    const g = dual_sin(x);
                    output += `  g(x) = sin(x)\n`;
                    output += `  g(${xVal}) = ${g.val.toFixed(6)}\n`;
                    output += `  g'(${xVal}) = ${g.grad.toFixed(6)}  (= cos(x))\n\n`;
                }
                if (code.includes('dual_sigmoid')) {
                    const h = dual_sigmoid(x);
                    output += `  h(x) = sigmoid(x)\n`;
                    output += `  h(${xVal}) = ${h.val.toFixed(6)}\n`;
                    output += `  h'(${xVal}) = ${h.grad.toFixed(6)}  (= σ(1-σ))\n\n`;
                }
            }
            // Default fallback
            else {
                output += `Detected autodiff code.\n\n`;
                output += `The playground can compute:\n`;
                output += `  • Basic operations: sq(x), cube(x), pow4(x)\n`;
                output += `  • Transcendentals: sin, cos, exp, log, sigmoid, tanh\n`;
                output += `  • Combined: sq_diff(x,c), sin_scaled(x,a), sum3(a,b,c)\n\n`;
                output += `Try the examples or use common patterns for computed results!\n`;
            }
            
            output += `\n═══════════════════════════════════════
  Forward-mode autodiff computes f(x) and f'(x) 
  in a single forward pass using dual numbers
═══════════════════════════════════════`;
            
            return output;
        }

        // Debugging state
        let isDebugging = false;
        let debugSession = null;

        class FlowDebugger {
            constructor(code) {
                this.lines = code.split('\n');
                this.pc = -1;
                this.variables = {};
                this.callStack = [];
                this.output = '';
                this.isFinished = false;

                // Find main
                for (let i = 0; i < this.lines.length; i++) {
                    if (this.lines[i].includes('function main')) {
                        this.pc = i;
                        break;
                    }
                }
                if (this.pc === -1) this.pc = 0;
            }

            step() {
                if (this.pc >= this.lines.length) {
                    this.isFinished = true;
                    return;
                }

                const line = this.lines[this.pc].trim();

                // Skip empty lines and comments
                if (!line || line.startsWith('//') || line.startsWith('function') || line === '}') {
                    this.pc++;
                    if (this.pc >= this.lines.length) {
                        this.isFinished = true;
                    } else {
                        return this.step();
                    }
                    return;
                }

                // Simple "Execution"
                // 1. Assignments: let x = 5
                let match = line.match(/let\s+(?:mut\s+)?(\w+)(?:\s*:\s*([^=]+))?\s*=\s*(.+)/);
                if (match) {
                    const name = match[1];
                    const type = match[2] || 'auto';
                    let expr = match[3].trim();

                    // Simple expression evaluation
                    let val = this.evaluate(expr);
                    this.variables[name] = { type, value: val };
                }

                // 2. Print: print("hi")
                match = line.match(/print\s*\(\s*"([^"]*)"\s*\)/);
                if (match) {
                    this.output += match[1] + '\n';
                }

                // printf("fmt", args)
                match = line.match(/printf\s*\(\s*"([^"]*)"\s*,\s*(.+)\s*\)/);
                if (match) {
                    let fmt = match[1];
                    let args = match[2].split(',').map(s => s.trim());
                    let result = fmt;
                    args.forEach(arg => {
                        let val = this.evaluate(arg);
                        result = result.replace(/%[dfsi]/, val);
                    });
                    this.output += result.replace(/\\n/g, '\n');
                }

                this.pc++;
                if (this.pc >= this.lines.length) {
                    this.isFinished = true;
                }
            }

            evaluate(expr) {
                // Check if it's a variable
                if (this.variables[expr]) {
                    return this.variables[expr].value;
                }

                // Check if it's a number
                if (/^-?\d+(\.\d+)?$/.test(expr)) {
                    return expr;
                }

                // Check if it's a string
                if (expr.startsWith('"') && expr.endsWith('"')) {
                    return expr.substring(1, expr.length - 1);
                }

                // Simple arithmetic
                if (expr.includes('+')) {
                    let parts = expr.split('+').map(p => this.evaluate(p.trim()));
                    if (parts.every(p => !isNaN(p))) {
                        return parts.reduce((a, b) => parseFloat(a) + parseFloat(b), 0).toString();
                    }
                    return parts.join('');
                }

                return expr;
            }
        }

        function debugCode() {
            isDebugging = true;
            debugSession = new FlowDebugger(editor.value);

            document.getElementById('btnDebug').style.display = 'none';
            document.getElementById('debugControls').style.display = 'flex';
            document.getElementById('editorStatusText').textContent = 'Debugging...';
            document.getElementById('editorStatus').className = 'status-dot running';

            updateDebugUI();
            showTab('output');
            document.getElementById('output').textContent = 'Debugging started...';
        }

        function stopDebugging() {
            isDebugging = false;
            debugSession = null;
            document.getElementById('btnDebug').style.display = 'flex';
            document.getElementById('debugControls').style.display = 'none';
            document.getElementById('editorStatusText').textContent = 'Ready';
            document.getElementById('editorStatus').className = 'status-dot';
            removeHighlight();
        }

        function step() {
            if (!isDebugging || !debugSession) return;

            debugSession.step();
            updateDebugUI();

            if (debugSession.isFinished) {
                document.getElementById('output').textContent += '\nProgram finished.';
                stopDebugging();
            }
        }

        function updateDebugUI() {
            if (!debugSession) return;

            highlightLine(debugSession.pc);
            document.getElementById('output').textContent = 'Debugging started...\n\n' + debugSession.output;

            // Update variables table
            const list = document.getElementById('variablesList');
            list.innerHTML = '';

            const varNames = Object.keys(debugSession.variables);
            if (varNames.length === 0) {
                list.innerHTML = '<tr><td colspan="3" style="padding: 2rem; color: var(--text-muted); text-align: center;">No variables in scope</td></tr>';
            } else {
                varNames.forEach(name => {
                    const info = debugSession.variables[name];
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid var(--border)';
                    row.innerHTML = `
                        <td style="padding: 0.5rem; color: var(--purple);">${name}</td>
                        <td style="padding: 0.5rem; color: var(--accent); font-size: 0.8rem;">${info.type}</td>
                        <td style="padding: 0.5rem; color: var(--warning);">${info.value}</td>
                    `;
                    list.appendChild(row);
                });
            }
        }

        function continueExecution() {
            if (!isDebugging) return;
            stopDebugging();
            runCode();
        }

        function highlightLine(lineIndex) {
            const lines = editor.value.split('\n');
            // In a real editor we'd use a better way, but for a textarea
            // we can just select the line to highlight it
            let start = 0;
            for (let i = 0; i < lineIndex; i++) {
                start += lines[i].length + 1;
            }
            const end = start + lines[lineIndex].length;

            editor.focus();
            editor.setSelectionRange(start, end);
        }

        function removeHighlight() {
            editor.setSelectionRange(0, 0);
        }

        // Tab switching
        function showTab(tabName) {
            document.querySelectorAll('.output-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.output-content').forEach(content => {
                content.classList.add('hidden');
            });
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.remove('hidden');
        }

        // Format code (basic indentation)
        function formatCode() {
            const code = editor.value;
            let formatted = '';
            let indent = 0;
            const lines = code.split('\n');
            
            for (let line of lines) {
                line = line.trim();
                if (!line) {
                    formatted += '\n';
                    continue;
                }
                
                // Decrease indent for closing braces
                if (line.startsWith('}') || line.startsWith(']')) {
                    indent = Math.max(0, indent - 1);
                }
                
                // Add indentation
                formatted += '    '.repeat(indent) + line + '\n';
                
                // Increase indent after opening braces
                if (line.endsWith('{') || line.endsWith('[')) {
                    indent++;
                }
                
                // Handle inline braces like } else {
                if (line.includes('}') && line.endsWith('{')) {
                    // Already handled
                }
            }
            
            editor.value = formatted.trimEnd();
            
            const statusDot = document.getElementById('editorStatus');
            const statusText = document.getElementById('editorStatusText');
            statusDot.className = 'status-dot success';
            statusText.textContent = 'Formatted';
            
            // Also update outputs to reflect changes
            runCode();
        }

        // Clear output
        function clearOutput() {
            document.getElementById('output').textContent = 'Click "Run" to execute your code.';
            document.getElementById('output').className = 'output-content';
            document.getElementById('ast').textContent = '';
            document.getElementById('c').textContent = '';
            document.getElementById('mlir').textContent = '';
        }

        // Share code
        function shareCode() {
            const code = editor.value;
            const encoded = btoa(encodeURIComponent(code));
            const url = window.location.origin + window.location.pathname + '?code=' + encoded;
            
            document.getElementById('shareUrl').value = url;
            document.getElementById('shareModal').classList.add('visible');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.remove('visible');
        }

        function copyShareUrl() {
            const input = document.getElementById('shareUrl');
            input.select();
            document.execCommand('copy');
            closeShareModal();
        }

        // Load shared code from URL
        function loadFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                try {
                    editor.value = decodeURIComponent(atob(code));
                } catch (e) {
                    console.error('Failed to decode shared code');
                }
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                formatCode();
            }
        });

        // Initialize
        loadFromUrl();
    </script>
