<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Tutorials — Flow</title>
    <meta name="description" content="Learn Flow with browser-based compile and run exercises.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../wiki.css">
    <link rel="stylesheet" href="../tutorial-runner.css">
    <script>
        // Same bootstrap as the docs shell so the theme carries across pages.
        (function () {
            try {
                var t = localStorage.getItem('flow-wiki-theme');
                if (t !== 'light' && t !== 'dark') t = 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body class="tutorials-shell">
    <header class="site-header">
        <div class="header-inner">
            <a href="../" class="brand">
                <img src="../assets/flow-logo-alone.png" alt="Flow logo" class="brand-mark" width="30" height="30">
                <span class="brand-name">Flow</span>
                <span class="brand-tag">tutorials</span>
            </a>
            <div class="header-tools">
                <button type="button" class="btn theme-toggle" id="themeToggle" aria-label="Toggle color theme"><span class="sr-only">Toggle color theme</span></button>
                <a href="../#tutorials%2Fbeginner.md" class="btn">Written guides</a>
                <a href="https://github.com/flooooooooooow/flow" class="btn" target="_blank" rel="noopener">GitHub</a>

    <div class="tutorials-toolbar">
        <div class="tutorials-tracks" data-tracks aria-label="Difficulty track"></div>
        <div class="tutorials-progress" data-progress></div>
    </div>

    <div class="tutorials-app" data-tutorials-app>
        <aside class="tutorials-sidebar">
            <h2>Lessons</h2>
            <div data-lessons></div>
        </aside>
        <main class="tutorials-main" data-lesson-main>
            <p class="loading">Loading lessons…</p>
        </main>
    </div>

    <footer class="site-footer">
        <span>100+ browser lessons · interpreter, not the native compiler</span>
        <span class="footer-sep">·</span>
        <a href="../">Documentation</a>
    </footer>

    <script src="../vendor/highlight.min.js"></script>
    <script src="../flow-lang.js"></script>
    <script src="../flow-editor.js"></script>
    <script src="../flow-compile.js"></script>
    <script src="../tutorial-runner.js"></script>
    <script>
        (function () {
            var KEY = 'flow-wiki-theme';
            var btn = document.getElementById('themeToggle');
            btn.addEventListener('click', function () {
                var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem(KEY, next); } catch (e) { /* private mode */ }
            });
            initTutorialsApp(document.body);
        })();
    </script>
</body>
</html>
