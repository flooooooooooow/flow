<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow GPU graph — WebGPU copy</title>
</head>
<body>
  <main>
    <h1>Flow GPU graph: actual WebGPU dispatch</h1>
    <p>The shader and binding reflection are generated by Flow.
       Before serving this page, run <code>node tools/gpu_graph/export_copy.mjs</code>
       from the repository root.</p>
    <button id="run">Execute on GPU</button>
    <pre id="output" aria-live="polite">Not executed.</pre>
  </main>
  <script type="module">
    import {getDevice} from "./webgpu-host.js";
    import {runFlowGraphCopy} from "./gpu-graph-copy.mjs";
    const button=document.getElementById("run");
    const output=document.getElementById("output");
    button.addEventListener("click", async () => {
      button.disabled=true;
      output.textContent="Requesting WebGPU device...";
      try {
        const [shader,meta]=await Promise.all([
          fetch("./generated/copy_f32.wgsl"),
          fetch("./generated/copy_f32.json")
        ]);
        if(!shader.ok || !meta.ok){
          throw new Error("Flow artifacts missing. Run node tools/gpu_graph/export_copy.mjs.");
        }
        const wgsl=await shader.text();
        const reflection=await meta.json();
        const {device}=await getDevice();
        const input=new Float32Array([1,-4,Math.PI,0.125,17]);
        const result=await runFlowGraphCopy(device,{wgsl,reflection,input});
        output.textContent=result.execution+"\n"+
          "Elements: "+result.elements+"\n"+
          "Input: "+Array.from(input).join(", ")+"\n"+
          "Readback: "+Array.from(result.output).join(", ");
        device.destroy();
      } catch(error){
        output.textContent="Execution failed: "+error.message;
      } finally {
        button.disabled=false;
      }
    });
  </script>
</body>
</html>
